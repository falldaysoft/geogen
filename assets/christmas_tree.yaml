      - { parts: [trunk, boughs_0, boughs_1, boughs_2, boughs_3, boughs_4, boughs_5, star], show: [up] }
  box:
    initial: away
    duration: 0.2
    states: { away: {}, out: {} }
    motions:
      - { parts: [box, box_ornament_0, box_ornament_1, box_ornament_2], show: [out] }
  hook_0:
