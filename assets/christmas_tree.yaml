interactions:
  tree:
    initial: absent
    duration: 0.3
    states: { absent: {}, up: {} }
    motions:
      - { parts: [trunk, boughs_0, boughs_1, boughs_2, boughs_3, boughs_4, boughs_5, star], show: [up] }
  box:
    initial: away
    duration: 0.2
    states: { away: {}, out: {} }
    motions:
      - { parts: [box, box_ornament_0, box_ornament_1, box_ornament_2], show: [out] }
  fairy:
    initial: dark
    duration: 0.3
    states: { dark: {}, glowing: {} }
    motions:
      - { parts: [bulb_0, bulb_1, bulb_2, bulb_3, bulb_4, bulb_5, bulb_6, bulb_7, bulb_8, bulb_9, bulb_10, bulb_11, bulb_12, bulb_13, bulb_14, bulb_15, bulb_16, bulb_17], show: [glowing] }
  hook_0:
    initial: empty
    duration: 0.2
    states: { empty: {}, hung: {} }
    motions:
      - { parts: [ornament_0], show: [hung] }
  hook_1:
