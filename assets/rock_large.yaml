# Large rock - big boulder
# Origin at bottom_center
name: rock_large
origin: bottom_center

params:
  width:  { default: 1.2 }
  height: { default: 0.9 }
  depth:  { default: 1.0 }

size: ["{width}", "{height}", "{depth}"]

parts:
  body:
    primitive: sphere
    size: [1.0, 0.75, 0.85]  # Irregular proportions
    anchor: bottom_center
    offset: [0, 0, 0]
    material: rock
