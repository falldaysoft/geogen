# Simple house — parametric rectangular house with flat roof.
# Front of house faces +Z. Origin is at bottom_center.
#
# Parameters:
#   width:  house width in metres (default 8)
#   depth:  house depth in metres (default 6)
#   height: wall height in metres (default 4, incl. foundation)
#
# All part sizes use fractions of the top-level `size`, so the visible model
# at default params is identical to the pre-parametric version. Override
# params at load time (LayoutLoader.load(path, params={"width": 12}) ...)
# to generate a different-sized house.

name: house_simple
origin: bottom_center

params:
  width:  { default: 8 }
  depth:  { default: 6 }
  height: { default: 4 }

size: ["{width}", "{height}", "{depth}"]

parts:
  # Foundation strip (concrete base)
  foundation:
    primitive: cube
    size: [0.98, 0.06, 0.98]
    anchor: bottom_center
    offset: [0, 0, 0]
    bevel: 0.005
    material: concrete

  # Main structure (walls)
  walls:
    primitive: cube
    size: [0.95, 0.60, 0.95]
    anchor: bottom_center
    offset: [0, 0.06, 0]
    material: brick

  # Front door (on +Z face)
  door:
    primitive: cube
    size: [0.12, 0.40, 0.02]
    anchor: bottom_front_center
    offset: [0, 0.06, 0.01]
    bevel: 0.005
    material: wood

  # Door frame
  door_frame_top:
    primitive: cube
    size: [0.14, 0.015, 0.025]
    anchor: bottom_front_center
    offset: [0, 0.46, 0.01]
    bevel: 0
    material: wood

  # Left front window
  window_left:
    primitive: cube
    size: [0.12, 0.12, 0.02]
    anchor: bottom_front_center
    offset: [-0.28, 0.30, 0.01]
    bevel: 0.003
    material: metal

  # Window sill left
  sill_left:
    primitive: cube
    size: [0.14, 0.015, 0.03]
    anchor: bottom_front_center
    offset: [-0.28, 0.29, 0.015]
    bevel: 0
    material: concrete

  # Right front window
  window_right:
    primitive: cube
    size: [0.12, 0.12, 0.02]
    anchor: bottom_front_center
    offset: [0.28, 0.30, 0.01]
    bevel: 0.003
    material: metal

  # Window sill right
  sill_right:
    primitive: cube
    size: [0.14, 0.015, 0.03]
    anchor: bottom_front_center
    offset: [0.28, 0.29, 0.015]
    bevel: 0
    material: concrete

  # Roof - flat with overhang
  roof:
    primitive: cube
    size: [1.08, 0.06, 1.08]
    anchor: bottom_center
    offset: [0, 0.66, 0]
    bevel: 0.01
    material: roof_shingle

  # Roof cap (slightly raised center)
  roof_cap:
    primitive: cube
    size: [0.88, 0.04, 0.88]
    anchor: bottom_center
    offset: [0, 0.72, 0]
    bevel: 0.008
    material: roof_shingle

  # Chimney
  chimney:
    primitive: cube
    size: [0.08, 0.18, 0.08]
    anchor: bottom_center
    offset: [0.30, 0.72, -0.25]
    material: brick

# Re-export useful surfaces for scene-level placement (e.g. placing a
# doormat, lamp, or decoration on the front wall or roof).
surfaces:
  front_wall: { from: walls.front }
  back_wall:  { from: walls.back }
  left_wall:  { from: walls.left }
  right_wall: { from: walls.right }
  roof:       { from: roof.top }
