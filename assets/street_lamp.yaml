# Street lamp: a tapered cast-iron post with a glass lantern. Origin at the
# bottom centre; parts in metres (the container is a unit, `scale` scales it).
# The light is `auto: night`: runtimes switch it (and the lantern's glow) on
# after dark.

name: street_lamp
tags: [street.lamp]
origin: bottom_center

params:
  scale: { default: 1 }

size: ["{scale}", "{scale}", "{scale}"]
bounds: geometry     # declared size = the real extent (the container above is a unit)

light: { energy: 2.5, range: 13.0, color: [1.0, 0.82, 0.58], offset: [0, "{4.12 * scale}", 0], auto: night }

parts:
  base:
    primitive: lathe
    profile: [[0, 0], [1.0, 0], [1.0, 0.12], [0.8, 0.2], [0.72, 0.55], [0.55, 0.75], [0.5, 1.0], [0, 1.0]]
    size: ["{0.34 * scale}", "{0.55 * scale}", "{0.34 * scale}"]
    anchor: bottom_center
    segments: 24
    material: lamp_iron
    collider: hull

  post:
    primitive: lathe
    profile: [[0, 0], [1.0, 0], [0.62, 1.0], [0, 1.0]]
    size: ["{0.16 * scale}", "{3.35 * scale}", "{0.16 * scale}"]
    anchor: bottom_center
    offset: [0, "{0.55 * scale}", 0]
    segments: 20
    material: lamp_iron

  collar:
    primitive: lathe
    profile: [[0, 0], [0.7, 0], [1.0, 0.4], [1.0, 0.6], [0.6, 1.0], [0, 1.0]]
    size: ["{0.2 * scale}", "{0.12 * scale}", "{0.2 * scale}"]
    anchor: bottom_center
    offset: [0, "{3.88 * scale}", 0]
    segments: 20
    material: lamp_iron

  lantern:
    primitive: lathe
    profile: [[0, 0], [0.55, 0], [1.0, 1.0], [0, 1.0]]
    size: ["{0.36 * scale}", "{0.36 * scale}", "{0.36 * scale}"]
    anchor: bottom_center
    offset: [0, "{4.0 * scale}", 0]
    segments: 6
    crease_angle: 20
    material: lamp_glass
    collider: none

  roof:
    primitive: lathe
    profile: [[0, 0], [1.0, 0], [1.0, 0.12], [0.2, 0.85], [0, 1.0]]
    size: ["{0.46 * scale}", "{0.2 * scale}", "{0.46 * scale}"]
    anchor: bottom_center
    offset: [0, "{4.36 * scale}", 0]
    segments: 6
    crease_angle: 20
    material: lamp_iron
    collider: none

  finial:
    primitive: sphere
    size: ["{0.07 * scale}", "{0.07 * scale}", "{0.07 * scale}"]
    anchor: bottom_center
    offset: [0, "{4.54 * scale}", 0]
    material: lamp_iron
    collider: none
