# A low cloud with its own shower: rain falls from a box under it to the ground.
# Bind or set `belly.running` to stop it. Origin: on the ground under the cloud.

name: rain_cloud
tags: [decor.weather]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

params:
  height: { default: 6.0 }       # underside of the cloud above the ground

parts:
  belly:
    primitive: lathe
    profile: &puff { spline: [[0, 0], [0.34, 0.06], [0.5, 0.45], [0.36, 0.86], [0, 1]] }
    segments: 24
    size: [6.5, 1.3, 5.5]
    anchor: bottom_center
    offset: [0, "{height}", 0]
    material: ceiling_white
    tint: [0.5, 0.52, 0.56]
    collider: none
    emitter:
      at: bottom
      area: [6, 0.1, 5]
      rate: 2600
      lifetime: 0.56             # the time to fall to the ground from 6 m at this speed
      speed: [8, 9.5]
      direction: [0, -1, 0]
      spread: 2
      gravity: 9.81
      size: 0.014
      color: [0.72, 0.8, 0.92]
      opacity: 0.6
      material: streak
    sound: { at: bottom, band: [1200, 8000], flutter: 0.15, volume_db: -10, range: 22 }
  top_a:
    primitive: lathe
    profile: *puff
    segments: 20
    size: [3.6, 1.6, 3.2]
    anchor: bottom_center
    offset: [-1.1, "{height + 0.5}", 0.3]
    material: ceiling_white
    tint: [0.62, 0.64, 0.68]
    collider: none
  top_b:
    primitive: lathe
    profile: *puff
    segments: 20
    size: [3.0, 1.3, 2.8]
    anchor: bottom_center
    offset: [1.4, "{height + 0.45}", -0.4]
    material: ceiling_white
    tint: [0.58, 0.6, 0.64]
    collider: none
