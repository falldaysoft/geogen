# Medium rock - larger irregular boulder
# Origin at bottom_center
name: rock_medium
origin: bottom_center

params:
  width:  { default: 0.6 }
  height: { default: 0.45 }
  depth:  { default: 0.55 }

size: ["{width}", "{height}", "{depth}"]

parts:
  body:
    primitive: sphere
    size: [1.0, 0.75, 0.9]  # Irregular proportions
    anchor: bottom_center
    offset: [0, 0, 0]
    material: rock
