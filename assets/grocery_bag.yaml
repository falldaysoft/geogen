# A paper bag of groceries with greens showing at the top: raw food out of the fridge
# (items/raw_food.yaml), before a range or a microwave makes a meal of it.

name: grocery_bag
tags: [food.raw]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

parts:
  bag:
    primitive: cube
    size: [0.16, 0.2, 0.1]
    anchor: bottom_center
    bevel: 0.008
    material: cardboard
    collider: none
  greens:
    primitive: ellipsoid
    size: [0.12, 0.07, 0.08]
    anchor: bottom_center
    offset: [0.01, 0.17, 0]
    material: crop_leaf
    collider: none
