# Brick cottage shell with a pitched (gable) roof.
#
# The walls are a hollow brick shell, so windows and doors placed on its wall
# surfaces cut real openings (see scenes/cottage.yaml). Inside there is an
# interior finish: floorboards, a plaster lining (cut by the same openings)
# and a ceiling at the wall top. Front faces +Z,
# origin at bottom_center.

name: house_peaked
origin: bottom_center

params:
  width:          { default: 8 }
  depth:          { default: 6 }
  wall_height:    { default: 2.8 }
  roof_height:    { default: 2.1 }   # ridge rise above the wall top
  foundation:     { default: 0.3 }
  wall_thickness: { default: 0.3 }
  overhang:       { default: 0.4 }
  floor_thickness:   { default: 0.02 }
  lining_thickness:  { default: 0.015 }
  ceiling_thickness: { default: 0.03 }

size: ["{width}", "{foundation + wall_height + roof_height}", "{depth}"]

parts:
  foundation:
    primitive: cube
    size: ["{(width + 0.1) / width}", "{foundation / (foundation + wall_height + roof_height)}", "{(depth + 0.1) / depth}"]
    anchor: bottom_center
    bevel: 0.01
    material: concrete

  walls:
    primitive: cube
    size: [1, "{wall_height / (foundation + wall_height + roof_height)}", 1]
    anchor: bottom_center
    offset: [0, "{foundation / (foundation + wall_height + roof_height)}", 0]
    bevel: 0
    subtract: [interior]
    material: brick

  # Hollows out the walls down to the foundation (open top).
  interior:
    primitive: cube
    size: ["{(width - 2 * wall_thickness) / width}", "{(wall_height + 1) / (foundation + wall_height + roof_height)}", "{(depth - 2 * wall_thickness) / depth}"]
    anchor: bottom_center
    offset: [0, "{(foundation - 0.01) / (foundation + wall_height + roof_height)}", 0]
    bevel: 0
    cutter: true

  # Interior finish: floorboards on the foundation, a plaster lining inside
  # the brick, and a ceiling at the wall top hiding the roof structure.
  floor:
    primitive: cube
    size: ["{(width - 2 * wall_thickness) / width}", "{floor_thickness / (foundation + wall_height + roof_height)}", "{(depth - 2 * wall_thickness) / depth}"]
    anchor: bottom_center
    offset: [0, "{foundation / (foundation + wall_height + roof_height)}", 0]
    bevel: 0
    material: hardwood_floor

  lining:
    primitive: cube
    size: ["{(width - 2 * wall_thickness) / width}", "{(wall_height - floor_thickness - ceiling_thickness) / (foundation + wall_height + roof_height)}", "{(depth - 2 * wall_thickness) / depth}"]
    anchor: bottom_center
    offset: [0, "{(foundation + floor_thickness) / (foundation + wall_height + roof_height)}", 0]
    bevel: 0
    subtract: [lining_void]
    material: wall_plaster

  lining_void:
    primitive: cube
    size: ["{(width - 2 * wall_thickness - 2 * lining_thickness) / width}", "{(wall_height + 1) / (foundation + wall_height + roof_height)}", "{(depth - 2 * wall_thickness - 2 * lining_thickness) / depth}"]
    anchor: bottom_center
    offset: [0, "{foundation / (foundation + wall_height + roof_height)}", 0]
    bevel: 0
    cutter: true

  ceiling:
    primitive: cube
    size: ["{(width - 2 * wall_thickness) / width}", "{ceiling_thickness / (foundation + wall_height + roof_height)}", "{(depth - 2 * wall_thickness) / depth}"]
    anchor: bottom_center
    offset: [0, "{(foundation + wall_height - ceiling_thickness) / (foundation + wall_height + roof_height)}", 0]
    bevel: 0
    material: ceiling_white

  # Brick gable ends under the roof (slightly under the roof's underside).
  gables:
    primitive: prism
    size: [1, "{(roof_height - 0.03) / (foundation + wall_height + roof_height)}", 1]
    anchor: bottom_center
    offset: [0, "{(foundation + wall_height) / (foundation + wall_height + roof_height)}", 0]
    material: brick

  roof:
    primitive: roof
    style: gable
    overhang: "{overhang}"
    thickness: 0.14
    size: [1, "{roof_height / (foundation + wall_height + roof_height)}", 1]
    anchor: bottom_center
    offset: [0, "{(foundation + wall_height) / (foundation + wall_height + roof_height)}", 0]
    material: roof_shingle

  chimney:
    primitive: cube
    size: ["{0.6 / width}", "{(roof_height + 0.9) / (foundation + wall_height + roof_height)}", "{0.6 / depth}"]
    anchor: bottom_center
    offset: [0.28, "{(foundation + wall_height) / (foundation + wall_height + roof_height)}", -0.18]
    bevel: 0.01
    material: brick

  chimney_cap:
    primitive: cube
    size: ["{0.72 / width}", "{0.08 / (foundation + wall_height + roof_height)}", "{0.72 / depth}"]
    anchor: bottom_center
    offset: [0.28, "{(foundation + wall_height + roof_height + 0.9) / (foundation + wall_height + roof_height)}", -0.18]
    bevel: 0.01
    material: concrete

# Wall surfaces (v = 0 at the top of the foundation) for placing openings.
# Openings cut through the brick and the interior lining behind it.
surfaces:
  front_wall: { from: walls.front, cut: [lining] }
  back_wall:  { from: walls.back,  cut: [lining] }
  left_wall:  { from: walls.left,  cut: [lining] }
  right_wall: { from: walls.right, cut: [lining] }
