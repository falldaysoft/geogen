# Brick cottage shell with a pitched (gable) roof.
#
# The walls are a hollow shell, so windows and doors placed on its wall
# surfaces cut real openings (see scenes/cottage.yaml). Front faces +Z,
# origin at bottom_center.

name: house_peaked
origin: bottom_center

params:
  width:          { default: 8 }
  depth:          { default: 6 }
  wall_height:    { default: 2.8 }
  roof_height:    { default: 2.1 }   # ridge rise above the wall top
  foundation:     { default: 0.3 }
  wall_thickness: { default: 0.3 }
  overhang:       { default: 0.4 }

size: ["{width}", "{foundation + wall_height + roof_height}", "{depth}"]

parts:
  foundation:
    primitive: cube
    size: ["{(width + 0.1) / width}", "{foundation / (foundation + wall_height + roof_height)}", "{(depth + 0.1) / depth}"]
    anchor: bottom_center
    bevel: 0.01
    material: concrete

  walls:
    primitive: cube
    size: [1, "{wall_height / (foundation + wall_height + roof_height)}", 1]
    anchor: bottom_center
    offset: [0, "{foundation / (foundation + wall_height + roof_height)}", 0]
    bevel: 0
    subtract: [interior]
    material: brick

  # Hollows out the walls (open top, 5 cm floor slab left at the bottom).
  interior:
    primitive: cube
    size: ["{(width - 2 * wall_thickness) / width}", "{(wall_height + 1) / (foundation + wall_height + roof_height)}", "{(depth - 2 * wall_thickness) / depth}"]
    anchor: bottom_center
    offset: [0, "{(foundation + 0.05) / (foundation + wall_height + roof_height)}", 0]
    bevel: 0
    cutter: true

  # Brick gable ends under the roof (slightly under the roof's underside).
  gables:
    primitive: prism
    size: [1, "{(roof_height - 0.03) / (foundation + wall_height + roof_height)}", 1]
    anchor: bottom_center
    offset: [0, "{(foundation + wall_height) / (foundation + wall_height + roof_height)}", 0]
    material: brick

  roof:
    primitive: roof
    style: gable
    overhang: "{overhang}"
    thickness: 0.14
    size: [1, "{roof_height / (foundation + wall_height + roof_height)}", 1]
    anchor: bottom_center
    offset: [0, "{(foundation + wall_height) / (foundation + wall_height + roof_height)}", 0]
    material: roof_shingle

  chimney:
    primitive: cube
    size: ["{0.6 / width}", "{(roof_height + 0.9) / (foundation + wall_height + roof_height)}", "{0.6 / depth}"]
    anchor: bottom_center
    offset: [0.28, "{(foundation + wall_height) / (foundation + wall_height + roof_height)}", -0.18]
    bevel: 0.01
    material: brick

  chimney_cap:
    primitive: cube
    size: ["{0.72 / width}", "{0.08 / (foundation + wall_height + roof_height)}", "{0.72 / depth}"]
    anchor: bottom_center
    offset: [0.28, "{(foundation + wall_height + roof_height + 0.9) / (foundation + wall_height + roof_height)}", -0.18]
    bevel: 0.01
    material: concrete

# Wall surfaces (v = 0 at the top of the foundation) for placing openings.
surfaces:
  front_wall: { from: walls.front }
  back_wall:  { from: walls.back }
  left_wall:  { from: walls.left }
  right_wall: { from: walls.right }
