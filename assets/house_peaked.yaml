# House with peaked/gable roof
# Front of house is +Z direction
# Origin is at bottom_center

name: house_peaked
origin: bottom_center

params:
  width:  { default: 8 }
  height: { default: 5 }   # includes roof peak
  depth:  { default: 6 }

size: ["{width}", "{height}", "{depth}"]

parts:
  # Foundation strip (concrete base)
  foundation:
    primitive: cube
    size: [0.98, 0.05, 0.98]
    anchor: bottom_center
    bevel: 0.005
    material: concrete

  # Main structure (walls)
  walls:
    primitive: cube
    size: [0.95, 0.55, 0.95]
    anchor: bottom_center
    offset: [0, 0.05, 0]
    material: brick

  # Front door (on +Z face)
  door:
    primitive: cube
    size: [0.12, 0.35, 0.02]
    attach_to: walls
    at: front
    from: back
    offset: [0, -0.5, 0.01]
    bevel: 0.005
    material: wood

  # Door frame top
  door_frame:
    primitive: cube
    size: [0.14, 0.012, 0.025]
    attach_to: walls
    at: front
    from: back
    offset: [0, 0.4, 0.01]
    bevel: 0
    material: wood

  # Left front window
  window_left:
    primitive: cube
    size: [0.12, 0.12, 0.02]
    attach_to: walls
    at: front
    from: back
    offset: [-2.24, 0.25, 0.01]
    bevel: 0.003
    material: metal

  # Window sill left
  sill_left:
    primitive: cube
    size: [0.14, 0.012, 0.03]
    attach_to: walls
    at: front
    from: back
    offset: [-2.24, -0.05, 0.02]
    bevel: 0
    material: concrete

  # Right front window
  window_right:
    primitive: cube
    size: [0.12, 0.12, 0.02]
    attach_to: walls
    at: front
    from: back
    offset: [2.24, 0.25, 0.01]
    bevel: 0.003
    material: metal

  # Window sill right
  sill_right:
    primitive: cube
    size: [0.14, 0.012, 0.03]
    attach_to: walls
    at: front
    from: back
    offset: [2.24, -0.05, 0.02]
    bevel: 0
    material: concrete

  # Roof - left slope
  roof_left:
    primitive: cube
    size: [0.58, 0.04, 1.08]
    attach_to: walls
    at: top
    from: bottom
    offset: [-1.84, 1.25, 0]
    rotation: [0, 0, 35]
    bevel: 0.008
    material: roof_shingle

  # Roof - right slope
  roof_right:
    primitive: cube
    size: [0.58, 0.04, 1.08]
    attach_to: walls
    at: top
    from: bottom
    offset: [1.84, 1.25, 0]
    rotation: [0, 0, -35]
    bevel: 0.008
    material: roof_shingle

  # Chimney (on roof, poking above right slope)
  chimney:
    primitive: cube
    size: [0.08, 0.35, 0.08]
    attach_to: walls
    at: top
    from: bottom
    offset: [1.6, 1.5, -1.2]
    material: brick

# Re-export useful wall surfaces for scene-level composition.
surfaces:
  front_wall: { from: walls.front }
  back_wall:  { from: walls.back }
  left_wall:  { from: walls.left }
  right_wall: { from: walls.right }
