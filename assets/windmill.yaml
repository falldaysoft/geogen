# A windmill whose sails turn. A stone tower with a cap, and four sails on a hub that is
# a mechanism body on a motorised hinge, turning from the moment the scene loads (`turn`
# is `running` at first); the brake lever by the door stops and starts them. The sails
# face +Z. Origin: the tower's foot.

name: windmill
tags: [building.windmill, mechanism.windmill]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

params:
  height: {default: 9.0}        # the tower, to the cap
  sail:   {default: 5.0}        # each sail's length from the hub
  speed:  {default: 20}         # degrees a second (a turn every 18 s)

mechanism:
  bodies:
    sails:
      parts: [hub, arm, cloth]
      mass: 600
      joint: {type: hinge, axis: z, pivot: [0, "{height + 0.3}", 1.3], motor: {speed: "{speed}", force: 40000}}

parts:
  tower:
    primitive: lathe
    profile: [[0, 0], [2.6, 0], [2.0, "{height}"], [0, "{height}"], [0, 0]]
    size: [5.2, "{height}", 5.2]
    anchor: bottom_center
    segments: 32
    material: stone
  cap:
    primitive: lathe
    profile: [[0, 0], [2.2, 0], [2.2, 0.4], [0.3, 1.6], [0, 1.6], [0, 0]]
    size: [4.4, 1.6, 4.4]
    anchor: bottom_center
    offset: [0, "{height}", 0]
    segments: 32
    material: wood_dark
  axle:
    primitive: cylinder
    size: [0.3, 1.6, 0.3]
    anchor: center
    offset: [0, "{height - 0.2}", 1.0]   # out through the cap's front (a centre anchor sits 0.5 up)
    rotation: [90, 0, 0]
    material: wood_dark
  door:
    primitive: cube
    size: [1.0, 2.1, 0.1]
    anchor: bottom_center
    offset: [0, 0.003, 2.55]
    bevel: 0.01
    material: wood
  hub:
    primitive: cylinder
    size: [0.9, 0.5, 0.9]
    anchor: center
    offset: [0, "{height - 0.2}", 1.3]
    rotation: [90, 0, 0]
    material: wood
  arm:
    primitive: cube
    size: [0.16, "{sail}", 0.16]
    anchor: bottom_center
    offset: [0, "{height + 0.3}", 1.35]
    array: {count: 4, turn: 90, axis: z, about: [0, "{height + 0.3}", 0]}
    bevel: 0
    material: wood_dark
  cloth:
    primitive: cube
    size: [0.9, "{sail - 1.0}", 0.03]
    anchor: bottom_center
    offset: [0.5, "{height + 1.1}", 1.35]
    array: {count: 4, turn: 90, axis: z, about: [0, "{height + 0.3}", 0]}
    bevel: 0
    material: cloth
    collider: none
  pedestal:
    primitive: cube
    size: [0.3, 0.9, 0.3]
    anchor: bottom_center
    offset: [1.4, 0, 2.6]
    bevel: 0.01
    material: metal
  handle:
    primitive: cylinder
    size: [0.04, 0.45, 0.04]
    anchor: bottom_center
    offset: [1.4, 0.9, 2.6]
    material: red_metal
  knob:
    primitive: sphere
    size: [0.08, 0.08, 0.08]
    attach_to: handle
    at: top
    from: center
    material: tyre

interactions:
  turn:
    targets: [handle, knob]
    initial: running
    duration: 6
    states:
      running: {prompt: Brake the sails, next: stopped}
      stopped: {prompt: Free the sails, next: running}
    motions:
      - {body: sails, drive: {running: "{speed}", stopped: 0}}
      - {parts: [handle], rotate: x, pivot: [1.4, 0.9, 2.6], values: {running: -30, stopped: 30}}
