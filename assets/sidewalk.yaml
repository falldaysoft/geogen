# Sidewalk - concrete walkway
# Runs parallel to road

name: sidewalk
origin: bottom_center

params:
  width:     { default: 2 }
  thickness: { default: 0.12 }
  length:    { default: 24 }

size: ["{width}", "{thickness}", "{length}"]

parts:
  surface:
    primitive: cube
    size: [1.0, 1.0, 1.0]
    anchor: bottom_center
    offset: [0, 0, 0]
    bevel: 0
    material: concrete
