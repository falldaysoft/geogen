# Parametric humanoid body: the humanoid skeleton (assets/skeletons/humanoid.yaml)
# skinned by ring-lofted chains (generators/ringloft.py). Stylized ~6.5 heads,
# low-poly, one watertight skinned mesh. Continuous shape params; `presets`
# are named bundles (params: {preset: feminine, height: 1.6}: explicit values
# win). Built in the relaxed `stand` pose over the T-pose rest.
#
# Ring frames: arms have side = up (rx vertical), front = +Z; legs/torso have
# side = +X (rx = half width), front = +Z; feet have side = +X, front = up
# (rz = half height). Offsets are [side, front] in metres.

name: humanoid
tags: [npc.body]

params:
  height:         { default: 1.72 }
  build:          { default: 0.5 }    # 0 slight .. 1 heavy (all flesh radii)
  shoulder_width: { default: 0.34 }   # between the shoulder joints
  hip_width:      { default: 0.18 }   # between the hip joints
  hips:           { default: 1.0 }    # hip/pelvis flesh width factor
  waist:          { default: 0.9 }    # waist width factor
  bust:           { default: 0.5 }    # 0 .. 1
  glutes:         { default: 0.5 }    # 0 .. 1
  limb:           { default: 1.0 }    # arm/leg thickness factor
  head_size:      { default: 1.0 }
  jaw_width:      { default: 1.0 }
  neck_length:    { default: 0.10 }
  hand_size:      { default: 1.0 }
  foot_length:    { default: 0.24 }
  skin_tone:      { default: 0.25 }   # 0 very light .. 1 very dark (vertex colour over `skin`)
  hair_style:     { default: crop, choices: [none, buzz, crop, bob, long, ponytail, bun] }
  hair_color:     { default: brown, choices: [black, dark_brown, brown, auburn, blonde, light_blonde, red, grey, white] }
  eye_color:      { default: brown, choices: [brown, dark_brown, hazel, green, blue, grey] }
  lashes:         { default: 0.3 }    # face paint: 0 .. 1
  lip_strength:   { default: 0.4 }
  blush:          { default: 0.1 }
  freckles:       { default: 0.0 }
  brow_thickness: { default: 1.1 }
  brow_arch:      { default: 0.8 }
  seat_height:    { default: 0.45 }   # seat the sit poses plant the feet for (floor to seat)
  table_height:   { default: 0.74 }
  sill_height:    { default: 0.95 }

presets:
  feminine:
    height: 1.66
    build: 0.42
    shoulder_width: 0.30
    hip_width: 0.19
    hips: 1.12
    waist: 0.80
    bust: 1.0
    glutes: 0.9
    limb: 0.88
    jaw_width: 0.86
    neck_length: 0.10
    hand_size: 0.92
    foot_length: 0.23
    hair_style: long
    lashes: 1.0
    lip_strength: 0.7
    blush: 0.35
    brow_thickness: 0.8
    brow_arch: 1.2
  masculine:
    height: 1.79
    build: 0.55
    shoulder_width: 0.38
    hip_width: 0.17
    hips: 0.94
    waist: 0.84
    bust: 0.0
    glutes: 0.3
    limb: 1.1
    jaw_width: 1.12
    neck_length: 0.11
    hand_size: 1.05
    foot_length: 0.26
    hair_style: crop
    hair_color: dark_brown
    lashes: 0.0
    lip_strength: 0.12
    blush: 0.0
    brow_thickness: 1.45
    brow_arch: 0.4

derived:
  k: "{height / 1.7}"                              # size scale
  bf: "{0.85 + 0.3 * build}"                       # flesh factor
  tf: "{bf * k}"                                   # torso radii scale
  lf: "{limb * bf * k}"                            # limb radii scale
  hs: "{head_size * k}"
  hk: "{hand_size * k}"
  jaw: "{jaw_width}"
  hips_rx: "{(hip_width / 2 + 0.072 * tf) * hips}"
  waist_rx: "{0.15 * tf * waist}"
  chest_rx: "{(0.075 + shoulder_width * 0.24) * bf}"
  shoulder_r: "{0.052 * lf}"
  # Skeleton positions the poses aim at (see skeletons/humanoid.yaml).
  hip_j: "{hip_width / 2}"
  hips_h: "{height * 0.53}"
  ankle_h: "{height * 0.045}"
  thigh: "{height * 0.245 - 0.03}"
  seat_drop: "{0.09 * k}"                          # hip joint above the seat
  sit_floor: "{hips_h - seat_drop - seat_height}"  # the floor's height in a seated body's frame
  # Head landmarks (skeleton: head top = height, chin one head unit below).
  hu: "{height / 6.5}"
  eyes_y: "{height - 0.5 * hu}"
  hairline: "{eyes_y + 0.085 * hs}"

body:
  skeleton: skeletons/humanoid.yaml
  skeleton_params:
    height: "{height}"
    shoulder_width: "{shoulder_width}"
    hip_width: "{hip_width}"
    neck_length: "{neck_length}"
    hand_size: "{hand_size}"
    foot_length: "{foot_length}"
  material: skin
  skin_tone: "{skin_tone}"
  # The painted face: a decal over the front of the head (box = x0, y0, x1, y1 in the rest pose).
  face:
    box: ["{-0.085 * hs}", "{height - hu - 0.015}", "{0.085 * hs}", "{height - 0.16 * hu}"]
    eye_color: "{eye_color}"
    lashes: "{lashes}"
    lip_strength: "{lip_strength}"
    blush: "{blush}"
    freckles: "{freckles}"
    brow_thickness: "{brow_thickness}"
    brow_arch: "{brow_arch}"
    brow_color: "{hair_color}"
  hair: "{hair_style}"
  hair_color: "{hair_color}"
  crease_angle: 80
  max_triangles: 1500
  chains:
    torso:
      bones: [Hips, Spine, Chest, UpperChest, Neck, Head]
      end: head_top
      sides: 12
      spacing: 0.2
      blend: 0.04
      joint_rings: false
      cap_rings: 2
      weight_shift: { Head: -0.055 }          # jaw and chin (below the head joint) follow the head
      rings:
        - [Hips, -0.65, "{0.062 * tf}", "{0.052 * tf}", { power: 2.2 }]
        - [Hips, -0.4, "{hips_rx}", "{0.086 * tf + 0.016 * glutes}", { offset: [0, "{-0.014 * glutes}"], power: 2.2 }]
        - [Hips, 0.2, "{hips_rx * 0.94}", "{0.088 * tf + 0.008 * glutes}", { offset: [0, "{-0.006 * glutes}"], power: 2.3 }]
        - [Spine, 0.0, "{(hips_rx + waist_rx) / 2}", "{0.082 * tf}", { power: 2.3 }]
        - [Spine, 0.6, "{waist_rx}", "{0.078 * tf}", { power: 2.3 }]
        - [Chest, 0.45, "{chest_rx}", "{0.086 * tf + 0.03 * bust}", { offset: [0, "{0.016 * bust}"], power: 2.4 }]
        - [UpperChest, 0.35, "{chest_rx * 1.02}", "{0.082 * tf}", { power: 2.6 }]
        - [UpperChest, 0.8, "{chest_rx * 0.86}", "{0.072 * tf}", { power: 2.4 }]
        - [Neck, 0.0, "{0.095 * tf}", "{0.062 * tf}", { offset: [0, -0.006], power: 2.2 }]
        - [Neck, 0.2, "{0.060 * k}", "{0.052 * k}", { offset: [0, -0.004] }]
        - [Neck, 0.38, "{0.050 * k}", "{0.051 * k}", { offset: [0, 0.002] }]
        - [Neck, 0.6, "{0.050 * hs * jaw}", "{0.064 * hs}", { offset: [0, "{0.026 * hs}"] }]
        - [Neck, 0.85, "{0.066 * hs * jaw}", "{0.085 * hs}", { offset: [0, "{0.012 * hs}"] }]
        - [Head, 0.2, "{0.076 * hs}", "{0.098 * hs}", { offset: [0, "{0.006 * hs}"] }]
        - [Head, 0.45, "{0.082 * hs}", "{0.104 * hs}"]
        - [Head, 0.62, "{0.078 * hs}", "{0.099 * hs}", { offset: [0, "{-0.004 * hs}"] }]

    arm:
      bones: [LeftShoulder, LeftUpperArm, LeftLowerArm, LeftHand, LeftMiddleProximal, LeftMiddleIntermediate,
              LeftMiddleDistal]
      end: { bone: LeftMiddleDistal, along: "{0.02 * hk}" }
      mirror: true
      sides: 8
      spacing: 0.12
      blend: 0.05
      joint_rings: [LeftUpperArm, LeftLowerArm]
      cap_rings: 2
      joint_blend: { LeftMiddleProximal: 0.015, LeftMiddleIntermediate: 0.01, LeftMiddleDistal: 0.008 }
      # The mitten follows the two centre fingers: hand + 2 fingers (knuckle) or 2 + 2 (finger
      # joints) stay within glTF's 4 influences, and library grips curl every finger alike.
      bind:
        LeftMiddleProximal: [LeftMiddleProximal, LeftRingProximal]
        LeftMiddleIntermediate: [LeftMiddleIntermediate, LeftRingIntermediate]
        LeftMiddleDistal: [LeftMiddleDistal, LeftRingDistal]
      rings:
        - [LeftShoulder, 0.25, "{0.046 * tf}", "{0.050 * tf}", { offset: [-0.012, 0] }]
        - [LeftUpperArm, -0.05, "{shoulder_r}", "{shoulder_r}", { offset: [0.002, 0] }]
        - [LeftUpperArm, 0.15, "{0.048 * lf}", "{0.049 * lf}"]
        - [LeftUpperArm, 0.55, "{0.040 * lf}", "{0.043 * lf}"]
        - [LeftLowerArm, 0.0, "{0.033 * lf}", "{0.035 * lf}"]
        - [LeftLowerArm, 0.3, "{0.035 * lf}", "{0.039 * lf}"]
        - [LeftLowerArm, 0.95, "{0.020 * lf}", "{0.028 * lf}"]
        - [LeftHand, 0.45, "{0.016 * hk}", "{0.042 * hk}", { offset: [0.002, "{-0.008 * hk}"], power: 2.6 }]
        - [LeftMiddleProximal, 0.0, "{0.014 * hk}", "{0.041 * hk}", { offset: [0, "{-0.010 * hk}"], power: 2.6 }]
        - [LeftMiddleProximal, 0.6, "{0.011 * hk}", "{0.036 * hk}", { offset: [0, "{-0.008 * hk}"], power: 2.4 }]
        - [LeftMiddleDistal, 0.2, "{0.008 * hk}", "{0.028 * hk}", { offset: [0, "{-0.006 * hk}"] }]

    thumb:
      bones: [LeftThumbMetacarpal, LeftThumbProximal, LeftThumbDistal]
      end: { bone: LeftThumbDistal, along: "{0.022 * hk}" }
      front: [0, 1, 0]
      mirror: true
      sides: 5
      spacing: 0.1
      blend: 0.015
      joint_rings: false
      cap_rings: 1
      rings:
        - [LeftThumbMetacarpal, 0.1, "{0.015 * hk}", "{0.013 * hk}"]
        - [LeftThumbProximal, 0.0, "{0.012 * hk}", "{0.011 * hk}"]
        - [LeftThumbDistal, 0.3, "{0.010 * hk}", "{0.009 * hk}"]

    leg:
      bones: [LeftUpperLeg, LeftLowerLeg]
      end: LeftFoot
      mirror: true
      sides: 9
      spacing: 0.15
      blend: 0.06
      joint_rings: [LeftLowerLeg]
      cap_rings: 1
      rings:
        - [LeftUpperLeg, -0.2, "{0.074 * tf}", "{0.078 * tf}"]
        - [LeftUpperLeg, 0.06, "{0.082 * lf * hips}", "{0.080 * lf}", { offset: ["{0.012 * hips}", 0] }]
        - [LeftUpperLeg, 0.55, "{0.063 * lf}", "{0.067 * lf}"]
        - [LeftLowerLeg, 0.0, "{0.045 * lf}", "{0.049 * lf}"]
        - [LeftLowerLeg, 0.3, "{0.049 * lf}", "{0.055 * lf}", { offset: [0, "{-0.010 * lf}"] }]
        - [LeftLowerLeg, 0.85, "{0.031 * lf}", "{0.034 * lf}"]
        - [LeftLowerLeg, 1.0, "{0.030 * lf}", "{0.033 * lf}"]

    foot:
      bones: [LeftFoot, LeftToes]
      end: { bone: LeftToes, along: "{foot_length * 0.26}" }
      front: [0, 1, 0]
      mirror: true
      sides: 8
      spacing: 0.1
      blend: 0.035
      joint_rings: false
      cap_rings: 2
      rings:
        - [LeftFoot, -0.2, "{0.032 * k}", "{0.036 * k}", { offset: [0, "{-0.038 * k}"], power: 2.4 }]
        - [LeftFoot, 0.0, "{0.034 * k}", "{0.050 * k}", { offset: [0, "{-0.025 * k}"], power: 2.4 }]
        - [LeftFoot, 0.55, "{0.040 * k}", "{0.036 * k}", { offset: [0.003, "{-0.039 * k}"], power: 2.6 }]
        - [LeftToes, 0.0, "{0.044 * k}", "{0.026 * k}", { offset: [0.004, "{-0.050 * k}"], power: 2.8 }]
        - [LeftToes, 0.6, "{0.039 * k}", "{0.019 * k}", { offset: [0.002, "{-0.056 * k}"], power: 2.6 }]

    nose:                                   # a small wedge from between the eyes to the tip
      bones: [Head]
      end: head_top
      sides: 6
      spacing: 0.2
      joint_rings: false
      cap_rings: 1
      rings:
        - [Head, 0.1, "{0.013 * hs}", "{0.016 * hs}", { offset: [0, "{0.096 * hs}"] }]
        - [Head, 0.2, "{0.009 * hs}", "{0.012 * hs}", { offset: [0, "{0.1 * hs}"] }]
        - [Head, 0.33, "{0.006 * hs}", "{0.008 * hs}", { offset: [0, "{0.098 * hs}"] }]

  # Hair shells: ring-lofted chains on the head/neck/back bones minus `cut` boxes
  # ([x0, y0, z0, x1, y1, z1], rest pose), skinned like the body.
  hair_styles:
    buzz: &short
      chains:
        cap: &cap
          bones: [Neck, Head]
          end: { landmark: head_top, offset: [0, 0.008, 0] }
          sides: 12
          spacing: 0.2
          joint_rings: false
          cap_rings: 2
          weight_shift: { Head: -0.055 }
          rings:
            - [Neck, 0.5, "{0.056 * hs + 0.008}", "{0.058 * hs + 0.008}", { offset: [0, "{-0.012 * hs}"] }]
            - [Head, 0.1, "{0.074 * hs + 0.008}", "{0.094 * hs + 0.008}", { offset: [0, "{0.004 * hs}"] }]
            - [Head, 0.3, "{0.080 * hs + 0.008}", "{0.102 * hs + 0.008}", { offset: [0, "{0.003 * hs}"] }]
            - [Head, 0.47, "{0.082 * hs + 0.008}", "{0.104 * hs + 0.008}"]
            - [Head, 0.62, "{0.078 * hs + 0.008}", "{0.099 * hs + 0.008}", { offset: [0, "{-0.004 * hs}"] }]
      cut:
        - ["{-0.07 * hs}", "{height - 1.5 * hu}", 0.0, "{0.07 * hs}", "{hairline}", 0.3]     # face
        - [-0.3, "{height - 1.5 * hu}", -0.02, 0.3, "{eyes_y}", 0.3]                      # sides below the temples
    crop:
      chains:
        cap:
          <<: *cap
          end: { landmark: head_top, offset: [0, 0.018, 0] }
          rings:
            - [Neck, 0.5, "{0.056 * hs + 0.01}", "{0.058 * hs + 0.012}", { offset: [0, "{-0.014 * hs}"] }]
            - [Head, 0.1, "{0.074 * hs + 0.012}", "{0.094 * hs + 0.012}", { offset: [0, "{0.002 * hs}"] }]
            - [Head, 0.3, "{0.080 * hs + 0.014}", "{0.102 * hs + 0.014}"]
            - [Head, 0.47, "{0.082 * hs + 0.016}", "{0.104 * hs + 0.016}", { offset: [0, -0.002] }]
            - [Head, 0.62, "{0.078 * hs + 0.018}", "{0.099 * hs + 0.018}", { offset: [0, "{-0.006 * hs}"] }]
      cut:
        - ["{-0.07 * hs}", "{height - 1.5 * hu}", 0.0, "{0.07 * hs}", "{hairline}", 0.3]
        - [-0.3, "{height - 1.5 * hu}", -0.02, 0.3, "{eyes_y}", 0.3]
    bob: &bob
      chains:
        cap: &bob_cap
          <<: *cap
          end: { landmark: head_top, offset: [0, 0.02, 0] }
          rings:
            - [Neck, 0.15, "{0.086 * hs}", "{0.094 * hs}", { offset: [0, "{-0.02 * hs}"], power: 2.2 }]
            - [Neck, 0.5, "{0.084 * hs}", "{0.098 * hs}", { offset: [0, "{-0.012 * hs}"] }]
            - [Head, 0.1, "{0.074 * hs + 0.02}", "{0.094 * hs + 0.018}", { offset: [0, "{0.002 * hs}"] }]
            - [Head, 0.3, "{0.080 * hs + 0.02}", "{0.102 * hs + 0.018}"]
            - [Head, 0.47, "{0.082 * hs + 0.02}", "{0.104 * hs + 0.018}", { offset: [0, -0.002] }]
            - [Head, 0.62, "{0.078 * hs + 0.02}", "{0.099 * hs + 0.02}", { offset: [0, "{-0.006 * hs}"] }]
      cut:
        - ["{-0.068 * hs}", "{height - 1.6 * hu}", 0.0, "{0.068 * hs}", "{hairline}", 0.3]
    long:
      chains:
        cap: *bob_cap
        back:
          bones: [Head, Neck, UpperChest]
          end: { bone: UpperChest, along: "{-0.13 * k}" }
          sides: 10
          spacing: 0.2
          joint_rings: false
          cap_rings: 2
          blend: 0.06
          rings:
            - [Head, -0.6, "{0.074 * hs}", "{0.045 * hs}", { offset: [0, "{-0.062 * hs}"] }]
            - [Neck, 0.3, "{0.088 * hs}", "{0.032 * hs}", { offset: [0, "{-0.082 * hs}"] }]
            - [UpperChest, 0.5, "{0.1 * hs}", "{0.024 * hs}", { offset: [0, "{-0.104 * tf}"], power: 2.4 }]
      cut:
        - ["{-0.068 * hs}", "{height - 1.6 * hu}", 0.0, "{0.068 * hs}", "{hairline}", 0.3]
    ponytail:
      chains:
        cap:
          <<: *cap
          end: { landmark: head_top, offset: [0, 0.014, 0] }
          rings:
            - [Neck, 0.5, "{0.056 * hs + 0.008}", "{0.058 * hs + 0.01}", { offset: [0, "{-0.014 * hs}"] }]
            - [Head, 0.1, "{0.074 * hs + 0.01}", "{0.094 * hs + 0.01}", { offset: [0, "{0.002 * hs}"] }]
            - [Head, 0.3, "{0.080 * hs + 0.011}", "{0.102 * hs + 0.011}"]
            - [Head, 0.47, "{0.082 * hs + 0.012}", "{0.104 * hs + 0.012}", { offset: [0, -0.002] }]
            - [Head, 0.62, "{0.078 * hs + 0.014}", "{0.099 * hs + 0.014}", { offset: [0, "{-0.004 * hs}"] }]
        tail:
          bones: [Head, Neck]
          end: { bone: Neck, along: "{-0.16 * k}" }
          bind: { Neck: [Head] }                 # the tail swings with the head
          sides: 8
          spacing: 0.2
          joint_rings: false
          cap_rings: 2
          rings:
            - [Head, -0.55, "{0.03 * hs}", "{0.03 * hs}", { offset: [0, "{-0.112 * hs}"] }]
            - [Head, 0.2, "{0.034 * hs}", "{0.03 * hs}", { offset: [0, "{-0.12 * hs}"] }]
            - [Neck, 0.8, "{0.02 * hs}", "{0.018 * hs}", { offset: [0, "{-0.1 * hs}"] }]
      cut:
        - ["{-0.07 * hs}", "{height - 1.5 * hu}", 0.0, "{0.07 * hs}", "{hairline}", 0.3]
        - [-0.3, "{height - 1.5 * hu}", -0.02, 0.3, "{eyes_y - 0.02}", 0.3]
    bun:
      chains:
        cap:
          <<: *cap
          end: { landmark: head_top, offset: [0, 0.012, 0] }
          rings:
            - [Neck, 0.5, "{0.056 * hs + 0.008}", "{0.058 * hs + 0.01}", { offset: [0, "{-0.014 * hs}"] }]
            - [Head, 0.1, "{0.074 * hs + 0.01}", "{0.094 * hs + 0.01}", { offset: [0, "{0.002 * hs}"] }]
            - [Head, 0.3, "{0.080 * hs + 0.011}", "{0.102 * hs + 0.011}"]
            - [Head, 0.47, "{0.082 * hs + 0.012}", "{0.104 * hs + 0.012}", { offset: [0, -0.002] }]
            - [Head, 0.62, "{0.078 * hs + 0.012}", "{0.099 * hs + 0.012}", { offset: [0, "{-0.004 * hs}"] }]
        knot:
          bones: [Head]
          end: head_top
          sides: 10
          spacing: 0.2
          joint_rings: false
          rings:
            - [Head, 0.42, "{0.04 * hs}", "{0.038 * hs}", { offset: [0, "{-0.108 * hs}"] }]
            - [Head, 0.62, "{0.042 * hs}", "{0.04 * hs}", { offset: [0, "{-0.1 * hs}"] }]
      cut:
        - ["{-0.07 * hs}", "{height - 1.5 * hu}", 0.0, "{0.07 * hs}", "{hairline}", 0.3]
        - [-0.3, "{height - 1.5 * hu}", -0.02, 0.3, "{eyes_y - 0.02}", 0.3]

  # Skeletal poses (body-frame degrees, see core.skeleton.Pose); each is also a `pose_<name>` clip.
  poses:
    t_pose: {}
    stand:
      bones: &arms_down
        LeftUpperArm: [0, 0, -74]
        RightUpperArm: [0, 0, 74]
        LeftLowerArm: [0, -12, 0]
        RightLowerArm: [0, 12, 0]
        LeftThumbMetacarpal: [0, 28, 0]      # fold the rest pose's splayed thumb along the hand
        RightThumbMetacarpal: [0, -28, 0]
    sit:
      bones: &sit_upper
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
        Spine: [-4, 0, 0]
      ik: &sit_ik
        LeftFoot: { target: ["{hip_j + 0.02}", "{sit_floor + ankle_h}", "{thigh + 0.07 * k}"], flat: true }
        LeftHand: { target: ["{0.12 * k}", "{hips_h + 0.075 * k}", "{0.25 * k}"], pole: [0.4, -0.3, -1] }
        mirror: true
    sit_at_table:
      bones:
        <<: *sit_upper
        Spine: [6, 0, 0]
        Chest: [4, 0, 0]
      ik:
        LeftFoot: { target: ["{hip_j + 0.02}", "{sit_floor + ankle_h}", "{thigh + 0.04 * k}"], flat: true }
        LeftHand: { target: ["{0.16 * k}", "{sit_floor + table_height + 0.02}", "{0.34 * k}"], pole: [0.5, -1, -0.4] }
        mirror: true
    lie:
      bones:
        LeftUpperArm: [0, 0, -80]
        RightUpperArm: [0, 0, 80]
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
    lean_on_sill:                           # hands on a sill in front, leaning in to look out
      hips: [0, 0, -0.03]
      bones:
        Spine: [9, 0, 0]
        Chest: [6, 0, 0]
        Neck: [-8, 0, 0]
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
      ik:
        LeftFoot: { target: ["{hip_j}", "{ankle_h}", 0.02], flat: true }
        LeftHand: { target: ["{0.19 * k}", "{sill_height + 0.02}", "{0.36 * k}"], pole: [0.6, -0.4, -1] }
        mirror: true
    reach_low:                              # crouch and reach down in front with the right hand
      hips: ["{0.02 * k}", "{-0.3 * k}", "{-0.16 * k}"]
      bones:
        Spine: [30, 0, 0]
        Chest: [18, 0, 0]
        Neck: [-18, 0, 0]
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
      ik:
        LeftFoot: { target: ["{hip_j + 0.02}", "{ankle_h}", "{0.08 * k}"], flat: true }
        RightFoot: { target: ["{-hip_j - 0.02}", "{ankle_h}", "{-0.1 * k}"], flat: true }
        RightHand: { target: ["{-0.12 * k}", "{0.47 * k}", "{0.3 * k}"], pole: [-0.5, -0.3, -1] }
        LeftHand: { target: ["{0.14 * k}", "{0.5 * k}", "{0.22 * k}"], pole: [0.7, 0, -1] }
    look:                                   # standing, looking up and to the left
      bones:
        <<: *arms_down
        Neck: [-8, 14, 0]
        Head: [-8, 10, 0]
  pose: stand
  # Procedural clips over the stand pose (generators/clips.py); walk matches the NPC speed.
  clips:
    walk: { generator: walk, speed: 1.2, arm_swing: "{12 + 6 * (1 - bust)}", hip_sway: "{0.012 + 0.012 * hips * bust}" }
    idle: { generator: idle }

# Where the NPC runtime puts the body (Root, on the floor under the hips) for each
# pose, relative to the affordance anchor (x right, y up, z forward): sit drops
# the hips onto the seat point, lie lays the body on its back along the bed.
poses:
  stand: {}
  sit: { offset: [0, "{0.09 * k - height * 0.53}", -0.09] }
  lie: { offset: [0, "{0.105 * tf}", "{height * 0.5}"], rotation: [-90, 0, 0] }
