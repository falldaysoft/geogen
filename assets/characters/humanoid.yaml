# Parametric humanoid body: the humanoid skeleton (assets/skeletons/humanoid.yaml)
# skinned by ring-lofted chains (generators/ringloft.py). Stylized ~6.5 heads,
# low-poly, one watertight skinned mesh. Continuous shape params; `presets`
# are named bundles (params: {preset: feminine, height: 1.6}: explicit values
# win). Built in the relaxed `stand` pose over the T-pose rest.
#
# Ring frames: arms have side = up (rx vertical), front = +Z; legs/torso have
# side = +X (rx = half width), front = +Z; feet have side = +X, front = up
# (rz = half height). Offsets are [side, front] in metres.

name: humanoid
tags: [npc.body]

params:
  height:         { default: 1.72 }
  build:          { default: 0.5 }    # 0 slight .. 1 heavy (all flesh radii)
  shoulder_width: { default: 0.34 }   # between the shoulder joints
  hip_width:      { default: 0.18 }   # between the hip joints
  leg_ratio:      { default: 0.53 }   # hip joint height / height (long legs ~0.55, short ~0.5)
  hips:           { default: 1.0 }    # hip/pelvis flesh width factor
  waist:          { default: 0.9 }    # waist width factor
  bust:           { default: 0.5 }    # 0 .. 1
  glutes:         { default: 0.5 }    # 0 .. 1
  limb:           { default: 1.0 }    # arm/leg thickness factor
  limb_scale:     { default: 1.0 }    # body-type multiplier on limb (presets stack without overriding it)
  belly:          { default: 0.0 }    # 0 .. 1: a fuller waist and stomach
  head_size:      { default: 1.0 }
  jaw_width:      { default: 1.0 }
  nose:           { default: 1.0 }    # head sculpt (generators/head.py): feature sizes, 1 = neutral
  chin:           { default: 1.0 }
  brow:           { default: 1.0 }    # brow ridge
  cheeks:         { default: 1.0 }
  lips:           { default: 1.0 }
  ears:           { default: 1.0 }
  neck_length:    { default: 0.10 }
  hand_size:      { default: 1.0 }
  foot_length:    { default: 0.24 }
  skin_tone:      { default: 0.25 }   # 0 very light .. 1 very dark (vertex colour over `skin`)
  hair_style:     { default: crop, choices: [none, buzz, crop, pixie, bob, long, ponytail, bun, afro] }
  hair_color:     { default: brown, choices: [black, dark_brown, brown, auburn, blonde, light_blonde, red, grey, white] }
  eye_color:      { default: brown, choices: [brown, dark_brown, hazel, green, blue, grey] }
  outfit:         { default: casual, choices: [none, casual, jeans_tee, smart, dress, skirt_sweater, shorts_tee, casual_f] }
  top_color:      { default: navy, choices: [white, cream, black, charcoal, grey, navy, denim, light_denim, red, burgundy, coral, pink, mustard, olive, green, teal, lavender, brown, tan, sky] }
  bottom_color:   { default: denim, choices: [white, cream, black, charcoal, grey, navy, denim, light_denim, red, burgundy, coral, pink, mustard, olive, green, teal, lavender, brown, tan, sky] }
  shoe_color:     { default: white, choices: [white, cream, black, charcoal, grey, navy, denim, light_denim, red, burgundy, coral, pink, mustard, olive, green, teal, lavender, brown, tan, sky] }
  lashes:         { default: 0.3 }    # face paint: 0 .. 1
  lip_strength:   { default: 0.4 }
  blush:          { default: 0.1 }
  freckles:       { default: 0.0 }
  age:            { default: 0.15 }   # face paint: 0 young .. 1 old (smile lines, crow's feet, forehead)
  stubble:        { default: 0.0 }
  smile:          { default: 0.4 }
  brow_thickness: { default: 1.1 }
  brow_arch:      { default: 0.8 }
  seat_height:    { default: 0.45 }   # seat the sit poses plant the feet for (floor to seat)
  table_height:   { default: 0.74 }
  sill_height:    { default: 0.95 }
  worktop_height: { default: 0.9 }    # worktop the work poses and clips put the hands on (kitchen counters)

presets:
  feminine:
    height: 1.66
    build: 0.42
    shoulder_width: 0.30
    hip_width: 0.19
    hips: 1.12
    waist: 0.80
    bust: 1.0
    glutes: 0.9
    limb: 0.88
    jaw_width: 0.86
    nose: 0.85
    chin: 0.85
    brow: 0.3
    cheeks: 1.1
    lips: 1.15
    neck_length: 0.10
    hand_size: 0.92
    foot_length: 0.23
    hair_style: long
    outfit: casual_f
    top_color: coral
    bottom_color: navy
    shoe_color: black
    lashes: 1.0
    lip_strength: 0.7
    blush: 0.35
    brow_thickness: 0.8
    brow_arch: 1.2
  masculine:
    height: 1.79
    build: 0.55
    shoulder_width: 0.38
    hip_width: 0.17
    hips: 0.94
    waist: 0.84
    bust: 0.0
    glutes: 0.3
    limb: 1.1
    jaw_width: 1.12
    nose: 1.15
    chin: 1.25
    brow: 1.4
    cheeks: 0.9
    lips: 0.8
    neck_length: 0.11
    hand_size: 1.05
    foot_length: 0.26
    hair_style: crop
    hair_color: dark_brown
    outfit: jeans_tee
    top_color: grey
    bottom_color: denim
    shoe_color: white
    lashes: 0.0
    lip_strength: 0.12
    blush: 0.0
    brow_thickness: 1.45
    brow_arch: 0.4

  # Body types: stack after a gender preset (params: {preset: [feminine, curvy]}).
  # They set overall flesh (build), limb_scale and belly, leaving the gender
  # presets' limb/waist/hips shape alone (except curvy, which is about the hips).
  slim:
    build: 0.1
    limb_scale: 0.92
  athletic:
    build: 0.35
    limb_scale: 1.08
    glutes: 0.65
  curvy:
    build: 0.6
    hips: 1.28
    waist: 0.8
    glutes: 1.0
  heavy:
    build: 1.3
    limb_scale: 1.12
    belly: 0.85
    neck_length: 0.085
  hourglass:                          # exaggerated, a clothing-fit stress test
    build: 0.5
    bust: 1.7
    hips: 1.42
    waist: 0.66
    glutes: 1.4
  petite:
    height: 1.53
    hand_size: 0.88
    foot_length: 0.215
    head_size: 1.04
    leg_ratio: 0.52
  tall:
    height: 1.9
    leg_ratio: 0.545
    foot_length: 0.28
    hand_size: 1.08
  stocky:
    height: 1.64
    build: 0.75
    limb_scale: 1.15
    belly: 0.3
    leg_ratio: 0.505
    neck_length: 0.08
  lanky:
    height: 1.86
    build: 0.1
    limb_scale: 0.9
    leg_ratio: 0.555
    neck_length: 0.12

derived:
  k: "{height / 1.7}"                              # size scale
  bf: "{0.85 + 0.3 * build}"                       # flesh factor
  tf: "{bf * k}"                                   # torso radii scale
  lf: "{limb * limb_scale * bf * k}"                            # limb radii scale
  hs: "{head_size * k}"
  hk: "{hand_size * k}"
  jaw: "{jaw_width}"
  hips_rx: "{(hip_width / 2 + 0.072 * tf) * hips}"
  waist_rx: "{0.15 * tf * waist * (1 + 0.25 * belly)}"
  chest_rx: "{(0.075 + shoulder_width * 0.24) * bf}"
  shoulder_r: "{0.052 * lf}"
  # Skeleton positions the poses aim at (see skeletons/humanoid.yaml).
  hip_j: "{hip_width / 2}"
  hips_h: "{height * leg_ratio}"
  ankle_h: "{height * 0.045}"
  thigh: "{height * leg_ratio * (1 - 0.285 / 0.53) - 0.03}"
  seat_drop: "{0.09 * k}"                          # hip joint above the seat
  # Seated, the wrist rests on the thigh: its top (the leg ring's front half-depth, which
  # faces up once the thigh is level) plus cloth and half a palm, above the hip joint.
  lap: "{0.071 * lf + 0.02 + 0.018 * k + 0.02 * belly}"
  sit_floor: "{hips_h - seat_drop - seat_height}"  # the floor's height in a seated body's frame
  # Head landmarks (skeleton: head top = height, chin one head unit below).
  hu: "{height / 6.5}"
  eyes_y: "{height - 0.5 * hu}"
  hairline: "{eyes_y + 0.085 * hs}"

body:
  skeleton: skeletons/humanoid.yaml
  skeleton_params:
    height: "{height}"
    shoulder_width: "{shoulder_width}"
    hip_width: "{hip_width}"
    leg_ratio: "{leg_ratio}"
    neck_length: "{neck_length}"
    hand_size: "{hand_size}"
    foot_length: "{foot_length}"
  material: skin
  skin_tone: "{skin_tone}"
  # The painted face: a decal over the front of the head (box = x0, y0, x1, y1 in the rest pose).
  face:
    box: ["{-0.085 * hs}", "{height - hu - 0.015}", "{0.085 * hs}", "{height - 0.16 * hu}"]
    eye_color: "{eye_color}"
    lashes: "{lashes}"
    lip_strength: "{lip_strength}"
    blush: "{blush}"
    freckles: "{freckles}"
    age: "{age}"
    stubble: "{stubble}"
    smile: "{smile}"
    brow_thickness: "{brow_thickness}"
    brow_arch: "{brow_arch}"
    brow_color: "{hair_color}"
  # The sculpted head (generators/head.py), unioned onto the torso's neck; eyes and mouth
  # follow the painted face's box.
  head:
    size: "{hs}"
    neck_radius: "{0.049 * k - 0.001}"
    jaw: "{jaw}"
    nose: "{nose}"
    chin: "{chin}"
    brow: "{brow}"
    cheeks: "{cheeks}"
    lips: "{lips}"
    ears: "{ears}"
  hair: "{hair_style}"
  hair_color: "{hair_color}"
  # Outfits: garments from assets/clothing (tight ones edit the body's rings, loose ones are shells).
  outfit: "{outfit}"
  outfits:
    none: []
    casual:
      - { garment: long_sleeve_top, color: "{top_color}" }
      - { garment: trousers, color: "{bottom_color}" }
      - { garment: sneakers, color: "{shoe_color}" }
    jeans_tee:
      - { garment: t_shirt, color: "{top_color}" }
      - { garment: jeans, color: "{bottom_color}" }
      - { garment: sneakers, color: "{shoe_color}" }
    smart:
      - { garment: long_sleeve_top, color: "{top_color}" }
      - { garment: trousers, color: "{bottom_color}" }
      - { garment: boots, color: "{shoe_color}" }
    shorts_tee:
      - { garment: t_shirt, color: "{top_color}" }
      - { garment: shorts, color: "{bottom_color}" }
      - { garment: sneakers, color: "{shoe_color}" }
    casual_f:
      - { garment: t_shirt, color: "{top_color}" }
      - { garment: skirt, color: "{bottom_color}" }
      - { garment: flats, color: "{shoe_color}" }
    skirt_sweater:
      - { garment: sweater, color: "{top_color}" }
      - { garment: skirt, color: "{bottom_color}" }
      - { garment: boots, color: "{shoe_color}" }
    dress:
      - { garment: dress, color: "{top_color}" }
      - { garment: flats, color: "{shoe_color}" }
  crease_angle: 80
  max_triangles: 2400                 # the trunk and limbs; the sculpted head (~1.2k) has its own tolerance
  chains:
    torso:
      bones: [Hips, Spine, Chest, UpperChest, Neck]
      end: Head
      sides: 16
      spacing: 0.2
      blend: 0.04
      joint_rings: false
      cap_rings: 2
      rings:
        - [Hips, -0.65, "{0.062 * tf}", "{0.052 * tf}", { power: 2.2 }]
        - [Hips, -0.4, "{hips_rx}", "{0.086 * tf + 0.016 * glutes}", { offset: [0, "{-0.014 * glutes}"], power: 2.2 }]
        - [Hips, 0.2, "{hips_rx * 0.94}", "{0.088 * tf + 0.008 * glutes}", { offset: [0, "{-0.006 * glutes}"], power: 2.3 }]
        - [Spine, 0.0, "{(hips_rx + waist_rx) / 2}", "{(0.082 + 0.03 * belly) * tf}", { offset: [0, "{0.018 * belly * tf}"], power: 2.3 }]
        - [Spine, 0.6, "{waist_rx}", "{(0.078 + 0.036 * belly) * tf}", { offset: [0, "{0.024 * belly * tf}"], power: 2.3 }]
        - [Chest, 0.45, "{chest_rx}", "{0.086 * tf + 0.03 * bust}", { offset: [0, "{0.016 * bust}"], power: 2.4 }]
        - [UpperChest, 0.35, "{chest_rx * 1.02}", "{0.082 * tf}", { power: 2.6 }]
        - [UpperChest, 0.78, "{chest_rx * 0.8}", "{0.07 * tf}", { power: 2.3 }]
        - [Neck, 0.0, "{0.112 * tf}", "{0.062 * tf}", { offset: [0, -0.008], power: 2.4 }]
        - [Neck, 0.12, "{0.056 * k}", "{0.05 * k}", { offset: [0, -0.006] }]
        - [Neck, 0.28, "{0.049 * k}", "{0.049 * k}", { offset: [0, -0.002] }]
        # The neck ends inside the sculpted head (body.head), which carries on from here.
        - [Neck, 0.7, "{0.04 * k}", "{0.04 * k}", { offset: [0, -0.008] }]

    arm:
      bones: [LeftShoulder, LeftUpperArm, LeftLowerArm, LeftHand, LeftMiddleProximal, LeftMiddleIntermediate,
              LeftMiddleDistal]
      end: { bone: LeftMiddleDistal, along: "{0.02 * hk}" }
      mirror: true
      sides: 10
      spacing: 0.12
      blend: 0.05
      joint_rings: [LeftUpperArm, LeftLowerArm]
      cap_rings: 2
      joint_blend: { LeftMiddleProximal: 0.015, LeftMiddleIntermediate: 0.01, LeftMiddleDistal: 0.008 }
      # The mitten follows the two centre fingers: hand + 2 fingers (knuckle) or 2 + 2 (finger
      # joints) stay within glTF's 4 influences, and library grips curl every finger alike.
      bind:
        LeftMiddleProximal: [LeftMiddleProximal, LeftRingProximal]
        LeftMiddleIntermediate: [LeftMiddleIntermediate, LeftRingIntermediate]
        LeftMiddleDistal: [LeftMiddleDistal, LeftRingDistal]
      rings:
        - [LeftShoulder, 0.42, "{0.042 * tf}", "{0.046 * tf}", { offset: [-0.016, 0] }]
        - [LeftUpperArm, -0.05, "{shoulder_r * 1.06}", "{shoulder_r * 1.02}", { offset: [0.006, 0] }]
        - [LeftUpperArm, 0.15, "{0.048 * lf}", "{0.049 * lf}"]
        - [LeftUpperArm, 0.55, "{0.040 * lf}", "{0.043 * lf}"]
        - [LeftLowerArm, 0.0, "{0.033 * lf}", "{0.035 * lf}"]
        - [LeftLowerArm, 0.3, "{0.035 * lf}", "{0.039 * lf}"]
        - [LeftLowerArm, 0.95, "{0.020 * lf}", "{0.028 * lf}"]
        - [LeftHand, 0.45, "{0.016 * hk}", "{0.042 * hk}", { offset: [0.002, "{-0.008 * hk}"], power: 2.6 }]
        - [LeftMiddleProximal, 0.0, "{0.014 * hk}", "{0.041 * hk}", { offset: [0, "{-0.010 * hk}"], power: 2.6 }]
        - [LeftMiddleProximal, 0.6, "{0.011 * hk}", "{0.036 * hk}", { offset: [0, "{-0.008 * hk}"], power: 2.4 }]
        - [LeftMiddleDistal, 0.2, "{0.008 * hk}", "{0.028 * hk}", { offset: [0, "{-0.006 * hk}"] }]

    thumb:
      bones: [LeftThumbMetacarpal, LeftThumbProximal, LeftThumbDistal]
      end: { bone: LeftThumbDistal, along: "{0.022 * hk}" }
      front: [0, 1, 0]
      mirror: true
      sides: 5
      spacing: 0.1
      blend: 0.015
      joint_rings: false
      cap_rings: 1
      rings:
        - [LeftThumbMetacarpal, 0.1, "{0.015 * hk}", "{0.013 * hk}"]
        - [LeftThumbProximal, 0.0, "{0.012 * hk}", "{0.011 * hk}"]
        - [LeftThumbDistal, 0.3, "{0.010 * hk}", "{0.009 * hk}"]

    leg:
      bones: [LeftUpperLeg, LeftLowerLeg]
      root: Hips                              # above the hip joint the tube is pelvis: it stays put when the thigh swings
      end: LeftFoot
      mirror: true
      sides: 12
      spacing: 0.15
      blend: 0.06
      joint_rings: [LeftLowerLeg]
      cap_rings: 1
      rings:
        - [LeftUpperLeg, -0.2, "{0.074 * tf}", "{0.078 * tf}"]
        - [LeftUpperLeg, 0.06, "{0.082 * lf * hips}", "{0.080 * lf}", { offset: ["{0.012 * hips}", 0] }]
        - [LeftUpperLeg, 0.55, "{0.063 * lf}", "{0.067 * lf}"]
        - [LeftLowerLeg, 0.0, "{0.045 * lf}", "{0.049 * lf}"]
        - [LeftLowerLeg, 0.3, "{0.049 * lf}", "{0.055 * lf}", { offset: [0, "{-0.010 * lf}"] }]
        - [LeftLowerLeg, 0.85, "{0.031 * lf}", "{0.034 * lf}"]
        - [LeftLowerLeg, 1.0, "{0.030 * lf}", "{0.033 * lf}"]

    foot:
      bones: [LeftFoot, LeftToes]
      end: { bone: LeftToes, along: "{foot_length * 0.26}" }
      front: [0, 1, 0]
      mirror: true
      sides: 10
      spacing: 0.1
      blend: 0.035
      joint_rings: false
      cap_rings: 2
      rings:
        - [LeftFoot, -0.2, "{0.032 * k}", "{0.036 * k}", { offset: [0, "{-0.038 * k}"], power: 2.4 }]
        - [LeftFoot, 0.0, "{0.034 * k}", "{0.050 * k}", { offset: [0, "{-0.025 * k}"], power: 2.4 }]
        - [LeftFoot, 0.55, "{0.040 * k}", "{0.036 * k}", { offset: [0.003, "{-0.039 * k}"], power: 2.6 }]
        - [LeftToes, 0.0, "{0.044 * k}", "{0.026 * k}", { offset: [0.004, "{-0.050 * k}"], power: 2.8 }]
        - [LeftToes, 0.6, "{0.039 * k}", "{0.019 * k}", { offset: [0.002, "{-0.056 * k}"], power: 2.6 }]

  # Hair styles, sculpted round the head (generators/hair.py): head frame, metres at head size 1
  # (x across, y up from the eye line, z forward; the crown is ~0.13 up, the nape ~-0.08).
  # cover: the hairline's height at the front, temple, above the ear and the nape, and the
  # thickness [crown, sides, back]; shapes are smooth-unioned on, cuts carved out.
  hair_styles:
    buzz:
      sculpt:
        cover: { front: 0.082, temple: 0.06, ear: 0.03, back: -0.06, thickness: [0.004, 0.003, 0.003], taper: 0.012 }
    crop:
      sculpt:
        cover: { front: 0.085, temple: 0.064, ear: 0.026, back: -0.065, thickness: [0.022, 0.009, 0.012] }
        shapes:
          - { ellipsoid: [0.012, 0.106, 0.06, 0.062, 0.026, 0.042] }       # a little lift at the front
        blend: 0.03
        ridges: [34, 0.0015]
    pixie:                                  # short, full on top, a fringe swept across the brow
      sculpt:
        cover: { front: 0.07, temple: 0.045, ear: 0.016, back: -0.075, thickness: [0.026, 0.012, 0.016] }
        shapes:
          - { ellipsoid: [-0.018, 0.068, 0.088, 0.07, 0.024, 0.022] }
        blend: 0.025
        ridges: [30, 0.0018]
    bob:
      sculpt: &bob
        cover: { front: 0.07, temple: 0.035, ear: -0.12, back: -0.13, thickness: [0.026, 0.02, 0.022] }
        shapes:
          - { ellipsoid: [0.0, -0.035, -0.012, 0.112, 0.102, 0.12] }      # the volume falling to the jaw
          - { ellipsoid: [0.0, 0.07, 0.088, 0.074, 0.022, 0.024] }        # the fringe
        blend: 0.03
        cuts:
          - { ellipsoid: [0.0, -0.04, 0.125, 0.075, 0.115, 0.085] }       # the face
          - { ellipsoid: [0.0, -0.33, 0.0, 0.3, 0.19, 0.3] }              # the hem, level with the jaw
        ridges: [22, 0.0014]
    long:
      sculpt:
        <<: *bob
        shapes:
          - { ellipsoid: [0.0, -0.035, -0.012, 0.112, 0.102, 0.12] }
          - { ellipsoid: [0.0, 0.07, 0.088, 0.074, 0.022, 0.024] }
          - { ellipsoid: [0.0, -0.2, -0.1, 0.1, 0.21, 0.035] }            # the fall down the back
        cuts:
          - { ellipsoid: [0.0, -0.04, 0.125, 0.075, 0.115, 0.085] }
        weights: back                       # what falls below the neck goes with the back
    ponytail:
      sculpt:
        cover: { front: 0.075, temple: 0.045, ear: 0.016, back: -0.075, thickness: [0.012, 0.007, 0.01] }
        shapes:
          - { ellipsoid: [0.0, 0.03, -0.112, 0.024, 0.024, 0.022] }       # gathered at the back
          - { capsule: [0.0, 0.025, -0.13, 0.0, -0.16, -0.122, 0.024, 0.01] }   # the tail (swings with the head)
        blend: 0.015
        ridges: [34, 0.0012]
    bun:
      sculpt:
        cover: { front: 0.075, temple: 0.045, ear: 0.016, back: -0.075, thickness: [0.012, 0.007, 0.01] }
        shapes:
          - { ellipsoid: [0.0, 0.088, -0.098, 0.042, 0.036, 0.036] }
        blend: 0.015
        ridges: [34, 0.0012]
    afro:                                   # a rounded halo of volume
      sculpt:
        cover: { front: 0.072, temple: 0.042, ear: 0.0, back: -0.08, thickness: [0.062, 0.05, 0.058], taper: 0.03 }

  # Skeletal poses (body-frame degrees, see core.skeleton.Pose); each is also a `pose_<name>` clip.
  poses:
    t_pose: {}
    stand:
      bones: &arms_down
        LeftUpperArm: [0, 0, -74]
        RightUpperArm: [0, 0, 74]
        LeftLowerArm: [0, -12, 0]
        RightLowerArm: [0, 12, 0]
        LeftThumbMetacarpal: [0, 28, 0]      # fold the rest pose's splayed thumb along the hand
        RightThumbMetacarpal: [0, -28, 0]
    sit:
      seat: "{hips_h - seat_drop}"   # seat surface this is solved for; refitted per body (humanoid.fit_seats)
      bones: &sit_upper
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
        Spine: [-4, 0, 0]
      ik: &sit_ik
        LeftFoot: { target: ["{hip_j + 0.02}", "{sit_floor + ankle_h}", "{thigh + 0.07 * k}"], flat: true, floor: true }
        LeftHand: { target: ["{0.12 * k}", "{hips_h + lap}", "{0.25 * k}"], pole: ["{0.3 + 0.7 * build}", -0.3, "{-1 + 0.3 * build}"] }   # heavier: elbows out, clear of the waist
        mirror: true
    sit_at_table:
      seat: "{hips_h - seat_drop}"
      bones:
        <<: *sit_upper
        Spine: [6, 0, 0]
        Chest: [4, 0, 0]
      ik:
        LeftFoot: { target: ["{hip_j + 0.02}", "{sit_floor + ankle_h}", "{thigh + 0.04 * k}"], flat: true, floor: true }
        LeftHand: { target: ["{0.16 * k}", "{sit_floor + table_height + 0.02}", "{0.34 * k}"], pole: [0.5, -1, -0.4], floor: true, rest: true }
        mirror: true
    lie:
      bones:
        LeftUpperArm: [0, 0, -80]
        RightUpperArm: [0, 0, 80]
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
    lean_on_sill:                           # hands on a sill in front, leaning in to look out
      hips: [0, 0, -0.03]
      bones:
        Spine: [9, 0, 0]
        Chest: [6, 0, 0]
        Neck: [-8, 0, 0]
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
      ik:
        LeftFoot: { target: ["{hip_j}", "{ankle_h}", 0.02], flat: true }
        LeftHand: { target: ["{0.19 * k}", "{sill_height + 0.02}", "{0.36 * k}"], pole: [0.6, -0.4, -1], rest: true }
        mirror: true
    work_counter:                           # standing at a worktop, hands on it, looking down at the work
      hips: [0, 0, -0.02]
      bones:
        Spine: [10, 0, 0]
        Chest: [5, 0, 0]
        Neck: [10, 0, 0]
        Head: [12, 0, 0]
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
      ik:
        LeftFoot: { target: ["{hip_j}", "{ankle_h}", 0.02], flat: true }
        LeftHand: { target: ["{0.15 * k}", "{worktop_height + 0.02}", "{0.27 * k}"], pole: [0.7, -0.2, -1], rest: true }
        mirror: true
    reach_low:                              # crouch and reach down in front with the right hand
      hips: ["{0.02 * k}", "{-0.3 * k}", "{-0.16 * k}"]
      bones:
        Spine: [30, 0, 0]
        Chest: [18, 0, 0]
        Neck: [-18, 0, 0]
        LeftThumbMetacarpal: [0, 28, 0]
        RightThumbMetacarpal: [0, -28, 0]
      ik:
        LeftFoot: { target: ["{hip_j + 0.02}", "{ankle_h}", "{0.08 * k}"], flat: true }
        RightFoot: { target: ["{-hip_j - 0.02}", "{ankle_h}", "{-0.1 * k}"], flat: true }
        RightHand: { target: ["{-0.12 * k}", "{0.47 * k}", "{0.3 * k}"], pole: [-0.5, -0.3, -1] }
        LeftHand: { target: ["{0.14 * k}", "{0.5 * k}", "{0.22 * k}"], pole: [0.7, 0, -1] }
    look:                                   # standing, looking up and to the left
      bones:
        <<: *arms_down
        Neck: [-8, 14, 0]
        Head: [-8, 10, 0]
  pose: stand
  # Procedural clips over the stand pose (generators/clips.py); walk matches the NPC speed.
  clips:
    walk: { generator: walk, speed: 1.2, arm_swing: "{12 + 6 * (1 - bust)}", hip_sway: "{0.012 + 0.012 * hips * bust}" }
    idle: { generator: idle }
    wave: { generator: wave }          # greeting (npc actions: greet)
    # Work at a worktop (npc actions cook, prep, wipe, write): the right hand's strokes over the
    # work_counter pose, the left hand resting on the top (generators/clips.gesture_clip). Hand
    # paths are closed loops of [x, y, z] m offsets (x: the character's left, y up, z forward);
    # bone paths are [x, y, z] degrees; keys are evenly spaced and joined smoothly.
    stir:                              # a spoon round a pot
      generator: gesture
      pose: work_counter
      duration: 3
      hands:
        RightHand: { lift: [-0.08, 0.14, 0.03], cycles: 3,
                     path: [[0.05, 0, 0], [0, 0, 0.05], [-0.05, 0, 0], [0, 0, -0.05]] }
      bones: &breathe
        UpperChest: { path: [[-1.2, 0, 0], [1.2, 0, 0]] }
    chop:                              # quick strokes down, working across the board and back
      generator: gesture
      pose: work_counter
      duration: 3
      hands:
        RightHand: { lift: [-0.06, 0.02, 0], cycles: 7, path: [[0, 0.06, 0], [0, 0, 0]],
                     drift: [[0.05, 0, 0], [-0.05, 0, 0]] }
      bones:
        <<: *breathe
        Head: { path: [[1.5, 0, 0], [-1.5, 0, 0]], cycles: 7 }
    wipe:                              # a cloth side to side, a little forward and back
      generator: gesture
      pose: work_counter
      duration: 3
      hands:
        RightHand: { lift: [-0.08, 0.01, 0], cycles: 2,
                     path: [[0.16, 0, 0.03], [0, 0, -0.03], [-0.16, 0, 0.03], [0, 0, -0.03]] }
      bones: *breathe
    write:                             # a pen: a small zigzag along a slowly advancing line
      generator: gesture
      pose: work_counter
      duration: 3
      hands:
        RightHand: { lift: [-0.1, 0.02, -0.02], cycles: 9, path: [[0, 0, 0.008], [0, 0.004, -0.008]],
                     drift: [[0.05, 0, 0], [-0.05, 0, 0]] }
      bones:
        <<: *breathe
        Head: { path: [[0.8, 0, 0], [-0.8, 0, 0]], cycles: 3 }
    # Between poses (the runtime plays `from` -> `to` when an action changes pose). `approach` is
    # where the action has the body stand (npcs/actions.yaml), in the anchor's frame.
    sit_down: { generator: transition, from: stand, to: sit, duration: 1.4, plant: true, lean: 32 }
    stand_up: { generator: transition, from: sit, to: stand, duration: 1.3, plant: true, lean: 38 }
    lie_down: { generator: transition, from: stand, to: lie, via: sit, via_at: 0.45, duration: 2.6,
                approach: [0.8, 0, 0], anchor_height: 0.5, move: [0, 0.7], turn: [0.3, 1], lean: 20 }
    get_up:   { generator: transition, from: lie, to: stand, via: sit, via_at: 0.55, duration: 2.6,
                approach: [0.8, 0, 0], anchor_height: 0.5, move: [0.3, 1], turn: [0, 0.7], lean: 20 }

# Where the NPC runtime puts the body (Root, on the floor under the hips) for each
# pose, relative to the affordance anchor (x right, y up, z forward): sit drops
# the hips onto the seat point, lie lays the body on its back along the bed.
poses:
  stand: {}
  sit: { offset: [0, "{0.09 * k - hips_h}", -0.09] }
  lie: { offset: [0, "{0.105 * tf}", "{height * 0.5}"], rotation: [-90, 0, 0] }
