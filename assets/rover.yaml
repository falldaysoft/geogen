# A little yellow delivery rover on four wheels with a sensor dome: a walking item for
# tracks (items/rover.yaml). Origin: bottom centre; it drives toward +Z.

name: rover
tags: [prop.rover]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

parts:
  body:
    primitive: cube
    size: [0.34, 0.16, 0.46]
    anchor: bottom_center
    offset: [0, 0.07, 0]
    bevel: 0.03
    material: play_yellow
  dome:
    primitive: sphere
    size: [0.12, 0.12, 0.12]
    attach_to: body
    at: top
    from: center
    offset: [0, 0, 0.12]
    material: plastic_black
  wheel_l: &wheel
    primitive: cylinder
    size: [0.12, 0.05, 0.12]
    anchor: bottom_center
    offset: [-0.195, 0.06, -0.15]
    rotation: [0, 0, 90]
    material: tyre
    array: {count: 2, step: [0, 0, 0.3]}
  wheel_r:
    <<: *wheel
    offset: [0.195, 0.06, -0.15]
