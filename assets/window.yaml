# Casement window with frame, glazing bars, sill and lintel.
#
# Place it on a wall surface; it cuts its own opening into the wall:
#   window: { asset: window.yaml, on: house.front_wall, at: {u: 0.25, v: {abs: 0.9}} }
#
# Origin is the bottom-centre of the opening on the wall face; +Z points out
# of the wall. The container depth is 1 m so z offsets read as metres.

name: window
tags: [window]
origin: bottom_center

params:
  width:  { default: 1.0 }
  height: { default: 1.3 }
  frame:  { default: 0.06 }    # frame member width
  recess: { default: 0.09 }    # how far the frame sits back from the wall face

size: ["{width}", "{height}", 1]

parts:
  # Opening cut into the host wall (removed from the window itself).
  opening:
    primitive: cube
    size: [1, 1, 1.2]
    anchor: bottom_center
    offset: [0, 0, -0.5]
    bevel: 0
    cut_host: true

  # Behind the frame the host plasters the reveal (if its surface has a
  # reveal finish); the sleeve is clipped to the wall, so 1 m is "all of it".
  reveal:
    primitive: cube
    size: [1, 1, 1]
    anchor: bottom_center
    offset: [0, 0, "{-recess - 0.035 - 0.5}"]
    bevel: 0
    reveal: true

  frame:
    primitive: extrude
    shape:
      outer: { rect: ["{width}", "{height}"] }
      holes: [{ rect: ["{width - 2 * frame}", "{height - 2 * frame}"] }]
    fit: none
    axis: z
    bevel: 0.006
    size: [1, 1, 0.07]
    anchor: bottom_center
    offset: [0, 0, "{-recess}"]
    material: trim_white

  glass:
    primitive: cube
    size: ["{(width - 2 * frame) / width}", "{(height - 2 * frame) / height}", 0.01]
    anchor: bottom_center
    offset: [0, "{frame / height}", "{-recess}"]
    bevel: 0
    material: glass

  mullion:
    primitive: cube
    size: ["{0.035 / width}", "{(height - 2 * frame) / height}", 0.04]
    anchor: bottom_center
    offset: [0, "{frame / height}", "{-recess + 0.005}"]
    bevel: 0.004
    material: trim_white

  transom:
    primitive: cube
    size: ["{(width - 2 * frame) / width}", "{0.035 / height}", 0.04]
    anchor: bottom_center
    offset: [0, 0.6, "{-recess + 0.005}"]
    bevel: 0.004
    material: trim_white

  sill:
    primitive: cube
    size: ["{(width + 0.14) / width}", "{0.05 / height}", 0.2]
    anchor: bottom_center
    offset: [0, "{-0.05 / height}", -0.04]
    bevel: 0.008
    material: concrete

  lintel:
    primitive: cube
    size: ["{(width + 0.2) / width}", "{0.14 / height}", 0.05]
    anchor: bottom_center
    offset: [0, 1, 0.005]
    bevel: 0.006
    material: concrete
