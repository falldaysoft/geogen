# A cooked meal on a plate: what a range or a microwave makes of raw food (items/meal.yaml),
# eaten at a table. Its `food` interaction is how much is left (full, half, empty): an NPC eating
# it steps it along (npcs/actions.yaml `eat`, `show: {meal: half}`; geogen.105).

name: meal_plate
tags: [decor.plate, food.meal]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

parts:
  plate:
    primitive: lathe
    profile: [[0, 0], [0.09, 0], [0.13, 0.012], [0.135, 0.018], [0.12, 0.016], [0.08, 0.006], [0, 0.006]]
    fit: none
    segments: 24
    size: [0.27, 0.018, 0.27]
    anchor: bottom_center
    material: ceramic_white
    collider: none
  stew:
    primitive: ellipsoid
    size: [0.15, 0.05, 0.13]
    anchor: bottom_center
    offset: [-0.01, 0.004, 0.01]
    material: bread_crust
    collider: none
  greens:
    primitive: ellipsoid
    size: [0.07, 0.035, 0.06]
    anchor: bottom_center
    offset: [0.05, 0.006, -0.04]
    material: crop_leaf
    collider: none
  stew_left:                          # what is left of the stew halfway through
    primitive: ellipsoid
    size: [0.09, 0.03, 0.08]
    anchor: bottom_center
    offset: [-0.03, 0.004, 0.02]
    material: bread_crust
    collider: none
  smear:                              # the sauce left on the plate
    primitive: cylinder
    size: [0.08, 0.002, 0.065]
    anchor: bottom_center
    offset: [-0.02, 0.0065, 0.02]
    material: bread_crust
    collider: none

attachments:
  center:                             # the middle of the well, where the food is (motion eat)
    anchor: bottom_center
    offset: [0, 0.006, 0]
  # Where a hand takes it (motion take, grip: any): the near rim between thumb and fingers.
  rim:
    anchor: bottom_center
    offset: [0, 0.016, 0.13]
    grip: rim                         # held from above, the fingers over its edge

interactions:
  food:
    initial: full
    duration: 0.2
    states:
      full: { next: half }
      half: { next: empty }
      empty: {}
    motions:
      - { parts: [stew, greens], show: [full] }
      - { parts: [stew_left], show: [half] }
      - { parts: [smear], show: [half, empty] }
