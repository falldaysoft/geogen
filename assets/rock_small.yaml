# Small rock - irregular boulder
# Origin at bottom_center
name: rock_small
origin: bottom_center

params:
  width:  { default: 0.3 }
  height: { default: 0.2 }
  depth:  { default: 0.25 }

size: ["{width}", "{height}", "{depth}"]

parts:
  body:
    primitive: sphere
    size: [1.0, 0.7, 0.9]  # Irregular proportions
    anchor: bottom_center
    offset: [0, 0, 0]
    material: rock
