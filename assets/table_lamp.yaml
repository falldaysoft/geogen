# Bedside table lamp: turned ceramic base and a tapered linen shade.
# Origin bottom_center.

name: table_lamp
tags: [furniture.lamp, light.table_lamp]
origin: bottom_center

params:
  height: { default: 0.55 }
  shade:  { default: 0.32 }

size: ["{shade}", "{height}", "{shade}"]

parts:
  base:
    primitive: lathe
    profile: { spline: [[0.35, 0], [0.55, 0.12], [0.75, 0.45], [0.5, 0.85], [0.18, 1.0], [0, 1.0]] }
    size: ["{0.16 / shade}", "{0.26 / height}", "{0.16 / shade}"]
    anchor: bottom_center
    material: ceramic_white
  stem:
    primitive: cylinder
    size: ["{0.018 / shade}", "{0.1 / height}", "{0.018 / shade}"]
    anchor: bottom_center
    offset: [0, "{0.26 / height}", 0]
    material: chrome
    collider: none
  shade:
    primitive: lathe
    profile: [[0.02, 0], [1.0, 0], [0.7, 1.0], [0.02, 1.0]]
    size: [1, "{0.22 / height}", 1]
    anchor: bottom_center
    offset: [0, "{(height - 0.22) / height}", 0]
    material: fabric_linen
