# The hotel (hotel_building.yaml) with its staff: a receptionist works the
# front desk and takes breaks on the lobby seating. Scenes place it whole
# (`scene: hotel.yaml`), so wherever the hotel stands it is staffed; its
# rooms are hotel/building/<room>, the receptionist hotel/receptionist.

name: hotel
tags: [building.hotel]

slots:
  front_desk: { position: [0.0, 0.0, 5.0], facing: south }        # behind the reception desk

place:
  building:
    asset: hotel_building.yaml

  # Front of house: works the reception desk, breaks on the lobby seating.
  receptionist:
    npc: npcs/hotel_staff.yaml
    slot: front_desk
    home: { rect: [-2.9, -7.3, 2.9, 5.2] }
    seed: 2
