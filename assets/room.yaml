# Single room with a door and windows, built as a one-room floor plan (clean
# wall corners, finishes, a hinged door). Origin at the centre of the floor.

name: room
tags: [room.demo]

floorplan:
  wall_height: 2.5
  exterior_wall: 0.2
  materials: { walls: wall_plaster, floor: hardwood_floor, ceiling: ceiling_white }
  rooms:
    room: { rect: [0, 0, 4.2, 4.2] }       # 4 x 4 m inside 20 cm walls
  doors:
    - { name: front_door, room: room, side: south, at: 0.5, width: 1.0, height: 2.0 }
  windows:
    - { room: room, side: east, at: 0.5, width: 1.2, height: 1.0, sill: 0.9 }
    - { room: room, side: west, at: 0.5, width: 1.2, height: 1.0, sill: 0.9 }
    - { room: room, side: north, at: 0.3, width: 0.8, height: 1.0, sill: 0.9 }
    - { room: room, side: north, at: 0.7, width: 0.8, height: 1.0, sill: 0.9 }
