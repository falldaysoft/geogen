# A cat tree: a sisal-wrapped post on a base board, a platform half-way up to
# one side and a top platform over the post. Cats jump onto the low platform
# and climb the post to the top one, which is out of their jumping reach (its
# perch's `climb`, geogen.100.7), and nap up there. Origin: bottom centre; the
# low platform is to the +X side, the climbing face of the post faces +Z.

name: cat_tree
tags: [furniture.cat_tree]
origin: bottom_center

params:
  height: { default: 1.3 }        # the top platform's top
  low:    { default: 0.55 }       # the low platform's top
  post:   { default: 0.11 }       # post diameter

size: [0.75, "{height}", 0.5]

parts:
  base:
    primitive: cube
    size: ["{0.5 / 0.75}", "{0.04 / height}", 1]
    anchor: bottom_center
    bevel: 0.01
    material: fabric_linen
    tint: greige
  post:
    primitive: cylinder
    size: ["{post / 0.75}", "{(height - 0.08) / height}", "{post / 0.5}"]
    anchor: bottom_center
    offset: [0, "{0.04 / height}", 0]
    material: wheat_straw
  low_post:
    primitive: cylinder
    size: ["{0.07 / 0.75}", "{(low - 0.08) / height}", "{0.07 / 0.5}"]
    anchor: bottom_center
    offset: ["{0.25 / 0.75}", "{0.04 / height}", 0]
    material: wheat_straw
  low_platform:
    primitive: cube
    size: ["{0.32 / 0.75}", "{0.04 / height}", "{0.36 / 0.5}"]
    anchor: bottom_center
    offset: ["{0.2 / 0.75}", "{(low - 0.04) / height}", 0]
    bevel: 0.01
    material: fabric_linen
    tint: greige
  top_platform:
    primitive: cube
    size: ["{0.4 / 0.75}", "{0.04 / height}", "{0.4 / 0.5}"]
    anchor: bottom_center
    offset: [0, "{(height - 0.04) / height}", 0]
    bevel: 0.01
    material: fabric_linen
    tint: greige

affordances:
  # The low platform: jumped up to.
  - { type: perch, action: nap, at: [0.22, "{low}", 0], facing: 90, advertises: { rest: 0.5 }, tags: [animal, comfy] }
  # The top: out of jumping reach, so climbed, up the post's front face (`climb`: where the body
  # goes, from the ground in front of the post to just under the platform's edge).
  - { type: perch, action: nap, at: [0, "{height}", 0], facing: 0, advertises: { rest: 0.7 }, tags: [animal, comfy, high],
      climb: [[0, 0, 0.3], [0, 0, -0.03], [0, "{height - 0.62}", -0.03]] }
