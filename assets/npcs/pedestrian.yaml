# Somebody out and about: strolls the sidewalks, stops to look around, rests
# on benches. Place a crowd with a scatter on the sidewalks, e.g.
#   pedestrians:
#     npc: npcs/pedestrian.yaml
#     home: { rect: [-80, -50, 80, 50] }
#     scatter: { on_tag: street.sidewalk, count: 10, spacing: 8, seed: 1 }
# Each copy draws its own person (townsfolk archetype) from its seed.

kind: npc
version: 1

body: { archetype: characters/archetypes/townsfolk.yaml }
speed: 1.3
turn_speed: 300

needs:
  rest:      { initial: 0.8, decay: 0.004 }
  curiosity: { initial: 0.4, decay: 0.012 }

preferences:
  seat: 1.0

activities:
  stroll: { action: wander, advertises: { curiosity: 0.12 } }
  pause:  { action: idle, advertises: { rest: 0.03, curiosity: 0.02 } }

# Out in public: only affordances tagged `outside` (benches), not people's chairs.
affordance_tags: [outside]
# Strolls go to points on the sidewalks (tagged surfaces), not anywhere in the home rect.
wander: { tags: [street.sidewalk] }

# Time of day (the runtime's world clock): home for the night (into the nearest
# building entrance, or out of sight), a sit-down around lunch, a longer stroll at dusk.
routine:
  - { name: night, from: "22:30", to: "07:00", away: true }
  - { name: lunch, from: "12:00", to: "14:00", preferences: { seat: 2.0 }, activities: { pause: 1.5 } }
  - { name: evening, from: "18:00", to: "21:00", activities: { stroll: 1.5 } }

scoring: { distance: 0.004, recency: 0.06, memory: 90, noise: 0.08, retry: 30 }   # strolling can repeat
home_margin: 1.0

flags:
  closes_doors: true
