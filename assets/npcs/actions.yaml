# What NPCs do, as data. Each action is a list of steps from a fixed
# vocabulary that the runtime interprets (runtime/godot/scripts/npc.gd);
# nothing here is specific to an object or a character.
#
# An affordance (on furniture, windows, doors...) names its action with
# `action:` (default: its `type`). NPC activities (wander, idle) name one too.
#
# Step vocabulary:
#   go_to: approach | anchor | random | nearby | near | far | exit | aside | partner
#       walk (navmesh) to the affordance's approach point, the anchor itself,
#       a random point in the NPC's home, one a few metres from where it stands,
#       a portal's near/far side, or the nearest way out of the scene (a building
#       entrance), or out of the player's way
#       close: true              ...and past the navmesh (which keeps a player's width off
#                                everything) step straight up to it, if it is near and clear:
#                                a worktop is worked at from closer than that
#       (partner: up to the NPC whose offer this action takes up, a pace short of them)
#   vanish: true                 leave the world (routines bring the NPC back later)
#   face: anchor | portal | player | partner  turn toward the anchor's heading / through the
#                                portal / toward the player / toward the partner
#   play: <clip>                 play one of the body's clips once (a skeletal body; others wait
#                                a moment) and return to standing
#       loop: duration | S | [lo, hi]  ...over and over for that long instead (work at a counter:
#                                a body without the clip just stands there that long)
#   pose: <name>                 put the body in a pose from its body asset's `poses:` (a skeletal
#                                body plays its transition clip for the change: sit_down, ...)
#       at: anchor | approach    ...placed at the anchor (a seat) or where it stands
#       hold: <pose>             ...holding that skeletal pose (pose_<name> clip) instead of the
#                                pose's own once there: sit, but with the forearms on the table
#   wait: duration | S | [lo, hi]  seconds (duration = the affordance's range)
#       part: 0..1               ...that share of the duration, drawn once for the action (stages)
#   wait: partner                until the NPC that took up this one's offer is done (or gives up)
#   use: <state>                 drive the affordance's/portal's interaction to <state>
#                                (presses it like the player does, waits for arrival);
#                                `use: goal` drives it to the state a quest goal wants
#   use_item: <id> | "[tag=<tag>]"  use an item the NPC carries, as the player's F does (the
#                                rules' use_item event with the NPC as the actor; what happens is
#                                a rule): an item id, or the first carried item with that tag;
#                                carrying none, the action fails
#   pick_up: subject             take the action's subject (a physics prop with `carry`) in hand:
#                                the NPC stands within its `reach`, and the prop is within its `carry`
#                                (one over its `carry.two_hands` m long is carried in front,
#                                in both hands; a smaller one in one hand)
#   put_down: place              let the prop in hand go just above the action's place; where it
#                                settles is up to the physics
#   set_out: <item>              put the carried item's body on what is in front (a table) until
#                                the action ends or the item is used up (a meal served at a table)
#   show: {<item>: <state>}      that item's body, in the hand or set out, shows a state of its own
#                                interaction (a meal: full, half, empty)
#   find: [sit, lie]             the nearest free seat or bed this NPC may use (in its home, not
#                                another's, not reserved, nothing on it) becomes the anchor and
#                                approach from here on; `pose: found` takes its pose (sit, lie).
#                                Nothing free: the action carries on where it is
#   (go_to also takes `subject`: beside the prop, and `place`: where to stand to put it down)
#   if: <flag>                   on any step: skip it unless the NPC's flag is true
#   look: subject | place | anchor | partner | none
#                                on any step: from here on the head turns to the action's subject,
#                                place, anchor or partner (as far as the neck goes), until a later step
#                                says otherwise or the action ends
#
# `interruptible: true` on an action: something the NPC notices (its `reacts:` with
# `interrupt: true`, geogen/npc.py) may cut it short. It skips to the step that stands the
# body up again (`pose: stand`), or ends where it is; the option counts as done.
#
# `approach` is where the actor stands to start the action, in the anchor's
# frame (x right, z forward, metres); an affordance may override it.

kind: npc_actions
version: 1

actions:
  sit:
    approach: [0, 0, 0.5]        # in front of the seat, then turn round and sit
    duration: [15, 40]
    interruptible: true
    steps:
      - go_to: approach
      - face: anchor
      - pose: sit
        at: anchor
      - wait: duration
      - pose: stand
        at: approach

  sit_at_table:                  # a chair at a table: sit, forearms on the table top
    approach: [0, 0, 0.5]
    duration: [20, 50]
    interruptible: true
    steps:
      - go_to: approach
      - face: anchor
      - pose: sit
        at: anchor
        hold: sit_at_table
      - wait: duration
      - pose: stand
        at: approach

  lie:
    approach: [0.8, 0, 0]        # beside the mattress
    duration: [30, 90]
    steps:
      - go_to: approach
      - face: anchor
      - pose: lie
        at: anchor
      - wait: duration
      - pose: stand
        at: approach

  look:                          # stand somewhere facing something (a window, a shelf)
    approach: [0, 0, 0]
    duration: [6, 15]
    interruptible: true
    steps:
      - go_to: approach
      - face: anchor
      - wait: duration

  stand:                         # go and stand at a spot (the doorstep)
    approach: [0, 0, 0]
    duration: [5, 12]
    interruptible: true
    steps:
      - go_to: approach
      - face: anchor
      - wait: duration

  # Work at a worktop: stand at it and do the work (the body's looping clips over its
  # work_counter pose, hands on the real top). Affordances choose one with `action:`.
  cook:                          # stir a pot on a range
    approach: [0, 0, 0]
    duration: [30, 80]
    steps:
      - go_to: approach
        close: true
      - face: anchor
      - play: stir
        loop: duration
  prep:                          # chop on a board
    approach: [0, 0, 0]
    duration: [30, 80]
    steps:
      - go_to: approach
        close: true
      - face: anchor
      - play: chop
        loop: duration
  wipe:                          # wipe a counter or a bar down
    approach: [0, 0, 0]
    duration: [10, 25]
    steps:
      - go_to: approach
        close: true
      - face: anchor
      - play: wipe
        loop: duration
  write:                         # paperwork at a desk
    approach: [0, 0, 0]
    duration: [20, 60]
    steps:
      - go_to: approach
        close: true
      - face: anchor
      - play: write
        loop: duration

  use:                           # operate an object's interaction, then leave it as found
    approach: [0, 0, 0.6]
    duration: [3, 8]
    steps:
      - go_to: approach
      - face: anchor
      - use: on
      - wait: duration
      - use: off

  buy:                           # a stall's customer spot: buy what it sells, step aside and eat it
    approach: [0, 0, 0]
    duration: [12, 20]           # the eating
    steps:
      - go_to: approach
      - face: anchor
      - use: serving
      - wait: [1.5, 3]
      - go_to: nearby
      - use_item: "[tag=food]"
      - play: eat
        loop: duration

  shop:                          # a stall selling something to keep (a balloon): buy it and move on
    approach: [0, 0, 0]
    duration: [2, 5]
    steps:
      - go_to: approach
      - face: anchor
      - use: serving
      - wait: duration
      - go_to: nearby

  bin:                           # a trashcan: throw away what's in hand (its interaction takes it)
    approach: [0, 0, 0]
    duration: [0.5, 1.0]
    steps:
      - go_to: approach
      - face: anchor
      - use: binning
      - wait: duration

  quest_use:                     # a quest goal: bring a thing to the objective's state (npc.gd quest_option)
    steps:
      - go_to: approach
      - face: anchor
      - use: goal
      - wait: duration

  set:                           # a want about a thing: bring it to the want's state (`to`)
    steps:
      - go_to: approach
        look: anchor
      - face: anchor
      - use: goal
      - wait: [0.4, 0.8]

  look_for:                      # memory: go and see whether a thing is where it was heard or last seen
    interruptible: true
    steps:
      - go_to: approach
        look: anchor
      - face: anchor
        look: anchor
      - wait: [0.8, 1.5]

  quest_go:                      # a quest goal: go into a place or room
    steps:
      - go_to: anchor

  pass:                          # walk through a door that's in the way (portals)
    steps:
      - go_to: near
      - face: portal
      - use: open
      - go_to: far
      - use: closed
        if: closes_doors

  put_away:                      # carry the subject to the place (a want's, or the control API's npcs.do)
    steps:
      - go_to: subject
        look: subject              # eyes on what it is going for
      - pick_up: subject
      - wait: [0.4, 0.7]           # a glance at where it will go, before setting off
        look: place
      - go_to: place
      - put_down: place

  # A prop's own affordance (a book's): the subject is the prop and the place is where it lay
  # when the NPC chose it, so it ends up back there (geogen.104).
  read:                          # take the book to a seat or a bed, read it there, put it back
    duration: [20, 45]
    interruptible: true
    steps:
      - go_to: approach            # where it stands to reach the book (worked out when it chose it)
        look: subject              # eyes on the one it is going for
      - pick_up: subject
      - find: [sit, lie]           # the nearest free seat or bed; none: it reads where it stands
        prefer: { quality.soft: 0.25 }   # the armchair, the sofa or a bed over a kitchen chair
        look: none
      - go_to: approach
      - face: anchor
      - pose: found                # sit or lie, as what it found is for
        at: anchor
      - use: open                  # the book's own interaction: it opens in the hands
      - wait: duration
        look: subject              # held in front, reading
      - use: closed
      - pose: stand
        at: approach
      - go_to: place
        look: place
      - put_down: place

  # A meal at a table (a chair's `eat` use, geogen.105): sit with it, set the plate out on the
  # table, and eat it up, the food going as it is eaten. When it is done the chair's use takes
  # the meal and gives the dirty plate, which is then what the hand carries.
  eat:
    duration: [10, 15]
    interruptible: true
    steps:
      - go_to: approach
      - face: anchor
      - pose: sit
        at: anchor
        hold: sit_at_table
      - set_out: meal
      - wait: duration             # the meal's duration in shares: the food goes as hunger fills
        part: 0.4
      - show: { meal: half }
      - wait: duration
        part: 0.4
      - show: { meal: empty }
      - wait: duration
        part: 0.2
      - pose: stand
        at: approach

  attend:                        # stand at a thing while it does its work (a microwave, a fridge, a shower)
    approach: [0, 0, 0]
    duration: [5, 10]
    steps:
      - go_to: approach
        close: true
      - face: anchor
      - wait: duration
        look: anchor

  collapse:                      # a need ran out (a need's `at_zero`): asleep on the floor, where it stood
    duration: [40, 80]
    steps:
      - pose: lie
        at: approach
      - wait: duration
      - pose: stand
        at: approach

  wander:
    duration: [2, 5]
    interruptible: true
    steps:
      - go_to: random
      - wait: duration

  idle:
    duration: [3, 8]
    interruptible: true
    steps:
      - wait: duration

  rejoin:                        # back to the group (geogen.87.3): a member to its leader, the leader to the nearest member
    duration: [2, 5]
    steps:
      - go_to: group
      - wait: duration

  visit:                         # a short trip out of home (an activity's `visit`: the chef looks into the dining room)
    duration: [4, 10]
    steps:
      - go_to: visit
      - wait: duration
      - go_to: random              # and back home

  # Two people (geogen.101.6): an NPC's `offers:` name these. The one who takes the offer up
  # walks over; the other, on its feet, turns and waits for them (seated, it stays seated).
  chat:
    duration: [8, 16]
    steps:
      - go_to: partner
        look: partner
      - face: partner
      - wait: duration

  chat_reply:
    steps:
      - face: partner
        look: partner
      - wait: partner

  leave:                         # routines' `away` blocks: go off (into a building) until later
    steps:
      - go_to: exit
      - vanish: true

  # Reactions to the player (the NPC's `attention:`), pushed on top of whatever it is doing;
  # it carries on afterwards.
  greet:                         # the player pressed E on the NPC
    duration: [0.4, 0.8]
    steps:
      - face: player
      - play: wave
      - wait: duration

  step_aside:                    # standing in the player's way
    steps:
      - go_to: aside
      - face: player
