# A small town district: a 3 x 2 street grid with a commercial avenue down
# the middle (shop rows with flats above, the odd office), a hotel and an
# apartment block as landmarks, a park, and houses on the side streets.
# Lamps, trees, benches and hydrants line the sidewalks.

name: town
tags: [city.district]

city:
  seed: 4
  blocks: [3, 2]
  block_size: [44, 36]
  street_width: 8
  avenues: { ew: [1] }
  avenue_width: 12
  sidewalk: 3
  curb_height: 0.15
  lot_width: [10, 15]
  landmarks:
    "1,0": { recipe: hotel, storeys: 4, interior: lobby }
    "0,1": { recipe: apartment_block, storeys: [4, 5], interior: lobby }
  parks: ["2,1"]
  buildings:                         # recipes are sized to each lot; interior: full | lobby | shell
    residential:
      - { recipe: detached_house, storeys: [1, 2], style: [brick_hotel, stucco], weight: 3 }
      - { scene: scenes/cottage.yaml }
    commercial:
      - { recipe: shop_row, storeys: [2, 3], interior: lobby, style: [stucco, brick_hotel], weight: 3 }
      - { recipe: office, storeys: [3, 4], interior: shell, max_width: 14 }
  furniture:
    lamp:    { asset: street_lamp.yaml, spacing: 20 }
    tree:    { asset: maple_tree.yaml, spacing: 10 }
    bench:   { asset: bench.yaml, per_edge: 1, zones: [commercial, park, landmark] }
    hydrant: { asset: fire_hydrant.yaml, per_edge: 1 }

spawns:
  start: { position: [-3, 0, -2], facing: north }   # on the avenue, facing the shops
