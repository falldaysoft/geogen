# Motions in the runtime (geogen.103.12): two people on rugs for motion files (assets/motions/) run
# by the runtime's motion rig: `motion.start` through the control API, or `--motion` at launch.
# Facing +Z, toward the default camera. Behind them a pair at hugging distance for two-person
# motions (hug: each with the other as `partner`), facing each other, as hug's role places them.
name: motion_test
size: [5, 2, 4]

slots:
  left:  { position: [-1.0, 0, 0] }
  right: { position: [1.0, 0, 0] }
  pair_a: { position: [0, 0, -1.5] }
  pair_b: { position: [0.12, 0, -1.18], facing: south }

place:
  left_rug:  { asset: rug.yaml, slot: left }
  right_rug: { asset: rug.yaml, slot: right }
  ines:  { archetype: characters/archetypes/young_woman.yaml, seed: 1, slot: left }
  tomas: { archetype: characters/archetypes/young_man.yaml, seed: 2, slot: right }
  ana:   { archetype: characters/archetypes/older_woman.yaml, seed: 1, slot: pair_a }
  ben:   { archetype: characters/archetypes/older_man.yaml, seed: 1, slot: pair_b }
