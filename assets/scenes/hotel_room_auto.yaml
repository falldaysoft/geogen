# The hotel suite furnished automatically from its rooms' archetypes
# (assets/room_types/*.yaml); compare scenes/hotel_room.yaml (by hand).

name: hotel_room_auto
tags: [level.hotel_room]

place:
  suite:
    asset: hotel_suite.yaml
    furnish: true        # or a seed number for a different arrangement

  # A spare room key, by the bed: the suite's door is locked (lock: key_suite); carried, it opens it.
  # The entry spawn is outside that door, so the runtime catalogue (runtime_scenes.yaml `keys`)
  # also hands the player the key on arrival.
  room_key:
    asset: room_key.yaml
    on: suite/bedroom/nightstand_2.top
    at: { u: 0.8, v: 0.25 }

spawns:
  entry:
    position: [4.2, 0, 1.3]
    facing: west
