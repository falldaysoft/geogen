# Brick cottage: house shell with a front door and windows on every side.
# Each window/door cuts its own opening into the wall it is placed on.

name: cottage

params:
  hub_portal: { default: 1 }   # the portal back to the hub (0 where the cottage is part of something bigger)
  gallery: { default: 1 }      # the people gallery on the front lawn (0 for a plain cottage)
  resident_quest: { default: 0 } # the resident holds "lights out" from the start and does it (an NPC quest)
  quest: { default: 1 }        # the resident's "lights out" quest (0 where the cottage is part of something bigger)
  lived_in: { default: 1 }     # a bathroom, a kitchen and two people who live by needs and plans (0: one room and the
                               # plain resident of npcs/resident.yaml, as the NPC tests know it)

# Whoever lives here asks whoever greets them to switch off the lights (docs/quests.md).
quests:
  - { file: quests/lights_out.yaml, if: "{quest}" }

rules:
  - id: give_lights_out
    if: "{quest * (1 - lived_in)}"
    on: { signal: resident.greeted, actor: player }
    do: [{ start_quest: lights_out }]
  - id: give_lights_out_at_home
    if: "{quest * lived_in}"
    on: { signal: ana.greeted, actor: player }
    do: [{ start_quest: lights_out }]
  - id: give_lights_out_from_bea       # either of them asks
    if: "{quest * lived_in}"
    on: { signal: bea.greeted, actor: player }
    do: [{ start_quest: lights_out }]

slots:
  lawn: { position: [0, 0, 8.0], facing: north }
  west_lawn: { position: [-7.5, 0, 3.5], facing: east }

# The player starts on the path to the front door (the gallery would otherwise
# push the runtime's default start, 3 m past the model bounds, out to z = 11).
spawns:
  front_path: { position: [0, 0, 6.4], facing: south }
  from_hub: { position: [-5.4, 0, 3.5], facing: east }   # in front of the hub portal

place:
  house:
    asset: house_peaked.yaml

  door:
    asset: door.yaml
    on: house.front_wall
    at: { u: 0.5, v: { abs: 0 } }

  window_front_left:
    asset: window.yaml
    on: house.front_wall
    at: { u: 0.2, v: { abs: 0.85 } }
  window_front_right:
    asset: window.yaml
    on: house.front_wall
    at: { u: 0.8, v: { abs: 0.85 } }

  window_left:
    asset: window.yaml
    on: house.left_wall
    at: { u: 0.5, v: { abs: 0.85 } }
  window_right:
    asset: window.yaml
    on: house.right_wall
    at: { u: 0.5, v: { abs: 0.85 } }

  # Wider windows at the back (per-placement params override asset defaults).
  window_back_left:
    asset: window.yaml
    params: { width: 1.3 }
    on: house.back_wall
    at: { u: 0.3, v: { abs: 0.85 } }
  window_back_right:
    asset: window.yaml
    params: { width: 1.3 }
    on: house.back_wall
    at: { u: 0.7, v: { abs: 0.85 } }

  # Furniture on the interior floor (u: west -> east, v: back -> front).
  # The floor is 7.4 x 5.4 m; keep >= 1.2 m paths between the front door,
  # the table and the windows.
  dining:
    scene: scenes/dining_set.yaml
    on: house.floor
    at: { u: { abs: 2.0 }, v: { abs: 2.3 } }

  bookshelf:
    asset: bookshelf.yaml
    on: house.floor
    at: { u: 0.5, v: { abs: 0.19 } }     # against the back wall, between its windows

  armchair:
    asset: armchair.yaml
    on: house.floor
    at: { u: { abs: 6.3 }, v: { abs: 3.9 } }
    facing: center
    yaw: 15

  # A bathroom partitioned off the back east corner (3.0 x 2.0 m, the back window in it), its
  # door on the side by the bookshelf; and a kitchen along the west wall by the table. With
  # these the two who live here keep themselves going by plans nobody wrote (the fridge gives
  # raw food, the range makes a meal of it, a chair at the table is where it is eaten, the sink
  # takes the plate; the shower and the basin are for washing: npcs/householder.yaml,
  # docs/dev/gameplay.md "Plans").
  bath_wall_west:
    when: "{lived_in}"
    asset: partition_wall.yaml
    params: { length: 2.05 }
    on: house.floor
    at: { u: { abs: 4.4 }, v: { abs: 1.025 } }
    facing: west
  bath_wall_south:
    when: "{lived_in}"
    asset: partition_wall.yaml
    params: { length: 2.95 }
    on: house.floor
    at: { u: { abs: 5.925 }, v: { abs: 2.0 } }
    facing: north
  bath_door:
    when: "{lived_in}"
    asset: door.yaml
    on: bath_wall_west.front
    at: { u: 0.42, v: { abs: 0 } }
  shower:
    when: "{lived_in}"
    asset: shower.yaml
    on: house.floor
    at: { u: { abs: 6.9 }, v: { abs: 0.5 } }
    facing: north
  toilet:
    when: "{lived_in}"
    asset: toilet.yaml
    on: house.floor
    at: { u: { abs: 5.6 }, v: { abs: 0.38 } }
    facing: north
  washstand:
    when: "{lived_in}"
    asset: vanity.yaml
    on: house.floor
    at: { u: { abs: 7.08 }, v: { abs: 1.5 } }
    facing: west
  fridge:
    when: "{lived_in}"
    asset: fridge.yaml
    on: house.floor
    at: { u: { abs: 0.55 }, v: { abs: 0.46 } }   # the back west corner
    facing: north
  sink:
    when: "{lived_in}"
    asset: kitchen_sink.yaml
    on: house.floor
    at: { u: { abs: 1.62 }, v: { abs: 0.4 } }    # beside it, by the back window
    facing: north
  range:
    when: "{lived_in}"
    asset: kitchen_range.yaml
    params: { width: 0.9 }                        # a cooker for two (the default is a restaurant's)
    on: house.floor
    at: { u: { abs: 0.5 }, v: { abs: 4.7 } }     # on the west wall, by the front window
    facing: east

  # Two ceiling lights with their switches inside the front door, and a
  # reading lamp by the armchair with its switch on the wall beside it. Inside
  # walls run left to right as you face them, v from the foundation top (the
  # floorboards are 2 cm above it).
  dining_light:
    asset: ceiling_light.yaml
    on: house.ceiling
    at: { u: { abs: 2.0 }, v: { abs: 2.3 } }     # over the dining table
  sitting_light:
    asset: ceiling_light.yaml
    on: house.ceiling
    at: { u: { abs: 5.5 }, v: { abs: 3.5 } }
  reading_lamp:
    asset: floor_lamp.yaml
    on: house.floor
    at: { u: { abs: 7.05 }, v: { abs: 4.9 } }
  dining_switch:
    asset: light_switch.yaml
    params: { light: dining_light }
    on: house.front_inside
    at: { u: { abs: 2.835 }, v: { abs: 1.08 } }
  sitting_switch:
    asset: light_switch.yaml
    params: { light: sitting_light }
    on: house.front_inside
    at: { u: { abs: 2.685 }, v: { abs: 1.08 } }
  lamp_switch:
    asset: light_switch.yaml
    params: { light: reading_lamp }
    on: house.right_inside
    at: { u: { abs: 1.685 }, v: { abs: 1.08 } }

  # Two people live here (assets/npcs/householder.yaml): they get hungry, tired and grubby and
  # see to it with what the cottage has, and when one wants company she walks over to the other
  # (`household:`: they know each other). They stay within the floor (plus a margin that reaches
  # the doorstep). In the runtime G directs them: click a thing for what they can do with it.
  ana:
    when: "{lived_in}"
    npc: npcs/householder.yaml
    on: house.floor
    at: { u: { abs: 4.6 }, v: { abs: 3.2 } }
    facing: south
    home: house.floor
    household: cottage
    quests: [{ file: quests/lights_out.yaml, if: "{resident_quest}" }]
  bea:
    when: "{lived_in}"
    npc: npcs/householder.yaml
    on: house.floor
    at: { u: { abs: 3.6 }, v: { abs: 4.3 } }
    facing: north
    home: house.floor
    household: cottage
    seed: 5

  # Not lived in: one room and someone who potters about it (assets/npcs/resident.yaml).
  resident:
    when: "{1 - lived_in}"
    npc: npcs/resident.yaml
    on: house.floor
    at: { u: { abs: 4.6 }, v: { abs: 3.2 } }
    facing: south
    home: house.floor
    quests: [{ file: quests/lights_out.yaml, if: "{resident_quest}" }]

  # A gallery of humanoid variants on the front lawn (scenes/people_gallery.yaml),
  # behind the paths the runtime tests walk up to the door (spawns at z = 6.4).
  gallery:
    when: "{gallery}"
    scene: scenes/people_gallery.yaml
    slot: lawn

  # The way back to the hub (scenes/hub.yaml): a portal on the west lawn.
  hub_portal:
    when: "{hub_portal}"
    asset: portal.yaml
    slot: west_lawn
    params: { label: Hub }
    travel: { scene: hub, spawn: from_cottage }
