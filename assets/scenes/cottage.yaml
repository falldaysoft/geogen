# Brick cottage: house shell with a front door and windows on every side.
# Each window/door cuts its own opening into the wall it is placed on.

name: cottage

params:
  hub_portal: { default: 1 }   # the portal back to the hub (0 where the cottage is part of something bigger)
  gallery: { default: 1 }      # the people gallery on the front lawn (0 for a plain cottage)
  quest: { default: 1 }        # the resident's "lights out" quest (0 where the cottage is part of something bigger)

# The resident asks whoever greets them to switch off the lights (docs/quests.md).
quests:
  - { file: quests/lights_out.yaml, if: "{quest}" }

rules:
  - id: give_lights_out
    if: "{quest}"
    on: { signal: resident.greeted, actor: player }
    do: [{ start_quest: lights_out }]

slots:
  lawn: { position: [0, 0, 8.0], facing: north }
  west_lawn: { position: [-7.5, 0, 3.5], facing: east }

# The player starts on the path to the front door (the gallery would otherwise
# push the runtime's default start, 3 m past the model bounds, out to z = 11).
spawns:
  front_path: { position: [0, 0, 6.4], facing: south }
  from_hub: { position: [-5.4, 0, 3.5], facing: east }   # in front of the hub portal

place:
  house:
    asset: house_peaked.yaml

  door:
    asset: door.yaml
    on: house.front_wall
    at: { u: 0.5, v: { abs: 0 } }

  window_front_left:
    asset: window.yaml
    on: house.front_wall
    at: { u: 0.2, v: { abs: 0.85 } }
  window_front_right:
    asset: window.yaml
    on: house.front_wall
    at: { u: 0.8, v: { abs: 0.85 } }

  window_left:
    asset: window.yaml
    on: house.left_wall
    at: { u: 0.5, v: { abs: 0.85 } }
  window_right:
    asset: window.yaml
    on: house.right_wall
    at: { u: 0.5, v: { abs: 0.85 } }

  # Wider windows at the back (per-placement params override asset defaults).
  window_back_left:
    asset: window.yaml
    params: { width: 1.3 }
    on: house.back_wall
    at: { u: 0.3, v: { abs: 0.85 } }
  window_back_right:
    asset: window.yaml
    params: { width: 1.3 }
    on: house.back_wall
    at: { u: 0.7, v: { abs: 0.85 } }

  # Furniture on the interior floor (u: west -> east, v: back -> front).
  # The floor is 7.4 x 5.4 m; keep >= 1.2 m paths between the front door,
  # the table and the windows.
  dining:
    scene: scenes/dining_set.yaml
    on: house.floor
    at: { u: { abs: 2.0 }, v: { abs: 2.3 } }

  bookshelf:
    asset: bookshelf.yaml
    on: house.floor
    at: { u: 0.5, v: { abs: 0.19 } }     # against the back wall, between its windows

  armchair:
    asset: armchair.yaml
    on: house.floor
    at: { u: { abs: 6.3 }, v: { abs: 3.9 } }
    facing: center
    yaw: 15

  # Two ceiling lights with their switches inside the front door, and a
  # reading lamp by the armchair with its switch on the wall beside it. Inside
  # walls run left to right as you face them, v from the foundation top (the
  # floorboards are 2 cm above it).
  dining_light:
    asset: ceiling_light.yaml
    on: house.ceiling
    at: { u: { abs: 2.0 }, v: { abs: 2.3 } }     # over the dining table
  sitting_light:
    asset: ceiling_light.yaml
    on: house.ceiling
    at: { u: { abs: 5.5 }, v: { abs: 3.5 } }
  reading_lamp:
    asset: floor_lamp.yaml
    on: house.floor
    at: { u: { abs: 7.05 }, v: { abs: 4.9 } }
  dining_switch:
    asset: light_switch.yaml
    params: { light: dining_light }
    on: house.front_inside
    at: { u: { abs: 2.835 }, v: { abs: 1.08 } }
  sitting_switch:
    asset: light_switch.yaml
    params: { light: sitting_light }
    on: house.front_inside
    at: { u: { abs: 2.685 }, v: { abs: 1.08 } }
  lamp_switch:
    asset: light_switch.yaml
    params: { light: reading_lamp }
    on: house.right_inside
    at: { u: { abs: 1.685 }, v: { abs: 1.08 } }

  # Someone lives here (assets/npcs/resident.yaml). They stay within the
  # floor (plus a margin that reaches the doorstep).
  resident:
    npc: npcs/resident.yaml
    on: house.floor
    at: { u: { abs: 4.6 }, v: { abs: 3.2 } }
    facing: south
    home: house.floor

  # A gallery of humanoid variants on the front lawn (scenes/people_gallery.yaml),
  # behind the paths the runtime tests walk up to the door (spawns at z = 6.4).
  gallery:
    when: "{gallery}"
    scene: scenes/people_gallery.yaml
    slot: lawn

  # The way back to the hub (scenes/hub.yaml): a portal on the west lawn.
  hub_portal:
    when: "{hub_portal}"
    asset: portal.yaml
    slot: west_lawn
    params: { label: Hub }
    travel: { scene: hub, spawn: from_cottage }
