# Brick cottage: house shell with a front door and windows on every side.
# Each window/door cuts its own opening into the wall it is placed on.

name: cottage

params:
  hub_portal: { default: 1 }   # the portal back to the hub (0 where the cottage is part of something bigger)

slots:
  lawn: { position: [0, 0, 8.0], facing: north }
  west_lawn: { position: [-7.5, 0, 3.5], facing: east }

# The player starts on the path to the front door (the gallery would otherwise
# push the runtime's default start, 3 m past the model bounds, out to z = 11).
spawns:
  front_path: { position: [0, 0, 6.4], facing: south }
  from_hub: { position: [-5.4, 0, 3.5], facing: east }   # in front of the hub portal

place:
  house:
    asset: house_peaked.yaml

  door:
    asset: door.yaml
    on: house.front_wall
    at: { u: 0.5, v: { abs: 0 } }

  window_front_left:
    asset: window.yaml
    on: house.front_wall
    at: { u: 0.2, v: { abs: 0.85 } }
  window_front_right:
    asset: window.yaml
    on: house.front_wall
    at: { u: 0.8, v: { abs: 0.85 } }

  window_left:
    asset: window.yaml
    on: house.left_wall
    at: { u: 0.5, v: { abs: 0.85 } }
  window_right:
    asset: window.yaml
    on: house.right_wall
    at: { u: 0.5, v: { abs: 0.85 } }

  # Wider windows at the back (per-placement params override asset defaults).
  window_back_left:
    asset: window.yaml
    params: { width: 1.3 }
    on: house.back_wall
    at: { u: 0.3, v: { abs: 0.85 } }
  window_back_right:
    asset: window.yaml
    params: { width: 1.3 }
    on: house.back_wall
    at: { u: 0.7, v: { abs: 0.85 } }

  # Furniture on the interior floor (u: west -> east, v: back -> front).
  # The floor is 7.4 x 5.4 m; keep >= 1.2 m paths between the front door,
  # the table and the windows.
  dining:
    scene: scenes/dining_set.yaml
    on: house.floor
    at: { u: { abs: 2.0 }, v: { abs: 2.3 } }

  bookshelf:
    asset: bookshelf.yaml
    on: house.floor
    at: { u: 0.5, v: { abs: 0.19 } }     # against the back wall, between its windows

  armchair:
    asset: armchair.yaml
    on: house.floor
    at: { u: { abs: 6.3 }, v: { abs: 3.9 } }
    facing: center
    yaw: 15

  # Someone lives here (assets/npcs/resident.yaml). They stay within the
  # floor (plus a margin that reaches the doorstep).
  resident:
    npc: npcs/resident.yaml
    on: house.floor
    at: { u: { abs: 4.6 }, v: { abs: 3.2 } }
    facing: south
    home: house.floor

  # A gallery of humanoid variants on the front lawn (scenes/people_gallery.yaml),
  # behind the paths the runtime tests walk up to the door (spawns at z = 6.4).
  gallery:
    scene: scenes/people_gallery.yaml
    slot: lawn

  # The way back to the hub (scenes/hub.yaml): a portal on the west lawn.
  hub_portal:
    when: "{hub_portal}"
    asset: portal.yaml
    slot: west_lawn
    params: { label: Hub }
    travel: { scene: hub, spawn: from_cottage }
