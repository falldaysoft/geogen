# 150 vehicles on a grid. Traffic at scale (geogen.9.6): 6 x 5 park blocks with avenues,
# no buildings or street furniture (quick to export), for the runtime's per-frame budget
# (tests/test_traffic_runtime.py) and for looking at far fleets.
name: traffic_scale
tags: [city.district, test.traffic]

city:
  seed: 3
  blocks: [6, 5]
  block_size: [80, 64]
  street_width: 8
  avenues: { ew: [2], ns: [3] }
  avenue_width: 12
  sidewalk: 3
  parks: ["0,0", "0,1", "0,2", "0,3", "0,4", "1,0", "1,1", "1,2", "1,3", "1,4", "2,0", "2,1", "2,2", "2,3", "2,4", "3,0", "3,1", "3,2", "3,3", "3,4", "4,0", "4,1", "4,2", "4,3", "4,4", "5,0", "5,1", "5,2", "5,3", "5,4"]
  traffic: { drive: right, lanes: 1, avenue_lanes: 2, speed: 11, avenue_speed: 13, signals: avenues }

place:
  traffic: { traffic: traffic/town.yaml, seed: 9, count: 150 }

spawns:
  start: { position: [46, 0.2, 2], facing: west }    # in a park, looking at the avenue
