# The hub: a round plaza with one labelled portal per showcase scene, spread
# evenly round the far (-Z) side (angles from -Z: +-84, 21 degrees apart, for nine portals;
# re-space them when a showcase is added). Each portal lands at its scene's
# `from_hub` spawn, and every showcase has a portal or travel door back here
# that lands in front of its own portal (`from_<name>`). It's the runtime
# catalogue's default scene; tests/test_hub.py checks the round trips.

name: hub
size: [30, 4, 30]
tags: [showcase.hub]

spawns:
  start: { position: [0, 0.1, 7.5], facing: south }      # facing the plinth and the portals
  from_cottage: { position: [-6.96, 0.1, -0.73], facing: center }
  from_hotel: { position: [-6.24, 0.1, -3.18], facing: center }
  from_restaurant: { position: [-4.68, 0.1, -5.2], facing: center }
  from_main_street: { position: [-2.51, 0.1, -6.54], facing: center }
  from_quests: { position: [0.0, 0.1, -7.0], facing: center }
  from_city: { position: [2.51, 0.1, -6.54], facing: center }
  from_town: { position: [4.68, 0.1, -5.2], facing: center }
  from_park: { position: [6.24, 0.1, -3.18], facing: center }
  from_island: { position: [6.96, 0.1, -0.73], facing: center }

slots:
  portal_cottage: { position: [-9.75, 0.1, -1.02], facing: center }
  portal_hotel: { position: [-8.73, 0.1, -4.45], facing: center }
  portal_restaurant: { position: [-6.56, 0.1, -7.28], facing: center }
  portal_main_street: { position: [-3.51, 0.1, -9.15], facing: center }
  portal_quests: { position: [0.0, 0.1, -9.8], facing: center }
  portal_city: { position: [3.51, 0.1, -9.15], facing: center }
  portal_town: { position: [6.56, 0.1, -7.28], facing: center }
  portal_park: { position: [8.73, 0.1, -4.45], facing: center }
  portal_island: { position: [9.75, 0.1, -1.02], facing: center }
  centre: { position: [0, 0.1, 0], facing: north }
  sign: { position: [5.2, 0.1, 5.6], facing: north }   # beside the start, clear of the view to the portals
  lamp_e: { position: [11.2, 0.1, 3.0], facing: west }
  lamp_w: { position: [-11.2, 0.1, 3.0], facing: east }
  lamp_ne: { position: [7.5, 0.1, 8.5], facing: center }
  lamp_nw: { position: [-7.5, 0.1, 8.5], facing: center }
  bench_e: { position: [5.6, 0.1, 3.2], facing: center }
  bench_w: { position: [-5.6, 0.1, 3.2], facing: center }
  planter_e: { position: [10.2, 0.1, 6.0], facing: center }
  planter_w: { position: [-10.2, 0.1, 6.0], facing: center }
  planter_se: { position: [0, 0.1, 11.6], facing: center }
  planter_ne: { position: [3.0, 0.1, 10.8], facing: center }
  planter_nw: { position: [-3.0, 0.1, 10.8], facing: center }

place:
  plaza:
    asset: plaza.yaml

  name_plinth:
    asset: info_plinth.yaml
    slot: centre
    params: { label: "Geogen\nHub" }

  portal_cottage:
    asset: portal.yaml
    slot: portal_cottage
    params: { label: Cottage }
    travel: { scene: cottage, spawn: from_hub }

  portal_hotel:
    asset: portal.yaml
    slot: portal_hotel
    params: { label: Hotel }
    travel: { scene: hotel_showcase, spawn: from_hub }

  portal_restaurant:
    asset: portal.yaml
    slot: portal_restaurant
    params: { label: Restaurant, plaque: 3.2 }
    travel: { scene: restaurant, spawn: from_hub }

  portal_main_street:
    asset: portal.yaml
    slot: portal_main_street
    params: { label: Main Street, plaque: 3.2 }
    travel: { scene: main_street, spawn: from_hub }

  portal_quests:
    asset: portal.yaml
    slot: portal_quests
    params: { label: Quests }
    travel: { scene: quest_yard, spawn: from_hub }

  portal_city:
    asset: portal.yaml
    slot: portal_city
    params: { label: City }
    travel: { scene: city, spawn: from_hub }

  portal_town:
    asset: portal.yaml
    slot: portal_town
    params: { label: Town }
    travel: { scene: town, spawn: from_hub }

  portal_park:
    asset: portal.yaml
    slot: portal_park
    params: { label: Park }
    travel: { scene: park, spawn: from_hub }

  portal_island:
    asset: portal.yaml
    slot: portal_island
    params: { label: Island }
    travel: { scene: island, spawn: from_hub }

  signpost:
    asset: signpost.yaml
    slot: sign
    params: { arm1: Main Street, dir1: 211, arm2: Quests, dir2: 199, arm3: City, dir3: 187, arm4: Town, dir4: 174 }   # a signpost has four arms: four of the middle portals

  lamp_e: { asset: street_lamp.yaml, slot: lamp_e }
  lamp_w: { asset: street_lamp.yaml, slot: lamp_w }
  lamp_ne: { asset: street_lamp.yaml, slot: lamp_ne }
  lamp_nw: { asset: street_lamp.yaml, slot: lamp_nw }
  bench_e: { asset: bench.yaml, slot: bench_e }
  bench_w: { asset: bench.yaml, slot: bench_w }
  planter_e: { asset: planter.yaml, slot: planter_e }
  planter_w: { asset: planter.yaml, slot: planter_w }
  planter_se: { asset: planter.yaml, slot: planter_se }
  planter_ne: { asset: planter.yaml, slot: planter_ne }
  planter_nw: { asset: planter.yaml, slot: planter_nw }
