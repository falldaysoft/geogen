# The park showcase: a railed park entered by a gate at the south end. Gravel
# paths loop round a pond with a fountain and lead to a playground, a
# bandstand and a picnic area; benches, lamps, bins and trees throughout, and
# visitors who keep to the paths and use the benches and picnic tables.
# (The grounds, paths and railings are assets/park_grounds.yaml.)

name: park
size: [70.0, 6, 56.0]
tags: [showcase.park]

spawns:
  from_hub: { position: [7.0, 0.09, -20.6], facing: north }   # inside the gate, in front of the hub portal

slots:
  gate: { position: [0.00, 0.05, -28.00], facing: north }
  pond: { position: [0.00, 0.05, 2.00], facing: north }
  playground: { position: [-21.00, 0.05, 14.00], facing: south }
  bandstand: { position: [22.00, 0.05, 6.00], facing: west }
  hub_portal: { position: [7.00, 0.05, -23.00], facing: north }
  sign: { position: [2.60, 0.049999999999999996, -20.00], facing: north }
  bench_0: { position: [7.86, 0.05, 10.76], facing: center }
  bench_1: { position: [-7.86, 0.05, 10.76], facing: center }
  bench_2: { position: [-7.86, 0.05, -6.76], facing: center }
  bench_3: { position: [7.86, 0.05, -6.76], facing: center }
  bench_x0: { position: [-4.10, 0.05, 25.50], facing: west }
  bench_x1: { position: [-0.40, 0.05, -12.00], facing: east }
  picnic_0: { position: [-19.00, 0.05, -13.50], facing: north }
  picnic_1: { position: [-23.50, 0.05, -17.50], facing: north }
  picnic_2: { position: [-18.50, 0.05, -20.50], facing: north }
  lamp_0: { position: [1.80, 0.05, -24.00], facing: north }
  lamp_1: { position: [-1.80, 0.05, -13.00], facing: north }
  lamp_2: { position: [13.30, 0.05, 6.40], facing: north }
  lamp_3: { position: [-13.30, 0.05, 6.40], facing: north }
  lamp_4: { position: [8.60, 0.05, -6.40], facing: north }
  lamp_5: { position: [-8.60, 0.05, -6.40], facing: north }
  lamp_6: { position: [-5.60, 0.05, 16.00], facing: north }
  lamp_7: { position: [16.50, 0.05, 3.00], facing: north }
  lamp_8: { position: [-16.00, 0.05, 3.50], facing: north }
  bin_0: { position: [-1.80, 0.05, -16.00], facing: north }
  bin_1: { position: [-15.00, 0.05, -12.50], facing: north }
  bin_2: { position: [13.80, 0.05, 9.00], facing: north }
  bin_3: { position: [-13.80, 0.05, 9.00], facing: north }

place:
  grounds: { asset: park_grounds.yaml }
  gate: { asset: park_gate.yaml, slot: gate, params: { label: Park } }
  pond: { asset: pond.yaml, slot: pond, params: { rx: 6.0, rz: 4.0 } }
  playground: { asset: playground.yaml, slot: playground }
  bandstand: { asset: bandstand.yaml, slot: bandstand }
  signpost:
    asset: signpost.yaml
    slot: sign
    params: { arm1: Pond, dir1: 353, arm2: Playground, dir2: 325, arm3: Bandstand, dir3: 37, arm4: Picnic area, dir4: 278 }
  hub_portal:
    asset: portal.yaml
    slot: hub_portal
    params: { label: Hub }
    travel: { scene: hub, spawn: from_park }
  bench_0: { asset: bench.yaml, slot: bench_0 }
  bench_1: { asset: bench.yaml, slot: bench_1 }
  bench_2: { asset: bench.yaml, slot: bench_2 }
  bench_3: { asset: bench.yaml, slot: bench_3 }
  bench_x0: { asset: bench.yaml, slot: bench_x0 }
  bench_x1: { asset: bench.yaml, slot: bench_x1 }
  picnic_0: { asset: picnic_table.yaml, slot: picnic_0 }
  picnic_1: { asset: picnic_table.yaml, slot: picnic_1 }
  picnic_2: { asset: picnic_table.yaml, slot: picnic_2 }
  lamp_0: { asset: street_lamp.yaml, slot: lamp_0 }
  lamp_1: { asset: street_lamp.yaml, slot: lamp_1 }
  lamp_2: { asset: street_lamp.yaml, slot: lamp_2 }
  lamp_3: { asset: street_lamp.yaml, slot: lamp_3 }
  lamp_4: { asset: street_lamp.yaml, slot: lamp_4 }
  lamp_5: { asset: street_lamp.yaml, slot: lamp_5 }
  lamp_6: { asset: street_lamp.yaml, slot: lamp_6 }
  lamp_7: { asset: street_lamp.yaml, slot: lamp_7 }
  lamp_8: { asset: street_lamp.yaml, slot: lamp_8 }
  bin_0: { asset: trashcan.yaml, slot: bin_0 }
  bin_1: { asset: trashcan.yaml, slot: bin_1 }
  bin_2: { asset: trashcan.yaml, slot: bin_2 }
  bin_3: { asset: trashcan.yaml, slot: bin_3 }

  # Trees and bushes on the lawns (each group in a lawn clear of the paths).
  maples_ne:
    asset: maple_tree.yaml
    params: { scale: { random: [0.9, 1.2] }, seed: { choice: [1, 2, 3, 4, 5] } }
    scatter: { seed: 21, rect: [6, 13, 33, 26], spacing: 6, count: 8, avoid: [bandstand], margin: 1.5 }
  pines_nw:
    asset: pine_tree.yaml
    params: { scale: { random: [0.9, 1.4] }, seed: { choice: [1, 2, 3, 4, 5] } }
    scatter: { seed: 22, rect: [-33, 20.5, -13, 26], spacing: 5, count: 4, margin: 1.5 }
  maples_se:
    asset: maple_tree.yaml
    params: { scale: { random: [0.9, 1.2] }, seed: { choice: [1, 2, 3, 4, 5] } }
    scatter: { seed: 23, rect: [12, -26, 33, -9], spacing: 6, count: 7, margin: 1.5 }
  pines_sw:
    asset: pine_tree.yaml
    params: { scale: { random: [0.9, 1.3] }, seed: { choice: [1, 2, 3, 4, 5] } }
    scatter: { seed: 24, rect: [-33, -26, -26, -8], spacing: 5, count: 4, margin: 1.5 }
  maples_w:
    asset: maple_tree.yaml
    params: { scale: { random: [0.8, 1.1] }, seed: { choice: [1, 2, 3, 4, 5] } }
    scatter: { seed: 25, rect: [-33, -4, -24, 8], spacing: 6, count: 3, margin: 1.5 }
  bushes:
    asset: bush.yaml
    params: { width: { random: [0.7, 1.3] }, height: { random: [0.5, 0.9] } }
    scatter: { seed: 26, rect: [22, 14, 33, 26], spacing: 2.5, count: 10, avoid: [bandstand], margin: 0.8 }

  # People out in the park.
  visitors:
    npc: npcs/park_visitor.yaml
    home: { rect: [-35.0, -28.0, 35.0, 28.0] }
    scatter: { on_tag: park.path, count: 8, spacing: 6, seed: 31, radius: 0.5 }
