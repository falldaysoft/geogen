# Spawned items (geogen.flows) at their simplest: a spawner drops parcels on a belt, which
# hands them to a second belt at right angles, whose end takes them in; a second spawner
# sends rovers driving round a gravel lane to a sink of their own. The yard's HUD counts
# both. Review: -s flow_test -r out.png; runtime: godot ... -- --scene flow_test.

name: flow_test
size: [14, 3, 14]
tags: [level.test]

spawns:
  start: {position: [-3, 0, -4.5], facing: north}

state:
  delivered: {scope: world, type: number, default: 0}

slots:
  parcels:  {position: [0, 0, -2]}
  belt_a:   {position: [0, 0, 0]}
  belt_b:   {position: [1.85, 0, 1.75], facing: east}
  garage:   {position: [-5, 0, -3], facing: north}

place:
  ground:
    asset: ground.yaml
    params: {width: 14, depth: 14}
  parcels:
    asset: spawner.yaml
    params: {item: items/parcel.yaml, rate: 0.6, drop: 0.8}
    slot: parcels
  belt_a:
    asset: conveyor.yaml
    params: {length: 4}
    slot: belt_a
  belt_b:
    asset: conveyor.yaml
    params: {length: 3}
    slot: belt_b
  garage:
    asset: spawner.yaml
    params: {item: items/rover.yaml, rate: 0.25, max_alive: 6}
    slot: garage

tracks:
  lane:
    path: {spline: [[-5, 0.07, -3], [-5, 0.07, 1], [-3.5, 0.07, 4], [-0.5, 0.07, 5], [3, 0.07, 4.5]], samples: 10}
    mode: walk
    speed: 0.9
    spacing: 0.8
    surface: {width: 1.0, material: gravel, height: 0}

hud:
  stats:
    - {label: Parcels, value: belt_b.received}
    - {label: Rovers, value: lane.received}
    - {label: Points, value: world.delivered}

rules:
  - id: parcel_in
    on: {signal: belt_b.received}
    do: [{set: world.delivered, to: "world.delivered + event.value"}]
  - id: rover_in
    on: {signal: lane.received}
    do: [{set: world.delivered, to: "world.delivered + event.value"}]
