# Road surface - just the asphalt

name: road
origin: bottom_center

params:
  width:     { default: 6 }     # across the road
  thickness: { default: 0.1 }   # asphalt slab height
  length:    { default: 24 }    # along the road

size: ["{width}", "{thickness}", "{length}"]

parts:
  surface:
    primitive: cube
    size: [1.0, 1.0, 1.0]
    anchor: bottom_center
    offset: [0, 0, 0]
    bevel: 0
    material: asphalt
