# Sleeveless dress: a tight bodice plus the skirt shell, one colour.
kind: garment
name: dress
type: loose
part: dress
material: cloth
weights: legs            # Hips at the waist, thighs below (humanoid.leg_weights)
cover:
  leg: [[LeftUpperLeg, -1.0], { level: torso }]   # the thigh tubes' tops, down to the hem line
  torso: [[Hips, 0.3], [UpperChest, 0.85]]
thickness: 0.005
layer: 2
chains:
  skirt:
    bones: [Spine, Hips]
    end: [0, "{height * 0.28}", 0]
    sides: 16
    spacing: 0.2
    joint_rings: false
    samples: [[Hips, 0.1], [Hips, 0.2]]   # rings to bend over the seat with
    caps: [round, hem]      # open, double-walled hem (ringloft)
    rings:
      - [Spine, 0.05, "{(hips_rx + waist_rx) / 2 + 0.018}", "{(0.084 + 0.03 * belly) * tf + 0.018}", { offset: [0, "{0.018 * belly * tf}"], power: 2.3 }]
      - [Hips, 0.0, "{hips_rx + 0.03}", "{0.09 * tf + 0.012 * glutes + 0.026}", { offset: [0, "{-0.008 * glutes}"], power: 2.3 }]   # room for the thigh tops when they lift
      - [Hips, 0.35, "{hips_rx + 0.035}", "{0.09 * tf + 0.016 * glutes + 0.03}", { offset: [0, "{-0.012 * glutes}"], power: 2.3 }]
      - [Hips, 1.0, "{hips_rx + 0.08}", "{0.13 * tf + 0.05}", { offset: [0, -0.01], power: 2.2 }]
