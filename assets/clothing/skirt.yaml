# A-line skirt to just above the knee: a loose shell from the waist, weighted from
# the body under it (the thighs below the hips) so it swings with the legs.
kind: garment
name: skirt
type: loose
part: bottom
material: cloth
weights: legs            # Hips at the waist, thighs below (humanoid.leg_weights)
chains:
  skirt:
    bones: [Spine, Hips]
    end: [0, "{height * 0.3}", 0]
    sides: 20
    spacing: 0.065    # rings close enough to bend over a lap (generators/drape.py)
    joint_rings: false
    caps: [round, hem]      # open, double-walled hem (ringloft)
    rings:   # the waist rings sit close to the body: humanoid.hug_body gives each build its room
      - [Spine, 0.05, "{(hips_rx + waist_rx) / 2 + 0.008}", "{(0.084 + 0.03 * belly) * tf + 0.008}", { offset: [0, "{0.018 * belly * tf}"], power: 2.3 }]
      - [Hips, 0.0, "{hips_rx + 0.008}", "{0.09 * tf + 0.012 * glutes + 0.008}", { offset: [0, "{-0.008 * glutes}"], power: 2.3 }]
      - [Hips, 0.35, "{hips_rx + 0.035}", "{0.09 * tf + 0.016 * glutes + 0.03}", { offset: [0, "{-0.012 * glutes}"], power: 2.3 }]
      - [Hips, 1.0, "{hips_rx + 0.055}", "{0.115 * tf + 0.045}", { offset: [0, -0.01], power: 2.2 }]
