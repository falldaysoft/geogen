# Open bookshelf: wooden carcass with back panel, four shelves and rows of
# books. Origin bottom_center, open front faces +Z (stand it against a wall).

name: bookshelf
tags: [furniture.bookshelf]
origin: bottom_center

params:
  width:  { default: 1.0 }
  height: { default: 1.9 }
  depth:  { default: 0.34 }
  board:  { default: 0.022 }   # panel thickness
  plinth: { default: 0.08 }

size: ["{width}", "{height}", "{depth}"]

clearance: { front: 0.6 }

parts:
  side_left:
    primitive: cube
    size: ["{board / width}", 1, 1]
    anchor: bottom_center
    offset: ["{(board / 2 - width / 2) / width}", 0, 0]
    bevel: 0.003
    material: wood
  side_right:
    primitive: cube
    size: ["{board / width}", 1, 1]
    anchor: bottom_center
    offset: ["{(width / 2 - board / 2) / width}", 0, 0]
    bevel: 0.003
    material: wood
  top:
    primitive: cube
    size: ["{(width - 2 * board) / width}", "{board / height}", 1]
    anchor: bottom_center
    offset: [0, "{1 - board / height}", 0]
    bevel: 0.003
    material: wood
  plinth:
    primitive: cube
    size: ["{(width - 2 * board) / width}", "{plinth / height}", "{(depth - 0.01) / depth}"]
    anchor: bottom_center
    offset: [0, 0, 0]
    bevel: 0.003
    material: wood
  back_panel:
    primitive: cube
    size: ["{(width - 2 * board) / width}", "{(height - board - plinth) / height}", "{0.008 / depth}"]
    anchor: bottom_center
    offset: [0, "{plinth / height}", "{(0.004 - depth / 2) / depth}"]
    bevel: 0
    material: wood

  # Shelves (the plinth top is the lowest shelf), evenly spaced.
  shelf_1: &shelf
    primitive: cube
    size: ["{(width - 2 * board) / width}", "{board / height}", "{(depth - 0.012) / depth}"]
    anchor: bottom_center
    offset: [0, "{(plinth + (height - plinth - board) * 0.25) / height}", "{0.002 / depth}"]
    bevel: 0.003
    material: wood
  shelf_2:
    <<: *shelf
    offset: [0, "{(plinth + (height - plinth - board) * 0.5) / height}", "{0.002 / depth}"]
  shelf_3:
    <<: *shelf
    offset: [0, "{(plinth + (height - plinth - board) * 0.75) / height}", "{0.002 / depth}"]

  # Books: one comb-shaped extrusion per shelf row (individual spines of
  # varying height and thickness), in different colours.
  books_1:
    primitive: extrude
    shape: { polygon: [[-0.26, 0.0], [-0.26, 0.2309], [-0.2185, 0.2309], [-0.2185, 0.012], [-0.2165, 0.012], [-0.2165, 0.1965], [-0.1742, 0.1965], [-0.1742, 0.012], [-0.1722, 0.012], [-0.1722, 0.2201], [-0.1398, 0.2201], [-0.1398, 0.012], [-0.1378, 0.012], [-0.1378, 0.204], [-0.1001, 0.204], [-0.1001, 0.012], [-0.0981, 0.012], [-0.0981, 0.2335], [-0.0586, 0.2335], [-0.0586, 0.012], [-0.0566, 0.012], [-0.0566, 0.2282], [-0.0162, 0.2282], [-0.0162, 0.012], [-0.0142, 0.012], [-0.0142, 0.2531], [0.0134, 0.2531], [0.0134, 0.012], [0.0154, 0.012], [0.0154, 0.2196], [0.058, 0.2196], [0.058, 0.012], [0.06, 0.012], [0.06, 0.2643], [0.1021, 0.2643], [0.1021, 0.012], [0.1041, 0.012], [0.1041, 0.2387], [0.1249, 0.2387], [0.1249, 0.012], [0.1269, 0.012], [0.1269, 0.2654], [0.162, 0.2654], [0.162, 0.012], [0.164, 0.012], [0.164, 0.2007], [0.1979, 0.2007], [0.1979, 0.012], [0.1999, 0.012], [0.1999, 0.2295], [0.2294, 0.2295], [0.2294, 0.012], [0.2314, 0.012], [0.2314, 0.2667], [0.258, 0.2667], [0.26, 0.2667], [0.26, 0.0]] }
    fit: none
    axis: z
    size: ["{0.52 * width / width}", "{0.27 / height}", "{0.2 / depth}"]
    anchor: bottom_center
    offset: [-0.18, "{plinth / height}", "{(0.1 - depth / 2 + 0.04) / depth}"]
    material: paint_navy
    collider: none
  books_2:
    primitive: extrude
    shape: { polygon: [[-0.2, 0.0], [-0.2, 0.2079], [-0.1746, 0.2079], [-0.1746, 0.012], [-0.1726, 0.012], [-0.1726, 0.2413], [-0.1425, 0.2413], [-0.1425, 0.012], [-0.1405, 0.012], [-0.1405, 0.2366], [-0.0991, 0.2366], [-0.0991, 0.012], [-0.0971, 0.012], [-0.0971, 0.2644], [-0.0739, 0.2644], [-0.0739, 0.012], [-0.0719, 0.012], [-0.0719, 0.2441], [-0.0426, 0.2441], [-0.0426, 0.012], [-0.0406, 0.012], [-0.0406, 0.2074], [-0.0117, 0.2074], [-0.0117, 0.012], [-0.0097, 0.012], [-0.0097, 0.2517], [0.025, 0.2517], [0.025, 0.012], [0.027, 0.012], [0.027, 0.2268], [0.0481, 0.2268], [0.0481, 0.012], [0.0501, 0.012], [0.0501, 0.2037], [0.0759, 0.2037], [0.0759, 0.012], [0.0779, 0.012], [0.0779, 0.267], [0.0999, 0.267], [0.0999, 0.012], [0.1019, 0.012], [0.1019, 0.2206], [0.1417, 0.2206], [0.1417, 0.012], [0.1437, 0.012], [0.1437, 0.1934], [0.1797, 0.1934], [0.2, 0.1934], [0.2, 0.0]] }
    fit: none
    axis: z
    size: ["{0.4 * width / width}", "{0.27 / height}", "{0.2 / depth}"]
    anchor: bottom_center
    offset: [0.2, "{(plinth + (height - plinth - board) * 0.25 + board) / height}", "{(0.1 - depth / 2 + 0.04) / depth}"]
    material: paint_terracotta
    collider: none
  books_3:
    primitive: extrude
    shape: { polygon: [[-0.3, 0.0], [-0.3, 0.233], [-0.2593, 0.233], [-0.2593, 0.012], [-0.2573, 0.012], [-0.2573, 0.2121], [-0.2191, 0.2121], [-0.2191, 0.012], [-0.2171, 0.012], [-0.2171, 0.2178], [-0.191, 0.2178], [-0.191, 0.012], [-0.189, 0.012], [-0.189, 0.2244], [-0.1467, 0.2244], [-0.1467, 0.012], [-0.1447, 0.012], [-0.1447, 0.2665], [-0.1152, 0.2665], [-0.1152, 0.012], [-0.1132, 0.012], [-0.1132, 0.2216], [-0.0729, 0.2216], [-0.0729, 0.012], [-0.0709, 0.012], [-0.0709, 0.2546], [-0.0466, 0.2546], [-0.0466, 0.012], [-0.0446, 0.012], [-0.0446, 0.2214], [-0.0257, 0.2214], [-0.0257, 0.012], [-0.0237, 0.012], [-0.0237, 0.2634], [0.016, 0.2634], [0.016, 0.012], [0.018, 0.012], [0.018, 0.1963], [0.0403, 0.1963], [0.0403, 0.012], [0.0423, 0.012], [0.0423, 0.2397], [0.0796, 0.2397], [0.0796, 0.012], [0.0816, 0.012], [0.0816, 0.2305], [0.104, 0.2305], [0.104, 0.012], [0.106, 0.012], [0.106, 0.246], [0.1239, 0.246], [0.1239, 0.012], [0.1259, 0.012], [0.1259, 0.2464], [0.1561, 0.2464], [0.1561, 0.012], [0.1581, 0.012], [0.1581, 0.2416], [0.1765, 0.2416], [0.1765, 0.012], [0.1785, 0.012], [0.1785, 0.2299], [0.2045, 0.2299], [0.2045, 0.012], [0.2065, 0.012], [0.2065, 0.2407], [0.2316, 0.2407], [0.2316, 0.012], [0.2336, 0.012], [0.2336, 0.2394], [0.2649, 0.2394], [0.2649, 0.012], [0.2669, 0.012], [0.2669, 0.208], [0.2846, 0.208], [0.3, 0.208], [0.3, 0.0]] }
    fit: none
    axis: z
    size: ["{0.6 * width / width}", "{0.27 / height}", "{0.2 / depth}"]
    anchor: bottom_center
    offset: [-0.1, "{(plinth + (height - plinth - board) * 0.5 + board) / height}", "{(0.1 - depth / 2 + 0.04) / depth}"]
    material: paint_sage
    collider: none
  books_4:
    primitive: extrude
    shape: { polygon: [[-0.15, 0.0], [-0.15, 0.2207], [-0.1321, 0.2207], [-0.1321, 0.012], [-0.1301, 0.012], [-0.1301, 0.199], [-0.1011, 0.199], [-0.1011, 0.012], [-0.0991, 0.012], [-0.0991, 0.229], [-0.065, 0.229], [-0.065, 0.012], [-0.063, 0.012], [-0.063, 0.2378], [-0.0335, 0.2378], [-0.0335, 0.012], [-0.0315, 0.012], [-0.0315, 0.2371], [0.0097, 0.2371], [0.0097, 0.012], [0.0117, 0.012], [0.0117, 0.2017], [0.0302, 0.2017], [0.0302, 0.012], [0.0322, 0.012], [0.0322, 0.2158], [0.067, 0.2158], [0.067, 0.012], [0.069, 0.012], [0.069, 0.2309], [0.1054, 0.2309], [0.1054, 0.012], [0.1074, 0.012], [0.1074, 0.2492], [0.1336, 0.2492], [0.15, 0.2492], [0.15, 0.0]] }
    fit: none
    axis: z
    size: ["{0.3 * width / width}", "{0.27 / height}", "{0.2 / depth}"]
    anchor: bottom_center
    offset: [0.25, "{(plinth + (height - plinth - board) * 0.75 + board) / height}", "{(0.1 - depth / 2 + 0.04) / depth}"]
    material: paint_greige
    collider: none

surfaces:
  top: { from: top.top }

# Browsing: stand in front, facing the shelves.
affordances:
  - { type: look, at: [0, 0, "{depth / 2 + 0.45}"], facing: 180, duration: [6, 15], advertises: { curiosity: 0.3 }, tags: [shelf] }
