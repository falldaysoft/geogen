# A coffee mug: a glazed body with a loop handle on its +X side. People take it by the handle
# (motion drink: `handle`, grip hook) and drink from it. Origin: the middle of its base; it faces
# +Z like any prop, so whoever stands on its +Z side has the handle at their right hand.

name: mug
tags: [decor.mug, prop.mug]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

params:
  colour: { default: duck_egg, type: text }

physics: { mass: 0.3, friction: 0.6, bounce: 0.1, carry: true }

parts:
  body:
    primitive: lathe
    profile: [[0, 0], [0.036, 0], [0.04, 0.004], [0.041, 0.095], [0.037, 0.095], [0.035, 0.01], [0, 0.01]]
    fit: none
    segments: 24
    size: [0.082, 0.095, 0.082]
    anchor: bottom_center
    material: ceramic_white
    tint: "{colour}"
  coffee:
    primitive: cylinder
    size: [0.07, 0.004, 0.07]
    anchor: bottom_center
    offset: [0, 0.075, 0]
    material: wood
    tint: charcoal
    collider: none
  handle:                                  # a loop out from the side, top to bottom
    primitive: sweep
    profile: { circle: 0.006, segments: 8 }
    path: [[0.036, 0.078, 0], [0.056, 0.076, 0], [0.067, 0.062, 0], [0.068, 0.044, 0], [0.058, 0.03, 0], [0.037, 0.026, 0]]
    center: false
    material: ceramic_white
    tint: "{colour}"
    collider: none

attachments:
  # Where a hand takes it: fingers through the handle (motion drink).
  handle:
    anchor: bottom_center
    offset: [0.062, 0.052, 0]
    grip: hook
