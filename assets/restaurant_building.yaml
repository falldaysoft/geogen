# A corner restaurant: a dining room and a bar at the front (street door on
# the south side), the kitchen and two restrooms behind, and a back door out
# of the kitchen. One storey, stucco front, flat roof. Rooms are furnished
# from their archetypes (room_types/dining_room, bar, restaurant_kitchen, restroom).

name: restaurant_building
tags: [building.restaurant]

building:
  storeys:
    - floorplan:
        grid: 0.1
        wall_height: 3.2
        exterior_wall: 0.3
        interior_wall: 0.12
        materials: { walls: paint_white, floor: hardwood_floor, ceiling: ceiling_white }
        rooms:
          dining:     { rect: [0, 0, 10, 8], type: dining_room }
          bar:        { rect: [10, 0, 6, 8], type: bar }
          kitchen:    { rect: [0, 8, 9, 4.5], type: restaurant_kitchen }
          restroom_a: { rect: [9, 8, 3.5, 4.5], type: restroom }
          restroom_b: { rect: [12.5, 8, 3.5, 4.5], type: restroom }
        doors:
          - { name: entrance, room: dining, side: south, at: 0.35, width: 1.2 }
          - { between: [dining, bar], style: archway, at: 0.5, width: 2.4 }
          - { between: [dining, kitchen], at: 0.8, width: 1.0 }
          - { between: [bar, restroom_a], at: 0.5, width: 0.9 }
          - { between: [bar, restroom_b], at: 0.5, width: 0.9 }
          - { name: back_door, room: kitchen, side: north, at: 0.25, width: 1.0 }
        windows:
          - { room: dining, side: south, at: 0.12, width: 1.6, height: 1.8, sill: 0.6 }
          - { room: dining, side: south, at: 0.72, width: 2.4, height: 1.8, sill: 0.6 }
          - { room: dining, side: west, at: 0.5, width: 2.4, height: 1.8, sill: 0.6 }
          - { room: bar, side: south, at: 0.5, width: 2.4, height: 1.8, sill: 0.6 }
          - { room: bar, side: east, at: 0.18, width: 1.6, height: 1.6, sill: 0.8 }   # leaves the wall for the bar
          - { room: kitchen, side: north, at: 0.75, width: 1.2, height: 0.9, sill: 1.3 }
      furnish: true
  facade: { style: stucco }
  roof: { parapet: 0.8, material: concrete }
