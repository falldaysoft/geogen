# Dining table: rounded tabletop, apron frame and turned legs.
# Origin is at bottom_center of bounding box. Front of the table is +Z.

name: table
tags: [furniture.table]
origin: bottom_center

params:
  width:  { default: 1.2 }
  height: { default: 0.75 }
  depth:  { default: 0.8 }
  top_thickness: { default: 0.035 }
  apron_height:  { default: 0.09 }
  leg_width:     { default: 0.06 }
  leg_inset:     { default: 0.07 }   # leg centre distance from the tabletop edge

size: ["{width}", "{height}", "{depth}"]

parts:
  # Tabletop: rounded-corner slab with softened edges (profile in metres).
  top:
    primitive: extrude
    shape: { rect: ["{width}", "{depth}"], radius: 0.05 }
    fit: none
    axis: y
    bevel: 0.008
    size: [1.0, "{top_thickness / height}", 1.0]
    anchor: bottom_center
    offset: [0, "{1 - top_thickness / height}", 0]
    material: wood

  # Apron: four boards set back under the top, joining the legs.
  apron_front:
    primitive: cube
    size: ["{(width - 2 * leg_inset) / width}", "{apron_height / height}", "{0.022 / depth}"]
    anchor: bottom_center
    offset: [0, "{1 - (top_thickness + apron_height) / height}", "{(depth / 2 - leg_inset + leg_width / 2 - 0.016) / depth}"]
    bevel: 0.004
    material: wood

  apron_back:
    primitive: cube
    size: ["{(width - 2 * leg_inset) / width}", "{apron_height / height}", "{0.022 / depth}"]
    anchor: bottom_center
    offset: [0, "{1 - (top_thickness + apron_height) / height}", "{-(depth / 2 - leg_inset + leg_width / 2 - 0.016) / depth}"]
    bevel: 0.004
    material: wood

  apron_left:
    primitive: cube
    size: ["{0.022 / width}", "{apron_height / height}", "{(depth - 2 * leg_inset) / depth}"]
    anchor: bottom_center
    offset: ["{-(width / 2 - leg_inset + leg_width / 2 - 0.016) / width}", "{1 - (top_thickness + apron_height) / height}", 0]
    bevel: 0.004
    material: wood

  apron_right:
    primitive: cube
    size: ["{0.022 / width}", "{apron_height / height}", "{(depth - 2 * leg_inset) / depth}"]
    anchor: bottom_center
    offset: ["{(width / 2 - leg_inset + leg_width / 2 - 0.016) / width}", "{1 - (top_thickness + apron_height) / height}", 0]
    bevel: 0.004
    material: wood

  # Turned legs: foot, tapering shaft with a bead, and a full-width pommel
  # block at the top where the apron joins.
  leg_front_left: &leg
    primitive: lathe
    profile:
      segments:
        - spline: [[0.62, 0.0], [0.78, 0.025], [0.55, 0.07], [0.42, 0.3], [0.5, 0.52], [0.72, 0.6], [0.55, 0.64]]
          samples: 8
        - [[0.9, 0.665], [1.0, 0.68], [1.0, 1.0]]
    segments: 40
    size: ["{leg_width / width}", "{1 - top_thickness / height}", "{leg_width / depth}"]
    anchor: bottom_center
    offset: ["{-(width / 2 - leg_inset) / width}", 0, "{(depth / 2 - leg_inset) / depth}"]
    material: wood

  leg_front_right:
    <<: *leg
    offset: ["{(width / 2 - leg_inset) / width}", 0, "{(depth / 2 - leg_inset) / depth}"]

  leg_back_left:
    <<: *leg
    offset: ["{-(width / 2 - leg_inset) / width}", 0, "{-(depth / 2 - leg_inset) / depth}"]

  leg_back_right:
    <<: *leg
    offset: ["{(width / 2 - leg_inset) / width}", 0, "{-(depth / 2 - leg_inset) / depth}"]

# Table-top surface: place things on the table with u/v.
surfaces:
  top: { from: top.top }

# Attachment points for chairs around the table
attachments:
  seat_front:
    anchor: bottom_front_center
    offset: [0, 0, 0.4]
    facing: center

  seat_back:
    anchor: bottom_back_center
    offset: [0, 0, -0.4]
    facing: center

  seat_left:
    anchor: left_center
    offset: [-0.4, "{-height / 2}", 0]   # down to the floor
    facing: center

  seat_right:
    anchor: right_center
    offset: [0.4, "{-height / 2}", 0]
    facing: center
