# City street trash receptacle: a square bin with a swing-top lid. Anyone carrying a wrapper
# (items/wrapper.yaml) can throw it away: the `bin` interaction's `when` lets them, its
# rule takes the wrapper, and the `bin` affordance in front offers it to NPCs with a `tidy`
# need (the fairgoers of examples/amusement_park). Origin is at bottom_center.

name: trashcan
tags: [street.trashcan]
origin: bottom_center

params:
  width:  { default: 0.45 }
  height: { default: 1.0 }
  depth:  { default: 0.45 }

size: ["{width}", "{height}", "{depth}"]

parts:
  # Base (slightly wider)
  base:
    primitive: cube
    size: [1.0, 0.06, 1.0]
    anchor: bottom_center
    material: metal

  # Main body - tapered slightly (wider at top)
  body_lower:
    primitive: cube
    size: [0.85, 0.45, 0.85]
    attach_to: base
    at: top
    from: bottom
    material: metal

  body_upper:
    primitive: cube
    size: [0.95, 0.35, 0.95]
    attach_to: body_lower
    at: top
    from: bottom
    material: metal

  # Top rim
  rim:
    primitive: cube
    size: [1.0, 0.05, 1.0]
    attach_to: body_upper
    at: top
    from: bottom
    material: metal

  # Lid (domed)
  lid:
    primitive: sphere
    size: [0.90, 0.18, 0.90]
    attach_to: rim
    at: top
    from: bottom
    material: metal

  # Opening (front rectangular hole frame)
  opening_frame:
    primitive: cube
    size: [0.45, 0.20, 0.04]
    attach_to: body_upper
    at: front
    from: back
    offset: [0, 0.05, 0.01]
    material: metal

interactions:
  bin:
    targets: [body_upper, rim, lid, opening_frame]
    when: 'has("wrapper")'          # no prompt without one
    initial: ready
    duration: 0.3
    states:
      ready:   {prompt: "Throw away the wrapper", next: binning}
      binning: {then: ready, after: 0.5, emit: binned}

signals:
  binned: {emit: binned}

rules:
  - id: take_wrapper
    on: {signal: self.binned}
    do: [{take: wrapper}]

affordances:
  - {type: stand, at: [0, 0, 0.55], facing: 180, action: bin, duration: [0.5, 1.0], advertises: {tidy: 1.0},
     tags: [outside, bin], interaction: bin, approach: [0, 0, 0]}
