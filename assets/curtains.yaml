# Pair of pleated curtains on a chrome rod, drawn open to the sides.
# Origin: bottom-centre on the wall (floor level), fabric hangs in front (+Z).

name: curtains
tags: [furniture.curtains]
origin: bottom_center

params:
  width:  { default: 2.4 }   # rod length
  height: { default: 2.45 }  # rod height above the floor
  panel:  { default: 0.45 }  # width of each gathered panel

size: ["{width}", "{height}", 0.16]

parts:
  rod:
    primitive: cylinder
    size: ["{0.025 / width}", "{width / height}", "{0.025 / 0.16}"]
    anchor: center
    offset: [0, "{(height - 0.02) / height - 0.5}", "{0.06 / 0.16}"]
    rotation: [0, 0, 90]
    material: chrome
    collider: none
  # Gathered fabric: a wavy (pleated) strip extruded down from the rod.
  panel_left:
    primitive: extrude
    shape:
      polygon: [[-0.225, 0.0], [-0.19, 0.045], [-0.155, 0.0], [-0.12, 0.045], [-0.085, 0.0], [-0.05, 0.045], [-0.015, 0.0], [0.02, 0.045], [0.055, 0.0], [0.09, 0.045], [0.125, 0.0], [0.16, 0.045], [0.195, 0.0], [0.225, 0.04],
                [0.225, 0.052], [0.195, 0.012], [0.16, 0.057], [0.125, 0.012], [0.09, 0.057], [0.055, 0.012], [0.02, 0.057], [-0.015, 0.012], [-0.05, 0.057], [-0.085, 0.012], [-0.12, 0.057], [-0.155, 0.012], [-0.19, 0.057], [-0.225, 0.012]]
    fit: none
    axis: y
    size: ["{panel / width}", "{(height - 0.06) / height}", 0.4]
    anchor: bottom_center
    offset: ["{(panel / 2 - width / 2 + 0.03) / width}", "{0.01 / height}", "{0.06 / 0.16}"]
    material: fabric_velvet
    collider: none
  panel_right:
    primitive: extrude
    shape:
      polygon: [[-0.225, 0.0], [-0.19, 0.045], [-0.155, 0.0], [-0.12, 0.045], [-0.085, 0.0], [-0.05, 0.045], [-0.015, 0.0], [0.02, 0.045], [0.055, 0.0], [0.09, 0.045], [0.125, 0.0], [0.16, 0.045], [0.195, 0.0], [0.225, 0.04],
                [0.225, 0.052], [0.195, 0.012], [0.16, 0.057], [0.125, 0.012], [0.09, 0.057], [0.055, 0.012], [0.02, 0.057], [-0.015, 0.012], [-0.05, 0.057], [-0.085, 0.012], [-0.12, 0.057], [-0.155, 0.012], [-0.19, 0.057], [-0.225, 0.012]]
    fit: none
    axis: y
    size: ["{panel / width}", "{(height - 0.06) / height}", 0.4]
    anchor: bottom_center
    offset: ["{(width / 2 - panel / 2 - 0.03) / width}", "{0.01 / height}", "{0.06 / 0.16}"]
    material: fabric_velvet
    collider: none
