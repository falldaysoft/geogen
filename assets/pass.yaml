# The pass: a stainless counter where plates wait to go out, under a gantry
# of heat lamps. Stands free (staff on both sides); runs along X.

name: pass
tags: [kitchen.pass, furniture.counter]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

params:
  width: { default: 1.6 }

clearance: { front: 0.8, back: 0.8 }

light: { energy: 0.6, range: 3.0, color: [1.0, 0.7, 0.45], offset: [0, 1.3, 0] }

parts:
  counter:
    primitive: cube
    size: ["{width}", 0.92, 0.6]
    anchor: bottom_center
    bevel: 0.008
    material: chrome
  top:
    primitive: cube
    size: ["{width + 0.04}", 0.04, 0.64]
    anchor: bottom_center
    offset: [0, 0.92, 0]
    bevel: 0.004
    material: chrome
  post_l: &post
    primitive: cylinder
    size: [0.04, 0.55, 0.04]
    anchor: bottom_center
    offset: ["{-width / 2 + 0.05}", 0.96, 0]
    material: chrome
  post_r:
    <<: *post
    offset: ["{width / 2 - 0.05}", 0.96, 0]
  gantry:
    primitive: cube
    size: ["{width}", 0.08, 0.3]
    anchor: bottom_center
    offset: [0, 1.5, 0]
    bevel: 0.006
    material: chrome
  lamps:
    primitive: cube
    size: ["{width - 0.2}", 0.02, 0.18]
    anchor: bottom_center
    offset: [0, 1.48, 0]
    bevel: 0
    material: lamp_shade
    collider: none
  plate_1: &plate
    primitive: lathe
    profile: [[0, 0], [0.09, 0], [0.13, 0.012], [0.135, 0.018], [0.12, 0.016], [0.08, 0.006], [0, 0.006]]
    fit: none
    segments: 24
    size: [0.27, 0.018, 0.27]
    anchor: bottom_center
    offset: [-0.35, 0.961, 0]
    material: ceramic_white
    collider: none
  plate_2:
    <<: *plate
    offset: [0.15, 0.961, 0]
