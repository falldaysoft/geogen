# Marco Bellini, the chef at the Corner Bistro: a named person on top of the
# chef role (npcs/chef.yaml: the range, the prep counter, a look into the dining
# room now and then, home at night). The params fix his look whatever scene
# places him (the seed draws the rest); the placement puts him in the kitchen:
#   chef: { character: people/marco.yaml, slot: chef, home: { rect: [...] },
#           visits: { dining: { rect: [...] } } }

kind: character
version: 1

name: Marco Bellini
npc: npcs/chef.yaml
seed: 5
body:
  params: { preset: [masculine, athletic], hair_style: crop, hair_color: black, top_color: white,
            bottom_color: charcoal }

# Nosier than most cooks: he looks in on the diners more often (curiosity falls
# faster, and the look into the dining room answers it).
needs:
  curiosity: { initial: 0.7, decay: 0.008 }
