# Marco Bellini, the chef at the Corner Bistro: a named person on top of the
# hotel staff role. The params fix his look whatever scene places him (the
# seed draws the rest); the placement puts him in the kitchen:
#   chef: { character: people/marco.yaml, slot: chef, home: { rect: [...] } }

kind: character
version: 1

name: Marco Bellini
npc: npcs/hotel_staff.yaml
seed: 5
body:
  params: { preset: [masculine, athletic], hair_style: crop, hair_color: black, top_color: white,
            bottom_color: charcoal }

needs:
  work: { initial: 0.1, decay: 0.03 }    # back to the kitchen sooner than front-of-house staff
