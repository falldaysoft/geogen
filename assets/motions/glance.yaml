# Look at something for a while, then look back (geogen.103.4). It only wants the gaze, so it
# runs alongside whatever the body and hands are doing: sitting, carrying, pressing.
kind: motion
name: glance
category: action
summary: Look at something, then look back.
roles:
  target: {}
holds:
  claim: [gaze]
initial: look
beats:
  look:
    look: target
    after: duration
    interrupt: yield
    then: done
