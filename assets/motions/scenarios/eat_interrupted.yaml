# Eating at the table when something falls in the hall, with an interrupt (geogen.99.6: a stimulus
# she reacts to, `thud: {look, interrupt: true}`): the glance takes the gaze, eat finishes the bite
# on its way up and puts the hand down (its exit), and sit gets up through `rise` once it is down
# (what is running is cut short newest first, each once the one before has ended).
kind: motion_scenario
description: Eat seated; a noise mid-bite; the bite finishes, the hand goes down, she stands.
scene:
  slots:
    table: { position: [0, 0, 0], facing: north }
    chair: { position: [0, 0, 0.7], facing: south }
    door:  { position: [-1.8, 0, 1.4], facing: east }
  place:
    table: { asset: table.yaml, slot: table, params: { width: 0.9, depth: 0.7 } }
    chair: { asset: chair.yaml, slot: chair }
    plate: { asset: meal_plate.yaml, on: table.top, at: { u: 0.5, v: 0.9 } }
    lamp:  { asset: floor_lamp.yaml, slot: door }
actor: { archetype: characters/archetypes/young_woman.yaml, seed: 1, at: chair, offset: [0, 0, 0.2], facing: away }   # between the chair and the table
script:
  - { at: 0, start: sit, seat: chair, approach_z: 0.2, duration: 20 }
  - { at: 1.5, start: eat, food: plate, bites: 4 }
  - { at: 2.8, stimulus: thud, from: lamp }          # mid-bite: it finishes, then its exit; then up through rise
reacts:
  thud: { look: 3, interrupt: true }
camera: { view: iso_back, frame: [table, chair], margin: 0.2 }
