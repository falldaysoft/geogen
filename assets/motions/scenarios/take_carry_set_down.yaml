# Take a plate from the near edge of a table, carry it for a moment, set it down in the middle
# (geogen.103.4): three motions in turn on the right hand, the plate going with it from the grasp
# to the release.
kind: motion_scenario
description: Take a plate by its rim, carry it, set it down in the middle of the table.
scene:
  place:
    table: { asset: table.yaml, params: { width: 1.0, depth: 0.5 } }   # a narrow side table
    plate: { asset: plate.yaml, on: table.top, at: { u: 0.75, v: 0.8 } }
actor: { archetype: characters/archetypes/young_woman.yaml, seed: 1, at: plate, grip: pinch, offset: [-0.2, 0, 0.36], facing: toward }
script:
  - { at: 0.2, start: take, item: plate }
  - { at: 0.2, start: carry, item: plate }          # holds it from the lift (it only prefers the hand)
  - { at: 3.2, start: set_down, item: plate, place: table.top }
camera: { view: iso_back, frame: [table, actor], margin: 0.15 }
