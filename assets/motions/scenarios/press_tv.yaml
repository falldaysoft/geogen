# Stand in front of a TV on a table and press its power button (bending a little to reach it).
kind: motion_scenario
description: Stand at the TV, press its power button, take the hand back.
scene:
  slots:
    console: { position: [0, 0, 0], facing: south }
  place:
    console: { asset: table.yaml, slot: console }   # a table: the button sits at hand height less a bend
    tv:      { asset: tv.yaml, on: console.top, at: { u: 0.5, v: 0.5 } }
actor: { archetype: characters/archetypes/young_woman.yaml, seed: 1, at: tv, grip: press, offset: [-0.15, 0, 0.36], facing: toward }
script:
  - { at: 0.3, start: press, button: tv }
camera: { view: iso_back, frame: [tv, actor], margin: 0.15 }
