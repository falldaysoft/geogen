# Put a thing carried in both hands down (geogen.103.8): take_both's mirror. The right hand aims the
# thing at the place, the left stays on its side, and both open off it once it is down.
kind: motion
name: set_down_both
category: action
summary: Put a thing carried in both hands down on a surface.
roles:
  item: { grip: any }
  place: { grip: put }
props:
  item: { asset: pumpkin.yaml, at: { u: 0.5, v: 0.7 } }
demo:
  - { at: 0, start: take_both, item: item }
  - { at: 0, start: carry_both, item: item }
  - { at: 3.5, start: set_down_both, item: item, place: item@start }
holds:
  claim: [left_hand, right_hand, gaze]
  prefer: [spine]
initial: over
beats:
  over:
    ik:
      RightHand: { target: place, offset: [0, 0.06, 0], holding: item, grip: flat, fingers: [0, 0, 1], palm: [1, 0, 0], pole: [-1, -1, 0] }
      LeftHand: { target: item.left, grip: flat, fingers: [0, 0, 1], palm: [-1, 0, 0], pole: [1, -1, 0] }
    look: place
    over: 0.9
    interrupt: finish
    then: lower
  lower:
    ik:
      RightHand: { target: place, offset: [0, 0.002, 0], holding: item, grip: flat, fingers: [0, 0, 1], palm: [1, 0, 0], pole: [-1, -1, 0] }
      LeftHand: { target: item.left, grip: flat, fingers: [0, 0, 1], palm: [-1, 0, 0], pole: [1, -1, 0] }
    look: place
    over: 0.4
    release: item
    emit: put
    interrupt: finish
    then: let_go
  let_go:                                  # the hands open and come off its sides
    ik:
      LeftHand: { target: item.left_off, grip: open, fingers: [0, 0, 1], palm: [-1, 0, 0], pole: [1, -1, 0] }
      RightHand: { target: item.right_off, grip: open, fingers: [0, 0, 1], palm: [1, 0, 0], pole: [-1, -1, 0] }
    look: item
    over: 0.3
    interrupt: finish
    then: back
  back:
    over: 0.7
    interrupt: drop
    then: done
