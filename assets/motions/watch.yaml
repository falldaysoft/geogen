# Watch something for a while (geogen.103.4): the gaze on it and nothing else. Unlike `glance` it
# only shares the gaze: anything that claims it (a glance at a noise, a reach that looks at what it
# takes) has it while it runs, and the eyes go back to the TV after; another sharer (eating) takes
# turns with it, the TV for longer (geogen.103.6).
kind: motion
name: watch
category: action
summary: Watch something for a while.
roles:
  target: { grip: look }
holds:
  share: { gaze: 1.5 }
initial: watching
beats:
  watching:
    look: target
    after: duration
    interrupt: yield
    then: done
