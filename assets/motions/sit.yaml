# Sit on a seat and get up again (geogen.103; the design's worked example 1).
# The seat is the affordance's anchor (or an attachment with grip: sit). Only the body is held:
# the hands are preferred, so someone carrying a plate or holding a remote sits with it.
kind: motion
name: sit
category: action
summary: Sit down on a seat, stay a while, get up.
roles:
  seat: { grip: sit }
  arms: { grip: rest, optional: true }     # an armchair's armrests, when it has them
params:
  # The leans are for a body without transition clips: one with sit_down / stand_up plays those
  # (cleared of its clothes by the build), lean and all.
  lean_down: { default: 32 }
  lean_up:   { default: 38 }
  # Where the body stands before sitting and after getting up, from the seat (m: x to the seat's
  # left, z ahead of it). Less far ahead for a chair at a table, which has the table there.
  approach_x: { default: 0 }
  approach_z: { default: 0.35 }
holds:
  require: [root, legs, hips]
  claim: [spine]
  prefer: [left_hand, right_hand]
posture: { from: stand, to: sit }
initial: arrive
beats:
  arrive:                                  # in front of the seat, back to it
    root: { at: seat, offset: ["{approach_x}", 0, "{approach_z}"], facing: away }
    interrupt: drop                        # nothing to undo yet
    then: lower
  lower:
    pose: sit
    root: { at: seat, posture: sit }
    lean: { by: "{lean_down}", at: 0.4 }
    plant: feet
    ik:
      LeftHand: { target: arms.left, rest: true }   # no armrests: the pose's own lap
      mirror: true
    over: 1.4
    interrupt: finish                      # land first, then get up
    then: seated
  seated:
    pose: sit
    plant: feet                            # where they landed
    after: duration
    interrupt: yield
    exit: rise
    then: rise
  rise:
    pose: stand
    root: { at: seat, offset: ["{approach_x}", 0, "{approach_z}"], facing: away }
    lean: { by: "{lean_up}", at: 0.5 }
    plant: feet
    over: 1.3
    interrupt: finish
    then: done
