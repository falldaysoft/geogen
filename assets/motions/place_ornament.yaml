# Put what is in the hand on a spot in front (geogen.110): the arm goes out to it and stays there
# until the thing is on. Only the hand and the gaze are held, so the body stays upright: a spot is
# chosen to be within an arm's reach of where one stands.
kind: motion
name: place_ornament
category: action
summary: Reach out and put a small thing on a spot in front.
roles:
  spot: { grip: press }
holds:
  claim: [right_hand]
  prefer: [gaze]
initial: reach
beats:
  reach:
    ik:
      RightHand: { target: spot, arc: 0.06, offset: [0, 0.01, 0.07], grip: spot, pole: [-0.4, -1, 0] }
    look: spot
    over: 0.9
    interrupt: yield
    exit: back
    then: place
  place:
    ik:
      RightHand: { target: spot, offset: [0, 0.0, 0.045], grip: spot, pole: [-0.4, -1, 0] }
    look: spot
    over: 0.35
    emit: placed
    interrupt: finish
    then: done
  back:
    over: 0.5
    interrupt: drop
    then: done
