# Celebrate (geogen.103.17): a crouch, then a jump with both fists flung up, and a landing that
# bends the knees. Body only.
kind: motion
name: celebrate_jump
category: emote
summary: A jump for joy, both fists flung up.
params:
  hop: { default: 0.14 }      # share of the leg's length the body leaves the floor
holds:
  require: [root, hips, legs, spine, left_hand, right_hand]
  claim: [gaze]
initial: crouch
beats:
  crouch:
    hips: [0, "{-0.12 * height * leg_ratio}", "{-0.04 * height * leg_ratio}"]
    bones: { Spine: [12, 0, 0], Chest: [6, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.7}", "{height * 0.62}", "{height * 0.14}"], pole: [0.5, -1, -0.5], grip: fist }
      mirror: true
    plant: feet
    over: 0.35
    interrupt: finish
    then: jump
  jump:
    hips: [0, "{hop * height * leg_ratio}", 0]
    bones: { Spine: [-4, 0, 0], Head: [-12, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.85}", "{height * 0.98}", "{height * 0.08}"], pole: [1, 0, -0.3], grip: fist }
      mirror: true
    over: 0.3
    interrupt: finish
    then: land
  land:
    hips: [0, "{-0.08 * height * leg_ratio}", "{-0.02 * height * leg_ratio}"]
    bones: { Spine: [8, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.9}", "{height * 0.9}", "{height * 0.07}"], pole: [1, -0.5, -0.3], grip: fist }
      mirror: true
    over: 0.25
    ease: settle
    interrupt: finish
    then: stand
  stand:
    pose: stand
    over: 0.7
    interrupt: drop
    then: done
