# Take a thing in one hand (geogen.103.4; the design's worked example 2): reach over it with the
# hand open, close the hand on the grip the thing offers (a plate's rim: rim), lift it to where
# it is carried. The thing decides how it is held: the role binds its first held grip (`any`) and
# the hand takes that grip's shape. From here `carry` holds it and `set_down` puts it somewhere.
# Only the hand, the spine (to bend for a low thing) and the gaze are held: someone sitting takes
# the remote beside them.
kind: motion
name: take
category: action
summary: Reach for a thing, close the hand on its grip, lift it to carry.
roles:
  item: { grip: any }
props:
  item: { asset: plate.yaml, at: { u: 0.83, v: 0.7 } }   # what a demonstration puts on the table in front
demo:                                     # how it is shown: taken, carried a moment, put back where it stood
  - { at: 0, start: take, item: item }
  - { at: 0, start: carry, item: item }
  - { at: 3.0, start: set_down, item: item, place: item@start }
params:
  # Where it is carried, in the body frame (x to the left, y up, z ahead), a share of this body.
  carry_x: { default: -0.45 }     # of the shoulder width: in front of the right hip
  carry_y: { default: 0.58 }      # of the height: waist high
  carry_z: { default: 0.68 }      # of the arm's length ahead (the hand clear of a heavy body's front)
holds:
  claim: [right_hand, gaze]
  prefer: [spine]
initial: reach
beats:
  reach:                                   # over the grip, the hand open
    ik:
      RightHand: { target: item, tip: index, arc: 0.08, offset: [0, 0.06, 0.03], grip: open, fingers: [0.35, -0.1, 1], palm: [0, -1, 0] }
    look: item
    over: 0.8                              # up and over: longer than the straight way
    interrupt: yield                       # nothing taken yet: the hand just goes back
    exit: back
    then: grasp
  grasp:                                   # down onto the grip, the hand closing on it (the fingertip on it,
                                           # wherever this hand's size puts the wrist)
    ik:
      RightHand: { target: item, tip: index, offset: [0, 0.008, -0.004], grip: item, fingers: [0.35, -0.1, 1], palm: [0, -1, 0] }
    look: item
    over: 0.35
    attach: { item: { hand: right, level: true } }   # a plate stays flat however the wrist turns
    emit: taken
    interrupt: finish                      # once it is in the hand, it is lifted
    then: lift
  lift:                                    # up to where it is carried
    ik:
      RightHand:
        target: ["{shoulder_width * carry_x}", "{height * carry_y}", "{height * arm_ratio * carry_z}"]
        pole: [-0.4, -1, 0]                # the elbow down and a little out
        grip: item
        fingers: [0.35, -0.1, 1]             # palm down, the fingers ahead: what it holds stays above the hand's
        palm: [0, -1, 0]                   # lowest point (a plate set down on a table, not the fingers in it)
    look: item
    over: 0.8
    interrupt: finish
    then: done
  back:                                    # the hand back to rest, empty
    over: 0.5
    interrupt: drop
    then: done
