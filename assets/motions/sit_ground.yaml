# Sit on the ground (geogen.103.17): down onto the floor with the knees up and the arms round
# them, a while there, and back up. Body only: the hips go down to the floor over the feet,
# which then slide out in front.
kind: motion
name: sit_ground
category: emote
summary: Sitting on the floor hugging the knees, then getting up.
params:
  duration: { default: 2.5 }
holds:
  require: [root, hips, legs, spine, left_hand, right_hand]
  claim: [gaze]
initial: crouch
beats:
  crouch:                                  # down over the feet, a hand reaching back to the floor
    hips: [0, "{-0.55 * height * leg_ratio}", "{-0.12 * height * leg_ratio}"]
    plant: feet
    bones: { Spine: [28, 0, 0], Chest: [10, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.6}", "{height * 0.3}", "{height * 0.15}"], pole: [0.6, -0.2, -1], grip: open }
      mirror: true
    over: 1.1
    interrupt: finish
    then: down
  down:                                    # on the floor, knees up, arms round them
    hips: [0, "{-height * leg_ratio + 0.12}", "{-0.24 * height}"]
    bones:
      Spine: [14, 0, 0]
      Chest: [8, 0, 0]
      Head: [-10, 0, 0]
      LeftUpperLeg: [-135, 0, 8]
      RightUpperLeg: [-135, 0, -8]
      LeftLowerLeg: [112, 0, 0]
      RightLowerLeg: [112, 0, 0]
      LeftFoot: [25, 0, 0]
      RightFoot: [25, 0, 0]
    ik:
      LeftHand: { target: [-0.03, "{height * 0.22}", "{height * 0.04}"], pole: [1, -0.3, -0.3], grip: relaxed,
                  fingers: [-1, 0, 0], palm: [0, 0, -1] }
      RightHand: { target: [0.03, "{height * 0.2}", "{height * 0.035}"], pole: [-1, -0.3, -0.3], grip: relaxed,
                   fingers: [1, 0, 0], palm: [0, 0, -1] }
    over: 0.9
    after: duration
    interrupt: yield
    exit: rise
    then: rise
  rise:                                    # back over the feet
    hips: [0, "{-0.55 * height * leg_ratio}", "{-0.12 * height * leg_ratio}"]
    plant: feet
    bones: { Spine: [32, 0, 0], Chest: [10, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.5}", "{height * 0.35}", "{height * 0.2}"], pole: [0.6, -0.2, -1], grip: flat }
      mirror: true
    over: 1.0
    interrupt: finish
    then: stand
  stand:
    pose: stand
    plant: feet
    over: 1.0
    interrupt: finish
    then: done
