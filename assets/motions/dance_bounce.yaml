# Dance: bounce (geogen.103.17): a loop. A bounce at the knees on every beat, the elbows bent and
# the fists pumping forward one after the other, the head nodding along; `bars` times.
kind: motion
name: dance_bounce
category: dance
summary: Bouncing at the knees, fists pumping in turn.
params:
  bars:   { default: 4 }
  beat:   { default: 0.3 }    # s per half-beat
  bounce: { default: 0.06 }   # share of the leg's length the hips drop
holds:
  require: [hips, legs, spine, left_hand, right_hand]
  claim: [gaze]
initial: down_left
beats:
  down_left:
    hips: [0, "{-bounce * height * leg_ratio}", "{-0.01 * height}"]
    bones: { Spine: [6, 0, 0], Head: [8, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.4}", "{height * 0.66}", "{height * 0.2}"], pole: [0.6, -1, -0.3], grip: fist }
      RightHand: { target: ["{-shoulder_width * 0.55}", "{height * 0.62}", "{height * 0.04}"], pole: [-0.6, -1, -0.3], grip: fist }
    plant: feet
    over: "{beat}"
    ease: settle
    interrupt: yield
    exit: still
    then: up_left
  up_left:
    bones: { Spine: [2, 0, 0], Head: [-2, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.45}", "{height * 0.65}", "{height * 0.12}"], pole: [0.6, -1, -0.3], grip: fist }
      RightHand: { target: ["{-shoulder_width * 0.5}", "{height * 0.64}", "{height * 0.1}"], pole: [-0.6, -1, -0.3], grip: fist }
    plant: feet
    over: "{beat}"
    interrupt: yield
    exit: still
    then: down_right
  down_right:
    hips: [0, "{-bounce * height * leg_ratio}", "{-0.01 * height}"]
    bones: { Spine: [6, 0, 0], Head: [8, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.55}", "{height * 0.62}", "{height * 0.04}"], pole: [0.6, -1, -0.3], grip: fist }
      RightHand: { target: ["{-shoulder_width * 0.4}", "{height * 0.66}", "{height * 0.2}"], pole: [-0.6, -1, -0.3], grip: fist }
    plant: feet
    over: "{beat}"
    ease: settle
    interrupt: yield
    exit: still
    then: up_right
  up_right:
    bones: { Spine: [2, 0, 0], Head: [-2, 0, 0] }
    ik:
      LeftHand: { target: ["{shoulder_width * 0.5}", "{height * 0.64}", "{height * 0.1}"], pole: [0.6, -1, -0.3], grip: fist }
      RightHand: { target: ["{-shoulder_width * 0.45}", "{height * 0.65}", "{height * 0.12}"], pole: [-0.6, -1, -0.3], grip: fist }
    plant: feet
    over: "{beat}"
    interrupt: yield
    exit: still
    loop: { to: down_left, times: "{bars}" }
    then: still
  still:
    pose: stand
    plant: feet
    over: 0.6
    interrupt: drop
    then: done
