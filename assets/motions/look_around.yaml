# Look around (geogen.103.17): an idle. The head turns to the left, across to the right, up a
# little, and back ahead, dwelling on each. Only the gaze: it runs over anything else.
kind: motion
name: look_around
category: idle
summary: Glancing left, right and up, then back ahead.
params:
  dwell: { default: 0.9 }     # s on each thing looked at
holds:
  claim: [gaze]
initial: left
beats:
  left:
    look: [3, 1.5, 3.5]
    over: 0.6
    after: "{dwell}"
    interrupt: yield
    exit: ahead
    then: right
  right:
    look: [-3.5, 1.3, 2.5]
    over: 0.9
    after: "{dwell}"
    interrupt: yield
    exit: ahead
    then: up
  up:
    look: [-1, 3.5, 4]
    over: 0.6
    after: "{dwell * 0.7}"
    interrupt: yield
    exit: ahead
    then: ahead
  ahead:
    over: 0.6
    interrupt: drop
    then: done
