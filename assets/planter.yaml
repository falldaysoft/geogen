# Potted plant: turned ceramic pot with a leafy bush. Origin bottom_center.

name: planter
tags: [decor.planter, furniture.planter]
origin: bottom_center

params:
  height: { default: 1.3 }

size: [0.6, "{height}", 0.6]

clearance: { front: 0.1 }

parts:
  pot:
    primitive: lathe
    profile: [[0, 0], [0.7, 0], [0.8, 0.1], [1.0, 0.85], [0.95, 1.0], [0, 1.0]]
    size: [0.75, "{0.42 / height}", 0.75]
    anchor: bottom_center
    material: ceramic_white
  soil:
    primitive: cylinder
    size: [0.66, "{0.02 / height}", 0.66]
    anchor: bottom_center
    offset: [0, "{0.405 / height}", 0]      # soil top 5 mm above the rim: level, the two z-fight
    material: dirt
    collider: none
  foliage:
    primitive: ellipsoid
    size: [1.0, "{(height - 0.38) / height}", 1.0]
    anchor: bottom_center
    offset: [0, "{0.38 / height}", 0]
    material: foliage_green
    collider: none
  foliage_top:
    primitive: ellipsoid
    size: [0.7, "{(height - 0.6) * 0.8 / height}", 0.7]
    anchor: bottom_center
    offset: [0.08, "{0.62 / height}", -0.06]
    material: foliage_green
    collider: none
