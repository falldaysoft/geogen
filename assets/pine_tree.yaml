# Pine tree - a conifer grown by space colonisation (generators/nature.py):
# a straight leader with drooping boughs and flattened needle clusters.
# Origin is at bottom_center. `scale` multiplies every dimension; `seed`
# grows a different tree.

name: pine_tree
tags: [vegetation.tree]
origin: bottom_center

params:
  scale: { default: 1 }
  seed:  { default: 2 }

size: ["{scale}", "{scale}", "{scale}"]
bounds: geometry     # declared size = the real extent (the container above is a unit)

parts:
  tree:
    primitive: tree
    style: conifer
    size: [3.4, 6.0, 3.4]
    anchor: bottom_center
    seed: "{seed}"
    trunk_radius: "{0.15 * scale}"
    step: "{0.3 * scale}"
    leaf_size: "{0.36 * scale}"
    attractors: 650
    material: bark
