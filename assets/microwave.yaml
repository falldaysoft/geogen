# A countertop microwave oven: a white case, a dark glass door with a handle and a control
# panel with a knob. Sits on a counter (`on: counter.top`), door facing +Z.
# It turns raw food into a meal, quicker than a range does (geogen.101.5).

name: microwave
tags: [kitchen.microwave, appliance]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

parts:
  case:
    primitive: cube
    size: [0.48, 0.28, 0.36]
    anchor: bottom_center
    bevel: 0.012
    material: ceramic_white
  door:
    primitive: cube
    size: [0.33, 0.24, 0.012]
    anchor: bottom_center
    offset: [-0.065, 0.02, 0.183]
    bevel: 0.004
    material: plastic_black
    collider: none
  window:
    primitive: cube
    size: [0.25, 0.15, 0.004]
    anchor: bottom_center
    offset: [-0.065, 0.065, 0.19]
    bevel: 0
    material: glass
    collider: none
  handle:
    primitive: cube
    size: [0.016, 0.18, 0.02]
    anchor: bottom_center
    offset: [0.085, 0.05, 0.193]
    bevel: 0.005
    material: chrome
    collider: none
  panel:
    primitive: cube
    size: [0.1, 0.24, 0.008]
    anchor: bottom_center
    offset: [0.175, 0.02, 0.181]
    bevel: 0.002
    material: plastic_black
    collider: none
  dial:
    primitive: cube
    size: [0.05, 0.05, 0.012]
    anchor: bottom_center
    offset: [0.175, 0.07, 0.185]
    bevel: 0.006
    material: chrome
    collider: none
  foot:
    primitive: cylinder
    size: [0.03, 0.012, 0.03]
    anchor: bottom_center
    offset: [-0.2, -0.012, 0.14]
    material: plastic_black
    collider: none
    array: { count: 2, step: [0.4, 0, 0] }

affordances:
  - { type: stand, action: attend, at: [0, 0, 0.75], approach: [0, 0, 0], facing: 180, duration: [5, 8],
      requires: { holding: raw_food }, takes: raw_food, gives: meal, tags: [household] }
