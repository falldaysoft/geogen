# A bar stool: a turned chrome base and post, a footring, and a padded
# round seat 76 cm up. Sitters face +Z (toward the counter when placed round one).

name: bar_stool
tags: [furniture.stool, furniture.bar_stool]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

parts:
  base:
    primitive: lathe
    profile: [[0, 0], [0.2, 0], [0.2, 0.02], [0.05, 0.06], [0, 0.06]]
    fit: none
    segments: 24
    size: [0.4, 0.06, 0.4]
    anchor: bottom_center
    material: chrome
  post:
    primitive: cylinder
    size: [0.05, 0.66, 0.05]
    anchor: bottom_center
    offset: [0, 0.06, 0]
    material: chrome
  footring:
    primitive: torus
    size: [0.36, 0.024, 0.36]
    anchor: bottom_center
    offset: [0, 0.3, 0]
    material: chrome
    collider: none
  seat:
    primitive: cylinder
    size: [0.38, 0.06, 0.38]
    anchor: bottom_center
    offset: [0, 0.71, 0]
    bevel: 0.025
    material: leather

affordances:
  - { type: sit, at: [0, 0.77, -0.02], facing: 0, height: 0.77, depth: 0.12, approach: [0, 0, -0.55], duration: [30, 90],
      advertises: { rest: 0.3 }, tags: [seat, bar] }
