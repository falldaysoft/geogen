# Wall-mounted flat TV. Origin: bottom-centre on the wall, screen faces +Z
# (place on a wall surface: on: suite.bedroom.north_wall).

name: tv
tags: [furniture.tv, electronics.tv]
origin: bottom_center

params:
  width:  { default: 1.1 }
  height: { default: 0.65 }
  depth:  { default: 0.06 }
  above_floor: { default: 0.5 }      # how high it stands: where someone stands to work it is on the floor

size: ["{width}", "{height}", "{depth}"]

parts:
  body:
    primitive: cube
    size: [1, 1, "{(depth - 0.02) / depth}"]
    anchor: bottom_center
    offset: [0, 0, "{(0.02 + (depth - 0.02) / 2) / depth}"]
    bevel: 0.006
    material: plastic_black
  bracket:
    primitive: cube
    size: ["{0.3 / width}", "{0.25 / height}", "{0.02 / depth}"]
    anchor: bottom_center
    offset: [0, "{0.2 / height}", "{0.01 / depth}"]
    bevel: 0
    material: metal
  screen:
    primitive: cube
    size: ["{(width - 0.03) / width}", "{(height - 0.03) / height}", "{0.004 / depth}"]
    anchor: bottom_center
    offset: [0, "{0.015 / height}", "{(depth + 0.001) / depth}"]
    bevel: 0
    material: screen
    collider: none
  # The picture, just in front of the dark glass: shown while the TV is on.
  picture:
    primitive: cube
    size: ["{(width - 0.05) / width}", "{(height - 0.05) / height}", "{0.002 / depth}"]
    anchor: bottom_center
    offset: [0, "{0.025 / height}", "{(depth + 0.004) / depth}"]
    bevel: 0
    material: screen_on
    collider: none

# Where a body touches it (motions, geogen/motion.py): the power button low on the bezel's
# right as you face it, and the middle of the screen to look at.
attachments:
  power_button: { anchor: bottom_center, offset: [-0.48, 0.008, "{depth}"], grip: press }
  screen:       { anchor: center, offset: [0, 0, "{depth / 2}"], grip: look }

# Power toggle: the picture shows while it is on.
interactions:
  power:
    touch: power_button            # where a body works it (motions: press on tv.power)
    targets: [screen, body]
    initial: "off"
    states:
      "off": { prompt: Turn on TV, next: "on", emit: tv_off }
      "on":  { prompt: Turn off TV, next: "off", emit: tv_on }
    motions:
      - { parts: [picture], show: ["on"] }

# Someone at home switches it on to watch it from a seat facing it (sofa.yaml's `watch`), and
# off again when nobody is counting on it.
affordances:
  - { type: stand, action: stand, at: [0, "{-above_floor}", 0.7], approach: [0, 0, 0], facing: 180, duration: [2, 3],
      requires: { state: { power: "off" } }, sets: { power: "on" }, tags: [household] }
  - { type: stand, action: stand, at: [0, "{-above_floor}", 0.7], approach: [0, 0, 0], facing: 180, duration: [2, 3],
      requires: { state: { power: "on" } }, sets: { power: "off" }, advertises: { order: 0.1 }, tags: [household] }

