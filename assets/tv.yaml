# Wall-mounted flat TV. Origin: bottom-centre on the wall, screen faces +Z
# (place on a wall surface: on: suite.bedroom.north_wall).

name: tv
tags: [furniture.tv, electronics.tv]
origin: bottom_center

params:
  width:  { default: 1.1 }
  height: { default: 0.65 }
  depth:  { default: 0.06 }

size: ["{width}", "{height}", "{depth}"]

parts:
  body:
    primitive: cube
    size: [1, 1, "{(depth - 0.02) / depth}"]
    anchor: bottom_center
    offset: [0, 0, "{(0.02 + (depth - 0.02) / 2) / depth}"]
    bevel: 0.006
    material: plastic_black
  bracket:
    primitive: cube
    size: ["{0.3 / width}", "{0.25 / height}", "{0.02 / depth}"]
    anchor: bottom_center
    offset: [0, "{0.2 / height}", "{0.01 / depth}"]
    bevel: 0
    material: metal
  screen:
    primitive: cube
    size: ["{(width - 0.03) / width}", "{(height - 0.03) / height}", "{0.004 / depth}"]
    anchor: bottom_center
    offset: [0, "{0.015 / height}", "{(depth + 0.001) / depth}"]
    bevel: 0
    material: screen
    collider: none

# Power toggle (no moving parts; runtimes react to the emitted events).
interactions:
  power:
    targets: [screen, body]
    initial: "off"
    states:
      "off": { prompt: Turn on TV, next: "on", emit: tv_off }
      "on":  { prompt: Turn off TV, next: "off", emit: tv_on }
    motions: []

