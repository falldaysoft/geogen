# Kitchen-diner: fridge, range and sink along the walls, and a table with chairs round it.

name: kitchen
finishes: { walls: tile_subway, floor: tile_floor_grey }

items:
  range:
    asset: kitchen_range.yaml
    against: wall
    prefer: [no_door_wall, no_window_wall]
  fridge:
    asset: fridge.yaml
    against: wall
    prefer: [corner, {near: range}]
  sink:
    asset: kitchen_sink.yaml
    against: wall
    prefer: [window_wall, {near: range}]
  table:
    asset: table.yaml
    against: none
    facing: north
    clearance: { front: 0.8, back: 0.8, left: 0.8, right: 0.8 }
    prefer: [centered]
  chair:
    asset: chair.yaml
    around: table
    min: 2
  planter:
    asset: planter.yaml
    against: wall
    prefer: [corner]
    optional: true
