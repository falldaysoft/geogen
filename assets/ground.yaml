# Ground plane - flat grass surface

name: ground
origin: bottom_center

params:
  width:     { default: 30 }
  thickness: { default: 0.05 }
  depth:     { default: 24 }

size: ["{width}", "{thickness}", "{depth}"]

parts:
  surface:
    primitive: cube
    size: [1.0, 1.0, 1.0]
    anchor: bottom_center
    offset: [0, 0, 0]
    bevel: 0
    material: grass

# Scenes can place objects directly on the ground with on: ground.top.
surfaces:
  top: { from: surface.top }
