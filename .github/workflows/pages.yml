# Publishes the asset catalogue (docs/catalogue, turned into HTML by docs/make_site.py)
# to GitHub Pages. Needs Settings > Pages > Source set to "GitHub Actions".
name: Catalogue site

on:
  push:
    branches: [main]
    paths:
      - docs/catalogue/**
      - docs/make_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the site
        run: python3 docs/make_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
