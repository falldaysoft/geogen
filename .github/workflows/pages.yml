# Publishes the asset catalogue (docs/catalogue, turned into HTML by docs/make_site.py)
# to GitHub Pages, with web builds of the Godot runtime at play/ (the showcases) and
# play/<example>/ (each project in examples/), sharing one engine at play/engine/
# (runtime/godot/tools/export_web.py), and every asset as a GLB at models/ (docs/make_models.py)
# for the Three.js viewer (runtime/web, at view/). Needs Settings > Pages > Source set to "GitHub Actions".
name: Catalogue site

on:
  push:
    branches: [main]
    paths:
      - docs/catalogue/**
      - docs/make_site.py
      - .github/workflows/pages.yml
      - src/**
      - assets/**
      - runtime/godot/**
      - runtime/web/**
      - examples/**
      - docs/make_models.py
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  web:
    # The runtime and its scenes, and the models, rebuilt only when something they're made from changed.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: _web
          key: web-${{ env.GODOT_VERSION }}-${{ hashFiles('src/**', 'assets/**', 'examples/**', 'runtime/godot/**', 'docs/make_models.py', 'pyproject.toml') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Install geogen
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libgl1 libegl1 libglu1-mesa libxkbcommon0 libfontconfig1 libdbus-1-3 xvfb
          # pyrender 0.1.45 pins PyOpenGL==3.1.0 and geogen needs >=3.1.7 (numpy 2), so pip can't
          # resolve `pip install -e .`: the dependencies first, then pyrender and geogen without theirs.
          python -c "import tomllib; print('\n'.join(d for d in tomllib.load(open('pyproject.toml', 'rb'))['project']['dependencies'] if not d.startswith('pyrender')))" > /tmp/reqs.txt
          pip install -q -r /tmp/reqs.txt freetype-py imageio networkx six
          pip install -q --no-deps pyrender==0.1.45 -e .
      - if: steps.cache.outputs.cache-hit != 'true'
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-web
      - if: steps.cache.outputs.cache-hit != 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        name: Download Godot and its web export template
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLo godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip
          curl -sSLo templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -qj templates.tpz templates/web_nothreads_release.zip && rm templates.tpz
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the web runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$templates" && cp ~/godot/web_nothreads_release.zip "$templates/"
          # geogen.main imports the renderer (pyrender, pyglet), which needs a display even unused.
          export=(xvfb-run -a python runtime/godot/tools/export_web.py --godot ~/godot/godot --engine _web/play/engine)
          "${export[@]}" _web/play
          for project in examples/*/; do
            "${export[@]}" "_web/play/$(basename "$project")" --project "$project"
          done
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Export the models
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run -a python docs/make_models.py _web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: _web

  deploy:
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: _site
      - name: Build the site
        run: python3 docs/make_site.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
