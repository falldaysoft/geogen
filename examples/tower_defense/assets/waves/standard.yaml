# The tower defense's eight waves: grunts first, then runners, then brutes, mixed and
# denser as they go. The gate stops after each wave is cleared; the wave lever sends the
# next (auto: false). Tuned in tests/test_tower_defense.py against the reference simulation.
kind: waves
auto: false
waves:
  - delay: 2
    items: [{item: items/grunt.yaml, count: 6, gap: 1.6}]
  - delay: 2
    items: [{item: items/grunt.yaml, count: 9, gap: 1.2}]
  - delay: 2
    items:
      - {item: items/runner.yaml, count: 6, gap: 0.8}
      - {item: items/grunt.yaml, count: 5, gap: 1.2}
  - delay: 2
    items:
      - {item: items/grunt.yaml, count: 10, gap: 1.0}
      - {item: items/brute.yaml, count: 1, gap: 1.0}
  - delay: 2
    items:
      - {item: items/runner.yaml, count: 10, gap: 0.6}
      - {item: items/grunt.yaml, count: 6, gap: 1.0}
  - delay: 2
    items:
      - {item: items/brute.yaml, count: 3, gap: 3.0}
      - {item: items/grunt.yaml, count: 10, gap: 0.9}
  - delay: 2
    items:
      - {item: items/runner.yaml, count: 12, gap: 0.5}
      - {item: items/brute.yaml, count: 4, gap: 2.5}
  - delay: 2
    items:
      - {item: items/brute.yaml, count: 6, gap: 2.0}
      - {item: items/grunt.yaml, count: 12, gap: 0.8}
      - {item: items/runner.yaml, count: 10, gap: 0.5}
