# The tower defense's eight waves: grunts first, then runners, then brutes, mixed and
# denser as they go. The gate stops after each wave is cleared; the wave lever sends the
# next (auto: false). Tuned in tests/test_tower_defense.py against the reference simulation.
kind: waves
auto: false
waves:
  - delay: 2
    items: [{item: items/grunt.yaml, count: 6, gap: 1.6}]
  - delay: 2
    items: [{item: items/grunt.yaml, count: 10, gap: 1.1}]
  - delay: 2
    items:
      - {item: items/runner.yaml, count: 8, gap: 0.7}
      - {item: items/grunt.yaml, count: 6, gap: 1.0}
  - delay: 2
    items:
      - {item: items/grunt.yaml, count: 12, gap: 0.9}
      - {item: items/brute.yaml, count: 2, gap: 2.5}
  - delay: 2
    items:
      - {item: items/runner.yaml, count: 14, gap: 0.5}
      - {item: items/grunt.yaml, count: 10, gap: 0.8}
  - delay: 2
    items:
      - {item: items/brute.yaml, count: 4, gap: 2.5}
      - {item: items/grunt.yaml, count: 14, gap: 0.7}
  - delay: 2
    items:
      - {item: items/runner.yaml, count: 18, gap: 0.4}
      - {item: items/brute.yaml, count: 6, gap: 2.0}
  - delay: 2
    items:
      - {item: items/brute.yaml, count: 8, gap: 1.6}
      - {item: items/grunt.yaml, count: 16, gap: 0.7}
      - {item: items/runner.yaml, count: 16, gap: 0.4}
