# A 12 cm glazed ball for the marble run: a rolling physics prop (a sphere collider, and
# damping that holds it to about 1.4 m/s down the 4-degree run and settles it), tinted
# `colour`. Origin: bottom centre.

name: ball
tags: [prop.ball]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

params:
  colour: {default: car_red, type: text, choices: [car_red, car_blue, taxi_yellow, teal_green]}

physics: {mass: 0.4, friction: 0.5, bounce: 0.1, shape: sphere, damping: {linear: 0.35, angular: 0.1}, carry: true}

parts:
  body:
    primitive: sphere
    size: [0.12, 0.12, 0.12]
    anchor: bottom_center
    material: ball_glaze
    tint: "{colour}"
