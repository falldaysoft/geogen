# A spring: clear water in a stone basin among mossy rocks. Drink (E) and your thirst is gone.
# Origin: on the ground at the basin's middle.
name: spring
tags: [resource.water]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

state:
  thirst: {scope: actor, type: number, default: 100}    # the castaway's (the scene's default wins)

parts:
  basin:
    primitive: lathe
    profile: [[0, 0], [0.9, 0], [1.0, 0.25], [0.95, 0.32], [0.7, 0.3], [0.65, 0.12], [0, 0.12]]
    size: [2.0, 0.32, 2.0]
    anchor: bottom_center
    segments: 24
    material: rock
  water:
    primitive: cylinder
    size: [1.3, 0.02, 1.3]
    anchor: bottom_center
    offset: [0, 0.2, 0]
    material: water
    collider: none
  rock_a:
    primitive: rock
    size: [0.7, 0.55, 0.6]
    anchor: bottom_center
    offset: [0.9, 0, -0.6]
    seed: 11
    roughness: 0.1
    material: rock
  rock_b:
    primitive: rock
    size: [0.5, 0.4, 0.5]
    anchor: bottom_center
    offset: [-0.95, 0, -0.3]
    seed: 12
    roughness: 0.1
    material: rock
  rock_c:
    primitive: rock
    size: [0.6, 0.35, 0.5]
    anchor: bottom_center
    offset: [-0.3, 0, -1.0]
    seed: 13
    roughness: 0.1
    material: rock

interactions:
  drink:
    targets: [basin]
    reach: 2.2
    initial: ready
    duration: 1.5
    states:
      ready:    {prompt: "Drink", next: drinking}
      drinking: {emit: drank, then: ready}

rules:
  - id: quench
    on: {signal: self.drank}
    do: [{set: actor.thirst, to: 100}, {notify: "You drink your fill"}]

signals:
  drank: {emit: drank}
