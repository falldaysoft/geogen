# A spear: a long straight shaft with a flint point lashed to the end. The body of
# items/spear.yaml (a carryable physics prop). Origin: bottom centre; lying along Z, point at +Z.
name: spear
tags: [prop.tool]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry
physics: {mass: 1.2, friction: 0.9, bounce: 0.02, carry: true}
parts:
  shaft:
    primitive: extrude
    shape: {circle: 0.015, segments: 10}
    fit: none
    axis: z
    size: [0.03, 0.03, 1.8]
    anchor: bottom_center
    material: bark
  point:                         # a lathed cone, turned to lie along +Z (a centred part turns about the container's middle)
    primitive: lathe
    profile: [[0, 0], [0.025, 0], [0, 0.14]]
    size: [0.05, 0.14, 0.05]
    anchor: center
    segments: 6
    rotation: [90, 0, 0]
    offset: [0, -0.475, 0.97]
    material: charcoal
  lashing:
    primitive: extrude
    shape: {circle: 0.023, segments: 10}
    fit: none
    axis: z
    size: [0.046, 0.046, 0.06]
    anchor: bottom_center
    offset: [0, -0.008, 0.88]
    material: wheat_straw
    collider: none
