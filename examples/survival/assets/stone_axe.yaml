# A stone axe: a stick haft with a stone head lashed on with fibre. The body of
# items/stone_axe.yaml (a carryable physics prop). Origin: bottom centre; lying along Z, head
# at +Z.
name: stone_axe
tags: [prop.tool]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry
physics: {mass: 1.6, friction: 0.9, bounce: 0.02, carry: true}
parts:
  haft:
    primitive: extrude
    shape: {circle: 0.018, segments: 10}
    fit: none
    axis: z
    size: [0.036, 0.036, 0.6]
    anchor: bottom_center
    material: bark
  head:
    primitive: rock
    size: [0.07, 0.2, 0.11]
    anchor: bottom_center
    offset: [0, 0.0, 0.24]
    seed: 2
    roughness: 0.05
    material: rock
  lashing:
    primitive: extrude
    shape: {circle: 0.028, segments: 10}
    fit: none
    axis: z
    size: [0.056, 0.056, 0.05]
    anchor: bottom_center
    offset: [0, -0.01, 0.22]
    material: wheat_straw
    collider: none
