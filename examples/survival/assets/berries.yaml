# A handful of berries on a sprig of leaves. The body of items/berries.yaml (a carryable
# physics prop). Origin: bottom centre.
name: berries
tags: [prop.food]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry
physics: {mass: 0.1, friction: 0.9, bounce: 0.02, carry: true}
parts:
  leaf:
    primitive: cube
    size: [0.12, 0.006, 0.08]
    anchor: bottom_center
    bevel: 0.003
    bevel_segments: 1
    material: foliage_green
  berry: &berry
    primitive: sphere
    size: [0.03, 0.03, 0.03]
    anchor: bottom_center
    offset: [-0.03, 0.006, -0.015]
    segments: 10
    array: {count: 3, step: [0.03, 0, 0]}
    material: berry
    collider: none
  berry_b:
    <<: *berry
    offset: [-0.015, 0.006, 0.015]
    array: {count: 2, step: [0.03, 0, 0]}
  berry_c:
    <<: *berry
    offset: [-0.015, 0.03, 0]
    array: {count: 2, step: [0.03, 0, 0]}
