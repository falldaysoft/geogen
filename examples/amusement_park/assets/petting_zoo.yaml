# A petting zoo: a railed pen of straw with a water trough, hay bales to sit on and a sign,
# and a flock of animals that plod round a loop inside it. The animals are walking items
# (geogen.flows): a source makes `sheep`, `goats` and `pigs` of them once, onto the pen's
# `round` track, which loops, so they keep going at their own paces. The gate gap is at the
# front (+Z). Origin: bottom centre of the pen.

name: petting_zoo
tags: [fair.petting_zoo]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

params:
  width: {default: 12}
  depth: {default: 9}
  sheep: {default: 3}
  goats: {default: 2}
  pigs:  {default: 2}

source:
  items:
    - {item: items/sheep.yaml, weight: "{sheep}"}
    - {item: items/goat.yaml, weight: "{goats}"}
    - {item: items/pig.yaml, weight: "{pigs}"}
  rate: 0.5
  at: let_out
  count: "{sheep + goats + pigs}"
  max_alive: "{sheep + goats + pigs}"

track:
  path: {spline: [["{-width / 2 + 2.5}", 0.06, -1.0], ["{-width / 2 + 2.0}", 0.06, "{depth / 2 - 2.5}"], [0.0, 0.06, "{depth / 2 - 1.8}"],
                  ["{width / 2 - 2.0}", 0.06, "{depth / 2 - 2.5}"], ["{width / 2 - 2.5}", 0.06, "{-depth / 2 + 2.5}"],
                  [0.0, 0.06, "{-depth / 2 + 1.8}"], ["{-width / 2 + 2.5}", 0.06, "{-depth / 2 + 2.3}"]], samples: 6}
  mode: walk
  loop: true
  spacing: 1.0

parts:
  straw:
    primitive: cube
    size: ["{width}", 0.06, "{depth}"]
    anchor: bottom_center
    bevel: 0
    material: wheat_straw
    walkable: true
  rails:
    primitive: fence
    path: [["{-width / 2}", "{-depth / 2}"], ["{width / 2}", "{-depth / 2}"], ["{width / 2}", "{depth / 2}"], ["{-width / 2}", "{depth / 2}"]]
    closed: true
    height: 1.0
    gaps: [["{width + depth + width / 2 - 0.9}", "{width + depth + width / 2 + 0.9}"]]
    offset: [0, 0.06, 0]
    material: wood
  trough:
    primitive: cube
    size: [1.6, 0.4, 0.5]
    anchor: bottom_center
    offset: ["{-width / 2 + 1.0}", 0.06, "{-depth / 2 + 0.8}"]
    bevel: 0.02
    material: wood_dark
  water:
    primitive: cube
    size: [1.5, 0.02, 0.4]
    anchor: bottom_center
    offset: ["{-width / 2 + 1.0}", 0.4, "{-depth / 2 + 0.8}"]
    bevel: 0
    material: water
    collider: none
  bale:
    primitive: cube
    size: [0.9, 0.5, 0.5]
    anchor: bottom_center
    offset: ["{width / 2 - 1.2}", 0.06, "{-depth / 2 + 1.0}"]
    array: {count: 2, step: [0, 0, 0.7]}
    bevel: 0.03
    material: wheat_straw
  sign_post:
    primitive: cylinder
    size: [0.08, 1.8, 0.08]
    anchor: bottom_center
    offset: [2.0, 0.06, "{depth / 2 + 0.3}"]
    material: wood
  sign_board:
    primitive: cube
    size: [1.6, 0.4, 0.05]
    anchor: bottom_center
    offset: [2.0, 1.4, "{depth / 2 + 0.3}"]
    bevel: 0.01
    material: paint_cream
    collider: none
  sign_text:
    primitive: text
    text: "Petting Zoo"
    font: sans
    height: 0.22
    depth: 0.015
    anchor: bottom_center
    offset: [2.0, 1.49, "{depth / 2 + 0.34}"]
    material: paint_red
    collider: none

affordances:
  - {type: sit, at: ["{width / 2 - 1.2}", 0.56, "{-depth / 2 + 1.0}"], facing: 270, height: 0.56, advertises: {rest: 0.2}, tags: [seat, outside]}
  - {type: sit, at: ["{width / 2 - 1.2}", 0.56, "{-depth / 2 + 1.7}"], facing: 270, height: 0.56, advertises: {rest: 0.2}, tags: [seat, outside]}

attachments:
  let_out: {anchor: bottom_center, offset: ["{-width / 2 + 2.5}", 0.06, -1.0], offset_mode: absolute}   # the track's start
