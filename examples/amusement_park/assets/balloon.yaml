# A balloon on a string. The body of items/balloon.yaml (a "Balloons" stall hands them out).
# Origin: the end of the string, where it is held; `colour` is a tint name.
name: balloon
tags: [toy.balloon]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

params:
  colour: {default: car_red, type: text, choices: [car_red, car_blue, taxi_yellow, teal_green, blush, car_white]}

parts:
  string:
    primitive: cylinder
    size: [0.004, 0.7, 0.004]
    anchor: bottom_center
    material: car_paint
    tint: car_white
    collider: none
  knot:
    primitive: sphere
    size: [0.03, 0.03, 0.03]
    anchor: bottom_center
    offset: [0, 0.69, 0]
    material: car_paint
    tint: "{colour}"
    collider: none
  balloon:
    primitive: ellipsoid
    size: [0.3, 0.36, 0.3]
    anchor: bottom_center
    offset: [0, 0.7, 0]
    material: car_paint
    tint: "{colour}"
