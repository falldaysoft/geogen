# The chamber sign by the entry: a backlit panel with the chamber's number,
# a progress bar through the course (`progress`, 0-1), a grid of pictograms (lit for what this
# chamber has: a dropper, a cube, a button, an exit) and the Halcyon
# hex-iris mark. Origin: bottom centre on the wall face, +Z out of the wall.

name: chamber_sign
tags: [decor.sign]
origin: bottom_center
size: [1, 1, 1]
bounds: geometry

params:
  number: { default: "01", type: text }
  total:    { default: "12", type: text }   # chambers in the course
  progress: { default: 0.083 }              # share of the course done, 0-1

parts:
  backing:
    primitive: cube
    size: [1.3, 2.6, 0.08]
    anchor: bottom_center
    offset: [0, 0, 0.04]
    bevel: 0.02
    material: lab_dark
  face:
    primitive: cube
    size: [1.18, 2.48, 0.02]
    anchor: bottom_center
    offset: [0, 0.06, 0.09]
    bevel: 0
    material: sign_glow
    collider: none

  number:
    primitive: text
    text: "{number}"
    height: 0.42
    depth: 0.01
    anchor: center
    offset: [-0.12, 1.62, 0.1]
    material: lab_dark
    collider: none
  of:
    primitive: text
    text: "/{total}"
    height: 0.1
    depth: 0.01
    anchor: center
    offset: [0.37, 1.49, 0.1]
    material: lab_dark
    collider: none
  progress_track:
    primitive: cube
    size: [1.0, 0.03, 0.006]
    anchor: bottom_center
    offset: [0, 1.76, 0.1]
    bevel: 0
    material: lab_metal
    collider: none
  progress_fill:
    primitive: cube
    size: ["{max(progress, 0.01)}", 0.03, 0.008]
    anchor: bottom_center
    offset: ["{-0.5 + 0.5 * max(progress, 0.01)}", 1.76, 0.1]
    bevel: 0
    material: lab_dark
    collider: none
  rule:
    primitive: cube
    size: [1.0, 0.012, 0.006]
    anchor: bottom_center
    offset: [0, 1.56, 0.1]
    bevel: 0
    material: lab_dark
    collider: none

  # Pictograms: three rows of four tiles; the middle row is this chamber's. Lit tiles are dark with a glowing
  # symbol; the rest are faint outlines.
  tile_lit: &tile
    primitive: cube
    size: [0.2, 0.2, 0.006]
    anchor: bottom_center
    offset: [-0.375, 1.0, 0.1]
    array: { count: 4, step: [0.25, 0, 0] }
    bevel: 0.004
    material: lab_dark
    collider: none
  tile_dim:
    <<: *tile
    offset: [-0.375, 0.72, 0.1]
    material: lab_metal
  tile_dim_top:
    <<: *tile
    offset: [-0.375, 1.28, 0.1]
    material: lab_metal
  # dropper: a tube over a falling square
  icon_drop_tube:
    primitive: cube
    size: [0.1, 0.05, 0.006]
    anchor: bottom_center
    offset: [-0.375, 1.14, 0.104]
    bevel: 0
    material: indicator_blue
    collider: none
  icon_drop_box:
    primitive: cube
    size: [0.06, 0.06, 0.006]
    anchor: bottom_center
    offset: [-0.375, 1.04, 0.104]
    bevel: 0
    material: indicator_blue
    collider: none
  # cube: a hexagon in a ring
  icon_cube_ring:
    primitive: extrude
    shape: { outer: { circle: 0.07, segments: 24 }, holes: [{ circle: 0.05, segments: 24 }] }
    fit: none
    axis: z
    size: [0.14, 0.14, 0.006]
    anchor: center
    offset: [-0.125, 0.6, 0.104]
    material: indicator_blue
    collider: none
  icon_cube_hex:
    primitive: extrude
    shape: { ngon: 0.035, sides: 6, rotation: 30 }
    fit: none
    axis: z
    size: [0.07, 0.07, 0.006]
    anchor: center
    offset: [-0.125, 0.6, 0.104]
    material: indicator_blue
    collider: none
  # button: a dome on a plinth
  icon_button_cap:
    primitive: extrude
    shape: { ellipse: [0.05, 0.03], segments: 24 }
    fit: none
    axis: z
    size: [0.1, 0.06, 0.006]
    anchor: center
    offset: [0.125, 0.58, 0.104]
    material: indicator_blue
    collider: none
  icon_button_base:
    primitive: cube
    size: [0.14, 0.025, 0.006]
    anchor: bottom_center
    offset: [0.125, 1.03, 0.104]
    bevel: 0
    material: indicator_blue
    collider: none
  # exit: a doorway with an arrow through it
  icon_exit_door:
    primitive: extrude
    shape: { polygon: [[-0.05, -0.07], [-0.05, 0.07], [0.05, 0.07], [0.05, -0.07], [0.035, -0.07], [0.035, 0.055], [-0.035, 0.055], [-0.035, -0.07]] }
    fit: none
    axis: z
    size: [0.1, 0.14, 0.006]
    anchor: center
    offset: [0.375, 0.6, 0.104]
    material: indicator_blue
    collider: none
  icon_exit_arrow:
    primitive: extrude
    shape: { polygon: [[-0.02, -0.03], [0.0, -0.03], [0.0, -0.045], [0.03, -0.01], [0.0, 0.025], [0.0, 0.01], [-0.02, 0.01]] }
    fit: none
    axis: z
    size: [0.05, 0.07, 0.006]
    anchor: center
    offset: [0.375, 0.6, 0.108]
    material: indicator_orange
    collider: none

  # The Halcyon mark: a hexagonal iris, and the name beside it.
  logo:
    primitive: extrude
    shape: { outer: { ngon: 0.1, sides: 6 }, holes: [{ ngon: 0.05, sides: 6, rotation: 30 }] }
    fit: none
    axis: z
    size: [0.2, 0.18, 0.006]
    anchor: center
    offset: [-0.38, -0.2, 0.1]
    material: lab_dark
    collider: none
  logo_name:
    primitive: text
    text: "HALCYON"
    height: 0.075
    depth: 0.006
    anchor: center
    offset: [0.12, -0.17, 0.1]
    material: lab_dark
    collider: none
  logo_line:
    primitive: text
    text: "APPLIED SCIENCES"
    height: 0.032
    tracking: 0.1
    depth: 0.006
    anchor: center
    offset: [0.12, -0.27, 0.1]
    material: lab_dark
    collider: none
