# A project built on geogen: a street of four houses whose people live their lives. Nobody
# is scripted: each person has needs (hunger, rest, hygiene, ...) and a planner that finds
# chains through what the house offers (fridge -> range -> a chair at the table).
#   python -m geogen.main --project examples/dollhouse --export-catalogue
# The street is played from above (the scene's `play: {as: people}`): Tab picks a person, a click on a
# thing lists what they can do with it, and left alone everyone sees to themselves (F5 names;
# --walk-through to walk about as a player instead):
#   godot --path runtime/godot -- --generated=$PWD/examples/dollhouse/generated
# Walter's week (-- --scene walters_week) is played on foot, as a neighbour: help him once, leave by the
# letterbox, and come back to see what has become of him.
kind: project
name: dollhouse
description: A street of four houses whose people cook, eat, wash and sleep by plans nobody wrote
