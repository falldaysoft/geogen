# A raised flower bed: a timber frame of soil with a row of small shrubs. Somewhere to
# potter: tending it settles the wish for things to be in order and is a little interesting.

name: flower_bed
tags: [garden.bed, decor.planter]
origin: bottom_center

params:
  width: { default: 1.8 }

size: ["{width}", 0.62, 0.6]

parts:
  frame:
    primitive: cube
    size: [1, "{0.26 / 0.62}", 1]
    anchor: bottom_center
    bevel: 0.015
    material: wood_dark
  soil:
    primitive: cube
    size: ["{(width - 0.08) / width}", "{0.02 / 0.62}", "{0.52 / 0.6}"]
    anchor: bottom_center
    offset: [0, "{0.255 / 0.62}", 0]
    bevel: 0
    material: dirt
    collider: none
  shrub_a: &shrub
    primitive: ellipsoid
    size: ["{0.5 / width}", "{0.36 / 0.62}", "{0.5 / 0.6}"]
    anchor: bottom_center
    offset: ["{-0.3}", "{0.26 / 0.62}", 0]
    material: foliage_green
    collider: none
  shrub_b:
    <<: *shrub
    size: ["{0.44 / width}", "{0.3 / 0.62}", "{0.44 / 0.6}"]
    offset: [0, "{0.26 / 0.62}", 0.02]
  shrub_c:
    <<: *shrub
    offset: [0.3, "{0.26 / 0.62}", -0.02]

affordances:
  - { type: stand, action: attend, at: [0, 0, 0.75], approach: [0, 0, 0], facing: 180, duration: [10, 18],
      advertises: { order: 0.3, curiosity: 0.3 }, tags: [garden, outside] }
