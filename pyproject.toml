[project]
name = "geogen"
version = "0.1.0"
description = "Procedural 3D geometry generator for game assets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "trimesh>=4.0",
    "pyglet>=1.5,<2",
    "scipy>=1.10",  # For trimesh graph operations
    "pyyaml>=6.0",
    "pyrender>=0.1.45",  # For offscreen rendering
    "PyOpenGL>=3.1.7",  # Fix numpy 2.x ctypes compatibility
    "Pillow>=9.0",  # For image saving
    "PyQt6>=6.5",  # For interactive viewer UI
    "mapbox-earcut>=1.0",  # Polygon triangulation (extrude caps)
    "shapely>=2.0",  # 2D offsets and boolean ops on profiles
    "manifold3d>=2.4",  # Robust 3D booleans (CSG)
    "fonttools>=4.40",  # Glyph outlines for primitive: text
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.5",  # parallel runs (addopts below); -n0 for a serial run
    "jsonschema>=4.0",  # validates exported extras against docs/schema
]

[project.scripts]
geogen = "geogen.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests sharing an expensive build/export are pinned to one worker (see
# tests/conftest.py pytest_collection_modifyitems).
# -n auto is not one worker per core: conftest's pytest_xdist_auto_num_workers gives 8 for the
# default tier (about 2 GB in all) and 4 for --all, whose workers keep the big scenes they build
# (up to ~4 GB each; 14 of them froze a 24 GB machine).
addopts = "-n auto --dist loadgroup"
markers = [
    "exhaustive: slow, wide coverage (big composite scenes, long simulations); only runs with --all",
    "godot: runs the Godot runtime headless (skipped without Godot); deselect with -m 'not godot'",
]
